}
function mfPlanInstallments(obj,previous,records){
 const spec=mfInstallmentSpec(obj.parcela,!previous);
 if(previous?.installmentGroup){
   const oldSpec=mfInstallmentSpec(previous.parcela);
   if(!spec||!oldSpec||spec.current!==oldSpec.current||spec.total!==oldSpec.total){
     throw new Error(&#x27;As parcelas desta compra já foram geradas. Mantenha a identificação da parcela ao editar este lançamento.&#x27;);
   }
   return {entry:obj,updates:[],added:0};
 }
 if(!spec||spec.total===1)return {entry:obj,updates:[],added:0};
 if(obj.recorrente===&#x27;Sim&#x27;)throw new Error(&#x27;Para gerar parcelas, deixe &quot;Recorrente todo mês?&quot; como Não.&#x27;);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.data)||!Number.isFinite(obj.valor)||obj.valor&lt;=0){
   throw new Error(&#x27;Informe a data e o valor de cada parcela antes de salvar.&#x27;);
 }
 const group=&#x27;parcelas:&#x27;+obj.id;
 // Existing entries already store a per-installment amount; never divide them again.
 const cents=Math.round(obj.valor*100);
 if(!previous&amp;&amp;cents&lt;spec.total)throw new Error(&#x27;O valor total deve permitir pelo menos R$ 0,01 por parcela.&#x27;);
 const amount=number=&gt;previous?obj.valor:(Math.floor(cents/spec.total)+(number&lt;=cents%spec.total?1:0))/100;
 const entry={...obj,valor:amount(spec.current),parcela:spec.current+&#x27;/&#x27;+spec.total,vencimento:obj.vencimento||obj.data,installmentGroup:group};
 const updates=[];
 let added=0;
 for(let number=spec.current+1;number&lt;=spec.total;number++){
   const offset=number-spec.current;
   const data=addMonths(entry.data,offset),vencimento=addMonths(entry.vencimento,offset);
   const parcela=number+&#x27;/&#x27;+spec.total,id=obj.id+&#x27;:parcela:&#x27;+number,valor=amount(number);
   const candidates=records.filter(x=&gt;{
     let other;
     try{other=mfInstallmentSpec(x.parcela);}catch(_){return false;}
     return x.id!==obj.id&amp;&amp;!x.installmentGroup&amp;&amp;other&amp;&amp;other.current===number&amp;&amp;other.total===spec.total&amp;&amp;
       x.tipo===entry.tipo&amp;&amp;x.descricao===entry.descricao&amp;&amp;x.categoria===entry.categoria&amp;&amp;x.banco===entry.banco&amp;&amp;
       Math.round(Number(x.valor)*100)===Math.round(valor*100)&amp;&amp;x.data===data&amp;&amp;
       (x.vencimento||x.data)===vencimento&amp;&amp;x.forma===entry.forma;
   });
   if(candidates.length&gt;1)throw new Error(&#x27;Há mais de um lançamento que pode ser a parcela &#x27;+parcela+&#x27;. Confira os registros antes de gerar as parcelas.&#x27;);
   const occupied=records.find(x=&gt;x.id===id);
   if(occupied&amp;&amp;occupied.installmentGroup!==group)throw new Error(&#x27;Já existe um lançamento com o identificador desta parcela. Confira os registros antes de salvar.&#x27;);
   if(occupied){continue;}
   if(candidates.length){
     updates.push({...candidates[0],installmentGroup:group});
   }else{
     updates.push({...entry,id,data,vencimento,parcela,valor,status:&#x27;Pendente&#x27;,dataBaixa:&#x27;&#x27;,recorrente:&#x27;Não&#x27;});
     added++;
   }
 }
 return {entry,updates,added};
}

 let obj={...(i&gt;=0?items[i]:{}),id,tipo:$(&#x27;tipo&#x27;).value,data:$(&#x27;data&#x27;).value,descricao:$(&#x27;descricao&#x27;).value,categoria:$(&#x27;categoria&#x27;).value,banco:$(&#x27;banco&#x27;).value,valor:+$(&#x27;valor&#x27;).value,status:$(&#x27;status&#x27;).value,vencimento:$(&#x27;vencimento&#x27;).value,forma:$(&#x27;forma&#x27;).value,parcela:$(&#x27;parcela&#x27;).value,recorrente:$(&#x27;recorrente&#x27;).value,obs:$(&#x27;obs&#x27;).value};

 let plan;

 obj=plan.entry;
 if(i&gt;=0) items[i]=obj; else items.push(obj);
 for(const next of plan.updates){
   const existing=items.findIndex(x=&gt;x.id===next.id);
   if(existing&gt;=0)items[existing]=next;else items.push(next);
 }

 if(!editing &amp;&amp; obj.recorrente===&#x27;Sim&#x27;){
   const group=newId();
   obj.recurringGroup=group;
   // Create 11 future copies, for 12 months total including the current entry.
   for(let n=1;n&lt;12;n++){
     const data=addMonths(obj.data,n);
     const venc=obj.vencimento?addMonths(obj.vencimento,n):&#x27;&#x27;;
     items.push({...obj,id:newId(),data,vencimento:venc,recurringGroup:group,status:&#x27;Pendente&#x27;,dataBaixa:&#x27;&#x27;});
   }
   alert(&#x27;Lançamento recorrente criado para 12 meses. Os próximos meses ficaram como Pendentes.&#x27;);
 }
 persist();dlg.close();
 if(plan.added)alert(`${plan.added} parcela(s) futura(s) criada(s) como Pendentes. ${editing?&#x27;O valor das parcelas já salvas foi mantido.&#x27;:&#x27;O valor total foi dividido entre as parcelas, preservando o total da compra.&#x27;}`);
}
