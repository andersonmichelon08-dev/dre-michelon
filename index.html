let dreBuscaSeq=0;
async function dreLocalizarOrigem(){
 const b=document.getElementById('dreGPS'),campo=document.getElementById('dreOrigem');
 if(!b||!campo)return;
 if(!navigator.geolocation){b.textContent='GPS indisponível — digite o endereço';return;}
 b.disabled=true;b.textContent='📍 Localizando...';
 navigator.geolocation.getCurrentPosition(async p=>{
  const coords=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);
  try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat='+encodeURIComponent(p.coords.latitude)+'&lon='+encodeURIComponent(p.coords.longitude),{headers:{'Accept':'application/json'}});
   if(!r.ok)throw Error('Endereço indisponível');const j=await r.json();campo.value=j.display_name||coords;
  }catch(e){campo.value=coords;}
  b.disabled=false;b.textContent='📍 Atualizar localização';
 },()=>{b.disabled=false;b.textContent='📍 Permita o GPS ou digite o endereço';},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function drePrepararEnderecos(){
 for(const [id,listId] of [['dreOrigem','dreOrigemLista'],['dreDestino','dreDestinoLista']]){
  const input=document.getElementById(id),list=document.getElementById(listId);if(!input||!list)continue;
  let timer,seq=0;input.addEventListener('input',()=>{clearTimeout(timer);const value=input.value.trim(),n=++seq;list.replaceChildren();if(value.length<3)return;
   timer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&limit=5&q='+encodeURIComponent(value));if(!r.ok)throw Error('Busca indisponível');const data=await r.json();if(n!==seq)return;
    for(const item of data){const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.style.cssText='display:block;width:100%;text-align:left;margin:2px 0;font-size:13px;white-space:normal';btn.textContent=item.display_name;btn.onclick=()=>{input.value=item.display_name;list.replaceChildren();++seq};list.appendChild(btn)}
   }catch(e){if(n===seq)list.textContent='Busca indisponível. Digite o endereço manualmente.'}},550);
  });
 }
}

unt]||0)+v;db.movements.push({id:uid(),name:'Recebimento: '+entry.name,value:v,date:x.date,account:x.account,kind:'in',entryId:entry.id});}else if(form==='payment'){if(v>Number(db.balances[x.account]||0)&&!confirm('O saldo ficará negativo. Confirmar?'))return;db.balances[x.account]=Number(db.balances[x.account]||0)-v;db.movements.push({id:uid(),name:x.name,value:v,date:x.date,account:x.account,kind:'out'});}else if(form==='bill')db.bills.push({id:uid(),name:x.name,value:v,month,paid:false});else if(form==='agenda'){if(x.date===LEGACY_BOOKING.date&&x.name.trim().toLowerCase()===LEGACY_BOOKING.name.toLowerCase()){alert('Esta reserva já existe no backup antigo (MV-2026-0001). Não será duplicada.');return}if(db.agenda.some(a=>a.date===x.date&&a.name.trim().toLowerCase()===x.name.trim().toLowerCase())){alert('Já existe agendamento para este cliente nesta data. Confira antes de duplicar.');return}db.agenda.push({id:uid(),name:x.name,route:x.route,date:x.date});}else if(['expense','uberexpense'].includes(form))db.expenses.push({id:uid(),name:x.name,value:v,date:x.date,category:form==='uberexpense'?'uber':'geral',paid:false});else {if(db.entries.some(a=>a.type===form&&a.date===x.date&&a.name.trim().toLowerCase()===x.name.trim().toLowerCase()&&Math.abs(a.value-v)<0.005)){alert('Lançamento idêntico já registrado. Confira antes de lançar novamente.');return}db.entries.push({id:uid(),type:form,name:x.name,value:v,date:x.date,received:false});}if(!save()){db=JSON.parse(before);alert('Registro não confirmado: armazenamento indisponível.');return}form='';render()}function saveQuote(e){e.preventDefault();const before=JSON.stringify(db);const x=Object.fromEntries(new FormData(e.target));if(!Number.isFinite(Number(x.value))||Number(x.value)<=0||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)){alert('Confira a data e o valor do orçamento.');return}db.quotes.push({id:uid(),client:x.client,origin:x.origin,destination:x.destination,value:Number(x.value),date:x.date,status:'Orçamento'});if(!save()){db=JSON.parse(before);alert('Orçamento não confirmado: armazenamento indisponível.');return}form='';render()}function confirmQuote(id){const before=JSON.stringify(db);const q=db.quotes.find(x=>x.id===id);if(!q||q.status==='Confirmada')return;if(!q.date){alert('Orçamento antigo sem data. Cadastre uma reserva com a data correta.');return}if(!confirm('Confirmar reserva de '+q.client+' em '+q.date+'? Não será lançada receita automaticamente.'))return;const duplicate=db.agenda.some(x=>x.quoteId===q.id||(x.date===q.date&&x.name.trim().toLowerCase()===q.client.trim().toLowerCase()))||(q.client.trim().toLowerCase()===LEGACY_BOOKING.name.toLowerCase()&&q.date===LEGACY_BOOKING.date);if(duplicate){alert('Esta reserva já consta na agenda.');return}q.status='Confirmada';db.agenda.push({id:uid(),quoteId:q.id,name:q.client,route:q.origin+' → '+q.destination,date:q.date});if(!save()){db=JSON.parse(before);alert('Reserva não confirmada porque não foi possível salvar.');return}render()}function shareQuote(id){const x=db.quotes.find(q=>q.id===id);if(!x)return;const msg=`*MICHELON VIAGENS EXECUTIVAS*\n*Orçamento de viagem*\nCliente: ${x.client}\nEmbarque: ${x.origin}\nDestino: ${x.destination}\n*Valor total: ${money(x.value)}*`;if(navigator.share){navigator.share({title:'Orçamento Michelon',text:msg}).catch(()=>{})}else{navigator.clipboard?.writeText(msg).then(()=>alert('Orçamento copiado. Cole no WhatsApp.')).catch(()=>prompt('Copie o orçamento:',msg))||prompt('Copie o orçamento:',msg)}}function payExpense(id){const before=JSON.stringify(db);const x=db.expenses.find(e=>e.id===id);if(!x||x.paid)return;let account=prompt('Pagar pela conta itau ou uber?','itau');if(account===null)return;account=account.trim().toLowerCase();if(!['itau','uber'].includes(account)){alert('Escolha itau ou uber.');return}if(!confirm('Confirmar pagamento de '+money(x.value)+'?'))return;x.paid=true;x.account=account;x.paidDate=today();db.balances[account]=Number(db.balances[account]||0)-x.value;db.movements.push({id:uid(),name:'Despesa: '+x.name,value:x.value,date:today(),account,kind:'out',expenseId:x.id});if(!save()){db=JSON.parse(before);return}render()}function toggleBill(id){const before=JSON.stringify(db);let x=db.bills.find(x=>x.id===id);if(!x)return;if(x.paid){alert('Pagamento já confirmado. Para corrigir, registre um ajuste no saldo e confira o histórico.');return}let account=prompt('Pagar por qual conta? Digite itau ou uber:','itau');if(account===null)return;account=account.trim().toLowerCase();if(!['itau','uber'].includes(account)){alert('Conta inválida.');return}if(!confirm('Confirmar pagamento de '+money(x.value)+' na conta '+(account==='itau'?'Itaú':'Uber')+'?'))return;x.paid=true;x.account=account;db.balances[account]=Number(db.balances[account]||0)-x.value;db.movements.push({id:uid(),name:'Conta fixa: '+x.name,value:x.value,date:today(),account,kind:'out',billId:x.id});if(!save()){db=JSON.parse(before);return}render()}function receipt(id){const m=db.movements.find(x=>x.id===id&&x.kind==='in'&&x.entryId);if(!m)return;const entry=db.entries.find(x=>x.id===m.entryId);if(!entry||!entry.received){alert('Recebimento não confirmado.');return}if(entry.type!=='viagens'){alert('Recibo de viagem disponível somente para receitas de Viagens.');return}const content='MICHELON VIAGENS EXECUTIVAS\nRECIBO DE PAGAMENTO\nDescrição: '+entry.name+'\nData do recebimento: '+m.date+'\nValor recebido: '+money(m.value)+'\nConta: '+(m.account==='itau'?'Itaú':'Uber')+'\nDocumento de teste';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(content).then(()=>alert('Recibo de teste copiado.')).catch(()=>prompt('Copie o recibo:',content))}else prompt('Copie o recibo:',content)}function validCalendarDate(v){if(typeof v!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d}function validCalendarMonth(v){if(typeof v!=='string'||!/^[0-9]{4}-[0-9]{2}$/.test(v))return false;const [y,m]=v.split('-').map(Number);return y>=2000&&y<=2100&&m>=1&&m<=12}function bookingKey(x){return String(x.date||'')+'|'+String(x.name||'').trim().toLocaleLowerCase('pt-BR')}function auditData(d){if(!d||!Array.isArray(d.entries)||!Array.isArray(d.expenses)||!Array.isArray(d.bills)||!Array.isArray(d.agenda)||!d.balances||!['itau','uber'].every(k=>typeof d.balances[k]==='number'&&Number.isFinite(d.balances[k])))return 'Estrutura ou saldos inválidos';const all=[...d.entries,...d.expenses,...d.bills,...d.agenda,...(d.quotes||[]),...(d.movements||[])];if(all.some(x=>!x||typeof x.id!=='string'||!x.id))return 'Registro sem identificação válida';if(new Set(all.map(x=>x.id)).size!==all.length)return 'Identificações duplicadas';if([...d.entries,...d.expenses,...d.bills,...(d.quotes||[]),...(d.movements||[])].some(x=>typeof x.value!=='number'||!Number.isFinite(x.value)||x.value<=0))return 'Valores inválidos';if(d.entries.some(x=>x.received&&!d.movements?.some(m=>m.kind==='in'&&m.entryId===x.id)))return 'Recebimento sem movimentação';if(d.expenses.some(x=>x.paid&&!d.movements?.some(m=>m.kind==='out'&&m.expenseId===x.id)))return 'Despesa paga sem movimentação';const ms=d.movements||[];if(ms.some(m=>!['in','out'].includes(m.kind)||!['itau','uber'].includes(m.account)))return 'Movimentação com tipo ou conta inválidos';if(ms.some(m=>m.entryId&&(!d.entries.some(e=>e.id===m.entryId)||m.kind!=='in')))return 'Movimentação de receita sem vínculo válido';if(ms.some(m=>m.expenseId&&(!d.expenses.some(e=>e.id===m.expenseId)||m.kind!=='out')))return 'Movimentação de despesa sem vínculo válido';if(ms.some(m=>m.billId&&(!d.bills.some(b=>b.id===m.billId)||m.kind!=='out')))return 'Movimentação de conta fixa sem vínculo válido';for(const key of ['entryId','expenseId','billId']){const linked=ms.filter(m=>m[key]);if(new Set(linked.map(m=>m[key])).size!==linked.length)return 'Pagamento ou recebimento duplicado'}if(d.entries.some(e=>e.received&&ms.some(m=>m.entryId===e.id&&Math.abs(m.value-e.value)>0.005)))return 'Valor recebido diferente da receita';if(d.expenses.some(e=>e.paid&&ms.some(m=>m.expenseId===e.id&&Math.abs(m.value-e.value)>0.005)))return 'Pagamento diferente da despesa';if(d.bills.some(b=>b.paid&&!ms.some(m=>m.billId===b.id)))return 'Conta paga sem movimentação';if(ms.some(m=>m.billId&&d.bills.find(b=>b.id===m.billId)&&!d.bills.find(b=>b.id===m.billId).paid))return 'Movimentação de conta não confirmada';if(ms.some(m=>m.entryId&&!d.entries.find(e=>e.id===m.entryId)?.received))return 'Movimentação de receita não confirmada';if(ms.some(m=>m.expenseId&&!d.expenses.find(e=>e.id===m.expenseId)?.paid))return 'Movimentação de despesa não confirmada';if(ms.some(m=>m.billId&&!d.bills.find(b=>b.id===m.billId)?.paid))return 'Movimentação de conta não confirmada';if(ms.some(m=>m.billId&&Math.abs(m.value-d.bills.find(b=>b.id===m.billId).value)>0.005))return 'Valor pago diferente da conta';if(d.entries.some(e=>e.received&&!['itau','uber'].includes(e.receivedAccount)))return 'Recebimento sem conta válida';if(d.entries.some(e=>e.received&&ms.some(m=>m.entryId===e.id&&m.account!==e.receivedAccount)))return 'Conta de recebimento divergente';if(d.expenses.some(e=>e.paid&&!['itau','uber'].includes(e.account)))return 'Despesa paga sem conta válida';if(d.bills.some(b=>b.paid&&!['itau','uber'].includes(b.account)))return 'Conta paga sem banco válido';if(ms.some(m=>m.expenseId&&m.account!==d.expenses.find(e=>e.id===m.expenseId).account))return 'Banco de despesa divergente';if(ms.some(m=>m.billId&&m.account!==d.bills.find(b=>b.id===m.billId).account))return 'Banco de conta divergente';if(d.entries.some(e=>!validCalendarDate(e.date))||d.expenses.some(e=>!validCalendarDate(e.date))||ms.some(m=>!validCalendarDate(m.date)))return 'Data de lançamento inválida';if(ms.some(m=>m.entryId&&m.kind!=='in')||ms.some(m=>(m.expenseId||m.billId)&&m.kind!=='out'))return 'Sentido de movimentação incorreto';if(ms.some(m=>[m.entryId,m.expenseId,m.billId].filter(Boolean).length>1))return 'Movimentação vinculada a mais de um lançamento';if(d.agenda.some(a=>!validCalendarDate(a.date)))return 'Data da agenda inválida';if((d.quotes||[]).some(q=>q.date&&!validCalendarDate(q.date)))return 'Data de orçamento inválida';if(d.bills.some(b=>!validCalendarMonth(b.month)))return 'Mês de conta fixa inválido';if(d.agenda.some(a=>!a.name||!String(a.name).trim()))return 'Reserva sem cliente';if(new Set(d.agenda.map(bookingKey)).size!==d.agenda.length)return 'Reservas duplicadas na agenda';if(d.agenda.some(a=>bookingKey(a)===bookingKey({date:LEGACY_BOOKING.date,name:LEGACY_BOOKING.name})))return 'Reserva histórica duplicada na agenda';return ''}function verifyNow(){const issue=auditData(db);if(issue){alert('Conferência encontrou um problema: '+issue+'. Faça backup e revise antes de continuar.')}else{alert('Conferência concluída: estrutura, valores e vínculos de pagamentos/recebimentos consistentes. Isto não substitui o teste no iPhone.')}}function testStorage(){const key=STORE+'_diagnostico_temporario';let wrote=false;try{const audit=auditData(db);if(audit)throw Error('Conferência de dados: '+audit);const payload=JSON.stringify({format:STORE,data:db});const decoded=JSON.parse(payload);if(decoded.format!==STORE||auditData(decoded.data))throw Error('Falha na serialização do backup');const probe=JSON.stringify({token:uid(),payload});localStorage.setItem(key,probe);wrote=true;const read=localStorage.getItem(key);if(read!==probe)throw Error('O navegador não confirmou a leitura dos dados gravados');const restored=JSON.parse(JSON.parse(read).payload);if(restored.format!==STORE||auditData(restored.data))throw Error('Falha ao recuperar os dados do teste');alert('Teste local aprovado: dados conferidos, gravados, relidos e restaurados em memória. Nenhum registro real foi alterado. Ainda é necessário testar no iPhone.')}catch(err){alert('Teste de salvamento não aprovado: '+err.message+'\nNão registre dados reais antes da validação.')}finally{if(wrote){try{localStorage.removeItem(key)}catch(e){}}}}function backup(){const issue=auditData(db);if(issue){if(!confirm('Atenção: a conferência encontrou '+issue+'. Deseja exportar uma cópia de segurança mesmo assim?'))return}let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({format:STORE,data:db},null,2)],{type:'application/json'}));a.href=url;a.download='DRE_Michelon_Backup_Teste_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(![...OLDER_STORES,PREVIOUS_STORE,STORE].includes(x.format)||!x.data||!Array.isArray(x.data.entries)||!Array.isArray(x.data.expenses)||!Array.isArray(x.data.bills)||!Array.isArray(x.data.agenda)||!x.data.balances||!Number.isFinite(Number(x.data.balances.itau))||!Number.isFinite(Number(x.data.balances.uber))||!['entries','expenses','bills'].every(k=>x.data[k].every(y=>y&&typeof y.id==='string'&&Number.isFinite(Number(y.value))&&Number(y.value)>0))||!['quotes','movements'].every(k=>x.data[k]===undefined||Array.isArray(x.data[k])))throw Error('Backup incompatível ou com valores inválidos');const audit=auditData(x.data);if(audit)throw Error(audit);if(confirm('Substituir os registros desta versão de teste? Faça backup antes.')){const previous=db;db=x.data;db.quotes??=[];db.movements??=[];if(!save()){db=previous;throw Error('Não foi possível armazenar o backup restaurado')}render()}}catch(err){alert('Erro ao restaurar: '+err.message)}e.target.value=''}function reset(){if(!confirm('Iniciar novembro zerado? A reserva de 03/12 será preservada. Um backup será preparado antes da limpeza.'))return;const issue=auditData(db);if(issue){alert('Conferência encontrou: '+issue+'. Nenhum dado apagado.');return}const snapshot=JSON.stringify({format:STORE,data:db,archivedAt:new Date().toISOString()});try{localStorage.setItem(STORE+'_arquivo_antes_novembro_2026',snapshot);if(localStorage.getItem(STORE+'_arquivo_antes_novembro_2026')!==snapshot)throw Error('Falha')}catch(e){alert('Backup não confirmado. Nenhum dado apagado.');return}const url=URL.createObjectURL(new Blob([snapshot],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='DRE_Michelon_Backup_Antes_Novembro_2026.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);if(!confirm('Confirme que o backup foi salvo em Arquivos no iPhone. Somente depois pressione OK para apagar os lançamentos.'))return;const before=db;db=fresh();if(!save()){db=before;return}month='2026-11';form='';render();alert('Novembro zerado. Reserva de 03/12 preservada, sem receita financeira.')}
try{render()}catch(err){document.getElementById('content').innerHTML='<p>Erro ao iniciar: '+String(err.message)+'</p>'}</script><script id="michelon-formulario">const MICHELON_FORM_HTML="<!doctype html><html lang=\"pt-BR\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Michelon • Solicitar orçamento</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#eaf4ff;color:#1c426b;margin:0;padding:12px;overflow-x:hidden}.wrap{max-width:550px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 2px 10px #b7d4ee}h1{font-size:25px}label{display:block;font-weight:bold;margin:14px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid #accbe8;border-radius:10px;font:inherit}button{width:100%;max-width:100%;white-space:normal;overflow-wrap:anywhere;background:#086bb7;color:white;border:0;padding:17px;border-radius:12px;font-weight:bold;font-size:17px;margin-top:20px}.note{font-size:13px}</style><div class=\"wrap\"><h1>🚐 Solicitar Orçamento</h1><p>Michelon Viagens Executivas · Limeira – SP</p><form id=\"f\"><label>Seu nome *</label><input name=\"Nome\" required autocomplete=\"name\"><label>WhatsApp para contato *</label><input name=\"Telefone\" type=\"tel\" required autocomplete=\"tel\"><label>Origem *</label><input id=\"micOrigem\" name=\"Origem\" required autocomplete=\"off\" placeholder=\"Digite a origem ou use o GPS\"><button type=\"button\" id=\"micGPS\" style=\"margin-top:7px;padding:10px\">📍 Usar minha localização atual</button><div id=\"micOrigemLista\"></div><label>Destino *</label><input id=\"micDestino\" name=\"Destino\" required autocomplete=\"off\" placeholder=\"Digite a cidade, rua ou local\"><div id=\"micDestinoLista\"></div><label>Data da viagem *</label><input name=\"Data\" type=\"date\" required><label>Horário *</label><input name=\"Horário\" type=\"time\" required><label>Passageiros</label><input name=\"Passageiros\" type=\"number\" min=\"1\" value=\"1\"><label>Tipo de viagem</label><select name=\"Tipo\"><option>Somente ida</option><option>Ida e volta</option><option>À disposição</option></select><label>Informações adicionais</label><textarea name=\"Observações\" rows=\"3\"></textarea><button type=\"submit\">Enviar solicitação pelo WhatsApp</button></form><p class=\"note\">O WhatsApp só será aberto depois que você preencher e enviar o formulário.</p></div><script>(function(){\nconst by=id=>document.getElementById(id);\nasync function gps(){const btn=by('micGPS');if(!navigator.geolocation){btn.textContent='Localização indisponível: digite o endereço';return;}btn.disabled=true;btn.textContent='📍 Localizando...';navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+latitude+'&lon='+longitude+'&zoom=18&addressdetails=1');if(!r.ok)throw Error('Sem endereço');const d=await r.json();by('micOrigem').value=d.display_name||latitude+', '+longitude;btn.textContent='📍 Atualizar localização';}catch(e){by('micOrigem').value=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);btn.textContent='📍 Coordenadas obtidas (edite o endereço)';}btn.disabled=false;},()=>{btn.textContent='📍 Permitir localização ou digitar manualmente';btn.disabled=false;},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});}\nby('micGPS').addEventListener('click',gps);\nconst cidades=['Campinas, São Paulo, Brasil','Limeira, São Paulo, Brasil','São Paulo, São Paulo, Brasil','Americana, São Paulo, Brasil','Piracicaba, São Paulo, Brasil','Santa Bárbara d’Oeste, São Paulo, Brasil','Rio Claro, São Paulo, Brasil','Sumaré, São Paulo, Brasil','Hortolândia, São Paulo, Brasil','Jundiaí, São Paulo, Brasil','Atibaia, São Paulo, Brasil','Indaiatuba, São Paulo, Brasil','Sorocaba, São Paulo, Brasil','Ribeirão Preto, São Paulo, Brasil','Guarulhos, São Paulo, Brasil','Santos, São Paulo, Brasil','Rio de Janeiro, Rio de Janeiro, Brasil','Belo Horizonte, Minas Gerais, Brasil','Curitiba, Paraná, Brasil','Brasília, Distrito Federal, Brasil'];\nconst norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();\nfor(const [inputId,listId] of [['micOrigem','micOrigemLista'],['micDestino','micDestinoLista']]){\n const input=by(inputId),list=by(listId);let timer,seq=0;\n list.style.cssText='background:white;border-radius:8px;overflow:hidden;max-width:100%;';\n function add(label){if([...list.children].some(x=>x.textContent===label))return;const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='display:block;width:100%;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:left;background:#f1f7ff;color:#17466f;border:0;border-bottom:1px solid #dce9f5;padding:12px;font-size:15px;margin:0';b.addEventListener('click',()=>{input.value=label;list.innerHTML='';clearTimeout(timer);++seq});list.appendChild(b)}\n input.addEventListener('input',()=>{clearTimeout(timer);const value=input.value.trim(),n=++seq;list.innerHTML='';if(value.length<2)return;\n // Resposta imediata mesmo quando o serviço de mapas estiver indisponível.\n cidades.filter(c=>norm(c).includes(norm(value))).slice(0,6).forEach(add);\n if(value.length<3)return;\n timer=setTimeout(async()=>{try{\n const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),7000);\n let data=[];\n try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=br&limit=6&q='+encodeURIComponent(value),{signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('Consulta indisponível');data=await r.json()}finally{clearTimeout(timeout)}\n if(n!==seq)return;\n for(const item of data){const a=item.address||{};add([a.road,a.house_number,a.suburb,a.city||a.town||a.village||a.municipality||a.county,a.state].filter(Boolean).join(', ')||item.display_name)}\n if(!list.children.length)list.textContent='Nenhum endereço encontrado. Você pode continuar digitando manualmente.';\n }catch(e){if(n===seq&&!list.children.length)list.textContent='Busca online indisponível. Digite o endereço completo manualmente.'}},450);\n });\n}\nif(!window.isSecureContext)by('micGPS').textContent='📍 GPS disponível somente no site HTTPS';\n})();\ndocument.getElementById('f').addEventListener('submit',function(e){e.preventDefault();let dados=new FormData(this),msg='*Solicitação de orçamento — Michelon Viagens Executivas*\\n\\n'+Array.from(dados.entries()).map(([k,v])=>k+': '+v).join('\\n');window.parent.postMessage({tipo:'michelon-enviar-orcamento',texto:msg},'*')});<\\/script></html>";function abrirFormularioMichelon(){const modal=document.getElementById('cartao-modal'),f=document.getElementById('cartao-frame');modal.classList.add('aberto');f.srcdoc=MICHELON_FORM_HTML;}async function compartilharCartaoMichelon(){const u=new URL(location.href);u.searchParams.set('orcamento','1');u.hash='';const link=u.href;try{if(navigator.share){await navigator.share({title:'Michelon Viagens Executivas',text:'Solicite seu orçamento de viagem:',url:link});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(link);alert('Link do orçamento copiado! Cole no WhatsApp ou onde desejar.')}catch(e){prompt('Copie o link do orçamento:',link)}}window.addEventListener('message',e=>{if(e.source!==document.getElementById('cartao-frame').contentWindow)return;if(e.data==='michelon-orcamento')abrirFormularioMichelon();if(e.data==='michelon-compartilhar')compartilharCartaoMichelon();if(e.data&&e.data.tipo==='michelon-enviar-orcamento'&&typeof e.data.texto==='string'){window.location.href='https://wa.me/5519992462362?text='+encodeURIComponent(e.data.texto)}});function abrirOrcamentoPorLink(){if(new URLSearchParams(location.search).get('orcamento')==='1')abrirFormularioMichelon()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',abrirOrcamentoPorLink);else abrirOrcamentoPorLink();</script><script>

/* Exportação somente leitura: não altera lançamentos, reserva ou saldos. */
function exportarFinanceiroCSV(){
 try{
  const escapeCSV=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const linhas=[['Tipo','Data','Descrição','Categoria/Conta','Valor','Situação','Identificador']];
  const add=(tipo,items,fn)=>{(Array.isArray(items)?items:[]).forEach(x=>linhas.push([tipo,...fn(x)]))};
  add('Receita',db.entries,x=>[x.date,x.name,x.type,x.value,x.received?'Recebida':'Pendente',x.id]);
  add('Despesa',db.expenses,x=>[x.date,x.name,x.category,x.value,x.paid?'Paga':'Pendente',x.id]);
  add('Conta fixa',db.bills,x=>[x.month,x.name,'Fixa',x.value,x.paid?'Paga':'Pendente',x.id]);
  add('Movimentação',db.movements,x=>[x.date,x.name,x.account,x.kind==='out'?-Number(x.value||0):x.value,x.kind==='in'?'Entrada':'Saída',x.id]);
  const csv='\uFEFF'+linhas.map(r=>r.map(escapeCSV).join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download='Michelon_Financeiro_Conferencia_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(e){alert('Não foi possível exportar: '+e.message)}
}

document.addEventListener('DOMContentLoaded',function(){
 const observer=new MutationObserver(function(){
  if(typeof tab==='undefined'||tab!=='financeiro')return;
  setTimeout(function(){
    if(document.getElementById('michelon-exportar-financeiro'))return;
    const main=document.getElementById('content');
    if(!main)return;
    const b=document.createElement('button');
    b.id='michelon-exportar-financeiro';
    b.textContent='Exportar financeiro (CSV)';
    b.className='secondary';
    b.type='button';
    b.onclick=exportarFinanceiroCSV;
    main.prepend(b);
