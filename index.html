let urbanoResolvido={origem:null,destino:null,parada:null};

async function buscarEnderecoUrbano(inp,listId,tipo){
 const box=$(listId), texto=String(inp.value||'').trim();
 if(texto.length&lt;3){box.style.display='none';return}
 const cidade=String($('cidadeUrbana')?.value||'Limeira, SP').trim();
 const norm2=s=&gt;String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

 // Sugestões locais úteis e instantâneas; busca online complementa.
 const locaisLimeira=[
   'Shopping Pátio Limeira, Limeira, SP',
   'Horto Florestal de Limeira, Limeira, SP',
   'Rodoviária de Limeira, Limeira, SP',
   'Prefeitura Municipal de Limeira, Limeira, SP'
 ];
 let ach=[];
 if(norm2(cidade).includes('limeira')){
   ach=locaisLimeira.filter(x=&gt;norm2(x).includes(norm2(texto))).map(nome=&gt;({nome,lat:null,lon:null}));
 }

 try{
   const consultas=[
     texto+', '+cidade+', Brasil',
     texto.replace(/\b(?:n|nº|n°|numero|número)\s*\.?\s*(\d+)/gi,', $1')+', '+cidade+', Brasil'
   ];
   for(const q of [...new Set(consultas)]){
     const u='https://nominatim.openstreetmap.org/search?format=jsonv2&amp;addressdetails=1&amp;namedetails=1&amp;limit=12&amp;countrycodes=br&amp;q='+encodeURIComponent(q);
     const r=await fetchTimeout(u,6000);
     if(!r.ok)continue;
     const j=await r.json();
     for(const x of (j||[])){
       const nome=x.display_name||x.name;
       if(nome &amp;&amp; norm2(nome).includes(norm2(cidade.split(',')[0])) &amp;&amp; !ach.some(a=&gt;norm2(a.nome)===norm2(nome))){
         ach.push({nome,lat:+x.lat,lon:+x.lon});
       }
     }
     if(j&amp;&amp;j.length)break;
   }
 }catch(e){}

 box.innerHTML='';
 ach.slice(0,12).forEach(item=&gt;{
   const d=document.createElement('div');
   d.className='cityitem';
   d.textContent=item.nome;
   d.onclick=async()=&gt;{
     inp.value=item.nome;
     box.style.display='none';
     let p=item;
     if(p.lat==null||p.lon==null){
       try{p=await localizarUmEndereco(item.nome)}catch(e){}
     }
     if(p&amp;&amp;p.lat!=null){
       urbanoResolvido[tipo]={lat:+p.lat,lon:+p.lon,nome:p.nome||item.nome};
       const st=$('statusEnderecos');
       if(st)st.textContent='✅ Local selecionado. Selecione os demais endereços e calcule a rota.';
     }
   };
   box.appendChild(d);
 });
 box.style.display=ach.length?'block':'none';
}

async function localizarRuaPorCepGratis(semNumero, numero, cidadePadrao){
 const cidade=(cidadePadrao.split(',')[0]||'').trim();
 const uf=((cidadePadrao.split(',')[1]||'SP').trim()||'SP').toUpperCase();
 let rua=String(semNumero||'').trim();
 if(!rua||!cidade)return null;

 // ViaCEP pesquisa por endereço e devolve CEP/bairro/logradouro.
 try{
   const u='https://viacep.com.br/ws/'+encodeURIComponent(uf)+'/'+encodeURIComponent(cidade)+'/'+encodeURIComponent(rua)+'/json/';
   const r=await fetchTimeout(u,7000);
   if(r.ok){
     const lista=await r.json();
     if(Array.isArray(lista)&amp;&amp;lista.length){
       const norm=s=&gt;String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');
       const alvo=norm(rua).replace(/^(rua|avenida|av|r)\s+/,'').trim();
       const score=x=&gt;{
         const log=norm(x.logradouro).replace(/^(rua|avenida|av|r)\s+/,'').trim();
         let s=0;
         for(const p of alvo.split(/\s+/).filter(v=&gt;v.length&gt;2)) if(log.includes(p))s+=4;
         if(log===alvo)s+=20;
         return s;
       };
       const d=[...lista].sort((a,b)=&gt;score(b)-score(a))[0];
       const cep=String(d.cep||'').replace(/\D/g,'');
       if(cep){
         // BrasilAPI v2 pode devolver coordenadas do CEP sem chave/API paga.
         try{
           const br=await fetchTimeout('https://brasilapi.com.br/api/cep/v2/'+cep,7000);
           if(br.ok){
             const bj=await br.json();
             const c=bj?.location?.coordinates||{};
             const lat=parseFloat(c.latitude), lon=parseFloat(c.longitude);
             if(Number.isFinite(lat)&amp;&amp;Number.isFinite(lon)&amp;&amp;lat!==0&amp;&amp;lon!==0){
               const nome=[d.logradouro,numero,d.bairro,d.localidade,d.uf,d.cep,'Brasil'].filter(Boolean).join(', ');
               return {lat,lon,nome,numeroConfirmado:false,precisao:'CEP'};
             }
           }
         }catch(e){}

         // Última tentativa: endereço enriquecido com bairro e CEP no Nominatim.
         const completo=[d.logradouro,d.bairro,d.localidade,d.uf,d.cep,'Brasil'].filter(Boolean).join(', ');
         try{
           const nu='https://nominatim.openstreetmap.org/search?format=jsonv2&amp;limit=5&amp;countrycodes=br&amp;addressdetails=1&amp;q='+encodeURIComponent(completo);
           const nr=await fetchTimeout(nu,7000);
           if(nr.ok){
             const nj=await nr.json();
             if(nj&amp;&amp;nj[0]){
               return {lat:+nj[0].lat,lon:+nj[0].lon,nome:nj[0].display_name||completo,numeroConfirmado:false,precisao:'rua/CEP'};
             }
           }
         }catch(e){}
       }
     }
   }
 }catch(e){}
 return null;
}

async function localizarUmEndereco(texto){
 let original=String(texto||'').trim();
 if(!original)throw new Error('Informe o endereço ou local.');

 const cidadePadrao=String($('cidadeUrbana')?.value||'Limeira, SP').trim();

 // Aceita: &quot;n 366&quot;, &quot;nº 366&quot;, &quot;numero 366&quot; ou apenas &quot;366&quot;.
 original=original
   .replace(/\b(?:n|nº|n°|numero|número)\s*\.?\s*(\d+)/gi, ', $1')
   .replace(/\s*,\s*/g, ', ')
   .replace(/\s+/g,' ')
   .trim();

 const semNumero=original.replace(/,?\s*\d+\s*$/,'').trim();
 const num=(original.match(/(\d+)\s*$/)||[])[1]||'';

 // Várias formas gratuitas de consulta. Algumas ruas do OSM não respondem bem
 // quando o número da casa é enviado junto.
 const tentativas=[
   original+', '+cidadePadrao+', Brasil',
   semNumero+', '+cidadePadrao+', Brasil',
   original+', Brasil',
   semNumero+', Brasil'
 ];

 for(const q of [...new Set(tentativas)]){
  try{
   const u='https://nominatim.openstreetmap.org/search?format=jsonv2&amp;addressdetails=1&amp;namedetails=1&amp;limit=10&amp;countrycodes=br&amp;q='+encodeURIComponent(q);
   const r=await fetchTimeout(u,7000);
   if(!r.ok)continue;
   const j=await r.json();
   if(j&amp;&amp;j.length){
     const norm2=s=&gt;String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
     const cidadeN=norm2(cidadePadrao.split(',')[0]);
     const ruaN=norm2(semNumero).replace(/^(rua|avenida|av|r)\s+/,'').trim();
     const candidatos=j.filter(x=&gt;norm2(x.display_name||'').includes(cidadeN));
     const pool=candidatos.length?candidatos:j;
     const score=x=&gt;{
       const dn=norm2(x.display_name||'');
       let s=dn.includes(cidadeN)?10:0;
       for(const p of ruaN.split(/\s+/).filter(v=&gt;v.length&gt;2)) if(dn.includes(p))s+=3;
       if(num &amp;&amp; dn.includes(num))s+=5;
       return s+(+x.importance||0);
     };
     const x=[...pool].sort((a,b)=&gt;score(b)-score(a))[0];
     return {lat:+x.lat,lon:+x.lon,nome:x.display_name||original,numeroConfirmado:!num||norm2(x.display_name||'').includes(num)};
   }
  }catch(e){}
 }

 // Segunda busca estruturada para ruas que falham na pesquisa livre.
 try{
   const rua=semNumero.replace(/^(rua|avenida|av\.?|r\.?)\s+/i,'').trim();
   const cidade=cidadePadrao.split(',')[0].trim();
   const u='https://nominatim.openstreetmap.org/search?format=jsonv2&amp;addressdetails=1&amp;limit=10&amp;countrycodes=br&amp;street='+encodeURIComponent(rua)+'&amp;city='+encodeURIComponent(cidade)+'&amp;state=São Paulo&amp;country=Brasil';
   const r=await fetchTimeout(u,7000);
   if(r.ok){
     const j=await r.json();
     if(j&amp;&amp;j[0])return {lat:+j[0].lat,lon:+j[0].lon,nome:j[0].display_name||original,numeroConfirmado:false};
   }
 }catch(e){}

 const porCep=await localizarRuaPorCepGratis(semNumero,num,cidadePadrao);
 if(porCep)return porCep;

 throw new Error('Local não encontrado: '+original+'. Não foi possível localizar nem pela rua nem pelo CEP automático.');
}
function numeroDigitado(txt){
 const m=(txt||'').match(/\b(\d{1,6})\b/); return m?m[1]:'';
}
function avisoNumero(txt,res){
 const n=numeroDigitado(txt);
 if(!n)return '';
 if(res&amp;&amp;res.numeroConfirmado===false)return ' ⚠️ Rua localizada, mas o número '+n+' não foi confirmado pelo mapa; confira o ponto antes de fechar a cotação.';
 return (res.nome||'').includes(n)?'':' ⚠️ Número '+n+' não confirmado pelo mapa; confira o ponto antes de fechar a cotação.';
}

 if(en.includes(cn))return e;
 return e+', '+cidade;
}

async function localizarEnderecosUrbanos(){
 const st=$('statusEnderecos'), eo=($('enderecoOrigem')?.value||'').trim(), ed=($('enderecoDestino')?.value||'').trim(), ep=($('enderecoParada')?.value||'').trim();
 if(!eo||!ed){st.textContent='⚠️ Informe saída e destino.';return false}
 st.textContent='🔎 Localizando saída e destino...';
 try{
  const a=urbanoResolvido.origem||await localizarUmEndereco(eo);
  const b=urbanoResolvido.destino||await localizarUmEndereco(ed);
  const p=ep?(urbanoResolvido.parada||await localizarUmEndereco(ep)):null;
  urbanoResolvido={origem:a,destino:b,parada:p};
  st.innerHTML='✅ &lt;b&gt;Saída:&lt;/b&gt; '+a.nome+avisoNumero(eo,a)+' • ✅ &lt;b&gt;Destino:&lt;/b&gt; '+b.nome+avisoNumero(ed,b)+(p?' • ✅ &lt;b&gt;Parada:&lt;/b&gt; '+p.nome+avisoNumero(ep,p):'');
  return true;
 }catch(e){st.textContent='⚠️ '+e.message+' Dica: escolha uma opção da lista que aparece enquanto digita.';return false}
}
function alternarModoCotacao(){
 const urbano=$('modoCotacao')&amp;&amp;$('modoCotacao').value==='urbano';

async function resolverPonto(texto, cepId, numeroId){

   let p=await buscarNominatimDireto(end);

   // 2) mesma rua sem o número
   const d=await (await fetch('https://viacep.com.br/ws/'+c+'/json/')).json();
   const rua=[d.logradouro,d.bairro,d.localidade,d.uf,'Brasil'].filter(Boolean).join(', ');
   p=await buscarNominatimDireto(rua);

   // 3) tenta CEP + cidade/UF

   p=await buscarNominatimDireto(porCep);
   if(p){p.nome=porCep; p.precisao='CEP'; return p;}

   // 4) último fallback: bairro + cidade

   p=await buscarNominatimDireto(bairro);

function normalizarLocalBusca(txt){

 const aliases=[
  [/^(aeroporto\s+)?guarulhos$|^gru$|aeroporto.*guarulhos|cumbica/, 'Aeroporto Internacional de São Paulo Guarulhos, Guarulhos, SP, Brasil'],
  [/^(aeroporto\s+)?viracopos$|^vcp$|aeroporto.*viracopos/, 'Aeroporto Internacional de Viracopos, Campinas, SP, Brasil'],
  [/^(aeroporto\s+)?congonhas$|^cgh$|aeroporto.*congonhas/, 'Aeroporto de Congonhas, São Paulo, SP, Brasil']

async function geocode(endereco){

 // sem obrigar CEP ou endereço completo.
 if(!/brasil/i.test(normal)) tentativas.push(normal+', Brasil');
 if(!/\b[A-Z]{2}\b/i.test(normal) &amp;&amp; !/brasil/i.test(normal)) tentativas.push(normal+', SP, Brasil');

 // Limeira só fica como último recurso para nomes de ruas/localidades realmente locais.
 const pareceCidadeOuPOI=/(aeroporto|airport|terminal|rodoviaria|shopping|hospital|hotel|universidade|campinas|guarulhos|sao paulo|são paulo|sorocaba|jundiai|jundiaí|americana|piracicaba|rio claro|araraquara|ribeirao|ribeirão)/i.test(normal);
 if(!pareceCidadeOuPOI &amp;&amp; /^(rua|r\.|avenida|av\.|rodovia|estrada)\b/i.test(normal)){
   tentativas.push(normal+', Limeira, SP, Brasil');
 }

 for(const q of [...new Set(tentativas)]){
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&amp;limit=8&amp;countrycodes=br&amp;addressdetails=1&amp;namedetails=1&amp;q='+encodeURIComponent(q);
  try{
   const r=await fetch(url,{headers:{'Accept-Language':'pt-BR,pt;q=0.9'}});
   if(!r.ok)continue;
   const j=await r.json();
   if(j&amp;&amp;j.length){
     // Para texto curto, prioriza cidade/município/POI com nome correspondente.
     const no=normalizarLocalBusca(original).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
     const score=x=&gt;{
       const dn=String(x.display_name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
       let s=dn.includes(no)?5:0;
       if(['city','town','municipality','village'].includes(x.type)||['city','town','municipality'].includes(x.addresstype))s+=3;
       if(['aerodrome','airport'].includes(x.type))s+=3;
       return s+(+x.importance||0);
     };
     const x=[...j].sort((a,b)=&gt;score(b)-score(a))[0];
     return {lat:+x.lat,lon:+x.lon,nome:x.display_name||original,precisao:'local/cidade'};
   }
  }catch(e){}
 }
 throw new Error('Local não encontrado: '+original+'. Tente cidade + UF, nome do local + cidade, ou endereço.');
}
async function rotaOSRM(a,b){
  const url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&amp;geometries=geojson&amp;steps=true`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('Falha no serviço de rotas.');
  const j=await r.json();
  if(j.code!=='Ok'||!j.routes?.length) throw new Error('Nenhuma rota encontrada.');
  const rt=j.routes[0];
  const steps=(rt.legs||[]).flatMap(l=&gt;l.steps||[]);
  const roads=[...new Set(steps.flatMap(s=&gt;[s.ref,s.name]).filter(Boolean))];
  return {km:rt.distance/1000, sec:rt.duration, coords:rt.geometry?.coordinates||[], roads};
}
function distPointToSegmentKm(p,a,b){
  const lat0=p[1]*Math.PI/180;
  const sx=111.320*Math.cos(lat0), sy=110.574;
  const px=p[0]*sx, py=p[1]*sy, ax=a[0]*sx, ay=a[1]*sy, bx=b[0]*sx, by=b[1]*sy;
  const vx=bx-ax, vy=by-ay, wx=px-ax, wy=py-ay;
  const c2=vx*vx+vy*vy; let t=c2?((wx*vx+wy*vy)/c2):0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));
}
function pertoDaRota(pt,coords,limiteKm=1.2){
  if(coords.length&lt;2)return false;
  const passo=Math.max(1,Math.floor(coords.length/1200));
  for(let i=0;i&lt;coords.length-1;i+=passo){
    const j=Math.min(coords.length-1,i+passo);
    if(distPointToSegmentKm(pt,coords[i],coords[j])&lt;=limiteKm)return true;
  }
  return false;
}

async function consultarPedagiosBBox(coordsTrecho){
  let minLon=Infinity,minLat=Infinity,maxLon=-Infinity,maxLat=-Infinity;
  for(const [lon,lat] of coordsTrecho){
    minLon=Math.min(minLon,lon); maxLon=Math.max(maxLon,lon);
    minLat=Math.min(minLat,lat); maxLat=Math.max(maxLat,lat);
  }
  const pad=.018;
  minLon-=pad; maxLon+=pad; minLat-=pad; maxLat+=pad;
  const q=`[out:json][timeout:6];(node[&quot;barrier&quot;=&quot;toll_booth&quot;](${minLat},${minLon},${maxLat},${maxLon});node[&quot;highway&quot;=&quot;toll_gantry&quot;](${minLat},${minLon},${maxLat},${maxLon}););out body;`;
  const eps=[
    'https://overpass-api.de/api/interpreter?data=',
    'https://overpass.kumi.systems/api/interpreter?data=',
    'https://overpass.nchc.org.tw/api/interpreter?data='
  ];
  for(const ep of eps){
    try{
      const r=await fetchTimeout(ep+encodeURIComponent(q),7500);
      if(r.ok){
        const j=await r.json();
        return j.elements||[];
      }
    }catch(e){}
  }
  throw new Error('Trecho sem resposta.');
}

function dividirRotaEmTrechos(coords,quantidade=5){
  if(!coords.length)return [];
  const partes=[];
  const tam=Math.ceil(coords.length/quantidade);
  for(let i=0;i&lt;coords.length;i+=tam){
    const inicio=Math.max(0,i-1);
    partes.push(coords.slice(inicio,Math.min(coords.length,i+tam+1)));
  }
  return partes.filter(p=&gt;p.length&gt;=2);
}

function limitePromessaPedagio(p,ms=12000){

}
async function localizarPedagios(coords){
  if(!coords.length)return [];

  // Divide a rota em áreas menores para evitar consultas muito grandes no Overpass.
  const trechos=dividirRotaEmTrechos(coords,5);
  let elementos=[], sucessos=0;

  for(const trecho of trechos){
    try{
      const els=await consultarPedagiosBBox(trecho);
      elementos=elementos.concat(els);
      sucessos++;
    }catch(e){
      // Um trecho pode falhar sem cancelar toda a viagem.
    }
  }

  if(!sucessos) throw new Error('Pedágios indisponíveis no momento.');

  const encontrados=[];
  for(const e of elementos){
    if(e.lat==null||e.lon==null)continue;
    if(pertoDaRota([+e.lon,+e.lat],coords,1.4)) encontrados.push(e);
  }

  const unicos=[];
  for(const e of encontrados){
    const duplicado=unicos.some(u=&gt;
      Math.hypot(
        (u.lat-e.lat)*110.574,
        (u.lon-e.lon)*111.320*Math.cos(e.lat*Math.PI/180)
      )&lt;0.25
    );
    if(!duplicado)unicos.push(e);
  }
  return unicos;
}

async function refsRodoviasPorCoordenadas(coords){

  const refs=new Set();

    const p=coords[Math.round(i*(coords.length-1)/(max-1))];
    if(!p)continue;
    const [lon,lat]=p;
    const q=`[out:json][timeout:5];way(around:120,${lat},${lon})[&quot;highway&quot;][&quot;ref&quot;];out tags 8;`;
    const eps=['https://overpass-api.de/api/interpreter?data=','https://overpass.kumi.systems/api/interpreter?data='];

        const j=await r.json();

        }

      }catch(e){}
    }
  }
  return [...refs];
}

        if(t.operator&amp;&amp;con.includes(norm(t.operator)))score+=4;
        if(t.ref&amp;&amp;rod.includes(norm(t.ref)))score+=4;
        const cid=norm(t['addr:city']||'');

        if(cidadeConfere)score+=4;

        if(!nomeConfere&amp;&amp;!cidadeConfere)continue;
        const raw=x.valor??x.tarifa??x.valor_tarifa??x.preco;
        const val=parseFloat(String(raw??'').replace(',','.'));
        if(Number.isFinite(val)&amp;&amp;val&gt;0){
          if(score&gt;bestScore){bestScore=score;best={valor:val,dado:x,score};ambiguo=false;}
          else if(score===bestScore&amp;&amp;best&amp;&amp;Math.abs(val-best.valor)&gt;0.005)ambiguo=true;
        }
      }
      if(best&amp;&amp;!ambiguo&amp;&amp;bestScore&gt;=4)return best;
    }catch(e){}
  }

}
async function detectarPedagiosTrecho(coords){
  if(!coords||coords.length&lt;2)return [];

  // Uma única consulta por trecho (ida/retorno), cobrindo todo o corredor da rota.
  // Isso evita o travamento causado por dezenas de chamadas sequenciais.
  const lats=coords.map(c=&gt;+c[1]), lons=coords.map(c=&gt;+c[0]);
  const margem=0.025; // ~2,5 km
  const sul=Math.min(...lats)-margem, norte=Math.max(...lats)+margem;
  const oeste=Math.min(...lons)-margem, leste=Math.max(...lons)+margem;
  const q=`[out:json][timeout:18];
  (
    node[&quot;barrier&quot;=&quot;toll_booth&quot;](${sul},${oeste},${norte},${leste});
    node[&quot;highway&quot;=&quot;toll_gantry&quot;](${sul},${oeste},${norte},${leste});
    node[&quot;toll&quot;=&quot;yes&quot;](${sul},${oeste},${norte},${leste});
    way[&quot;highway&quot;=&quot;toll_gantry&quot;](${sul},${oeste},${norte},${leste});

  );
  out center tags;`;

  const servidores=[
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  let els=[],consultou=false;
  for(const base of servidores){
    try{
      const r=await fetchTimeout(base+'?data='+encodeURIComponent(q),9000);
      if(!r.ok)continue;
      const j=await r.json();
      els=j.elements||[];consultou=true;
      break;
    }catch(e){}
  }

  if(!consultou)throw new Error('Consulta de praças indisponível.');
  const unicos=[];
  for(const e of els){
    const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
    if(lat==null||lon==null)continue;
    const p={...e,lat:+lat,lon:+lon};
    if(!pertoDaRota([p.lon,p.lat],coords,1.6))continue;
    const dup=unicos.some(u=&gt;Math.hypot((u.lat-p.lat)*110.574,(u.lon-p.lon)*111.320*Math.cos(p.lat*Math.PI/180))&lt;0.25);
    if(!dup)unicos.push(p);
  }
  return unicos;
}
async function calcularPedagiosDinamicos(coordsIda,coordsVolta){
 const grupos=[['Ida',coordsIda],['Retorno',coordsVolta]].filter(([,coords])=&gt;coords?.length);
 const db=loadTollDB();
 const resultados=await Promise.all(grupos.map(async([rotulo,coords])=&gt;{
   const ps=await detectarPedagiosTrecho(coords);
   return Promise.all(ps.map(async p=&gt;{
     const nome=p.tags?.name||p.tags?.operator||p.tags?.ref||'Praça de pedágio';
     let valor=Number(db[tollKey(p)])||parseCharge(p.tags?.['charge:motorcar']||p.tags?.['charge:car']||p.tags?.charge);
     if(!valor){const enriquecido=await enriquecerPedagioGratis(p);const tarifa=await consultarTarifaPedagioAberto(enriquecido);valor=tarifa?.valor||0;}
     return {valor,detalhe:`${rotulo}: ${nome} ${valor?brl(valor):'(tarifa não confirmada)'}`};
   }));
 }));
 const itens=resultados.flat();
 return {total:itens.reduce((s,p)=&gt;s+p.valor,0),detalhes:itens.map(p=&gt;p.detalhe),incompletos:itens.filter(p=&gt;!p.valor).length,encontrados:itens.length};
}

function tollKey(e){
  const t=e.tags||{};
  const nome=(t.name||t.operator||t.ref||'').trim().toLowerCase();

  return 'coord:'+(+e.lat).toFixed(4)+','+(+e.lon).toFixed(4);

function parseCharge(raw){
  if(!raw)return 0;
  const m=String(raw).replace(',','.').match(/(?:R\$\s*)?(\d+(?:\.\d+)?)/i);
  return m?parseFloat(m[1]):0;
}

    await runWithTimeout(buscarRota(), 35000, 'tempo excedido na Viagem 1');

    // Viagem 2: calcula automaticamente, sem exigir outro clique.
    if(multi){
      try{
        await runWithTimeout(buscarTrecho2(), 35000, 'tempo excedido na Viagem 2');
      }catch(e){
        // Não trava o orçamento inteiro por causa de uma consulta de pedágio.
        const st=$('statusTrecho2');

          st.textContent='⚠️ Rota da Viagem 2 não concluiu a consulta automática de pedágios. Confira os locais e tente novamente.';
        }
      }
    }

    calcular(false);
    if(typeof saveQuote === 'function') saveQuote();

    // Keep the detailed route/toll result, including incomplete tariff warnings.
  }catch(e){
    showStatus('A consulta não terminou. Confira os KM e informe os pedágios antes de enviar o orçamento.','warn');
    if(!$('pedagios').value) $('pedagios').value='';
    calcular(false);
  }finally{
    if(principal){
      principal.disabled = false;
      principal.textContent = principal.dataset.oldText || '📍 Buscar rota, calcular KM, pedágios e orçamento';
    }
  }
}

function ativarCalculoUber(){
  const ids=['appHoras','appMinutos','appCorridas','appKmIni','appKmFim','appBruto','appGorjeta','appBonus','appComb','appPed','appEst','appOutras'];
  ids.forEach(id=&gt;{
    const el=$(id);
    if(!el || el.dataset.calcUber==='1') return;
    el.dataset.calcUber='1';
    el.addEventListener('input',calcAppForm);
    el.addEventListener('change',calcAppForm);
  });
  calcAppForm();
}

function calcAppForm(){
  const kmIni=n('appKmIni'), kmFim=n('appKmFim');
  const km=Math.max(0,kmFim-kmIni);
  const receita=n('appBruto')+n('appGorjeta')+n('appBonus');
  const despesas=n('appComb')+n('appPed')+n('appEst')+n('appOutras');
  const liquido=receita-despesas;
  const horas=horasAppDecimal();
  $('appKmPrev').textContent=km.toFixed(1).replace('.',',')+' km';
  $('appLiqPrev').textContent=brl(liquido);
  $('appHoraPrev').textContent=brl(horas&gt;0?liquido/horas:0);
  $('appKmValPrev').textContent=brl(km&gt;0?liquido/km:0);
  return {km,receita,despesas,liquido};
}

function renderFinanceiro(){
  const h=getHist(),now=new Date(),year=now.getFullYear(),month=now.getMonth();
  const startWeek=new Date(now);startWeek.setDate(now.getDate()-((now.getDay()+6)%7));startWeek.setHours(0,0,0,0);

    if(d.getFullYear()===year&amp;&amp;d.getMonth()===month)mes+=x.valor||0;

  const fimA=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);

async function buscarTrecho2(){
  const oi=String($('origemTrecho2')?.value||'').trim();
  const di=String($('destinoTrecho2')?.value||'').trim();

  // Clear only the Trip 2 route result so an old successful value
  // cannot hide a real failure.
  $('kmTrecho2').value='';
  $('tempoTrecho2').value='-';
  window.__trecho2={km:0,sec:0,pedagios:0};

  if(!oi||!di){
    showStatusTrecho2('Preencha origem e destino da ida da viagem 2.','warn');
    return;
  }

  showStatusTrecho2('🔎 Calculando Viagem 2...','warn');

  try{
    // The return is always the inverse of the outbound route.
    const [a,b]=await Promise.all([
      resolverPonto(oi,null,null),
      resolverPonto(di,null,null)
    ]);

    const [ida,volta]=await Promise.all([
      rotaOSRM(a,b),
      rotaOSRM(b,a)
    ]);

    const or=di, dr=oi;
    $('origemRetornoTrecho2').value=or;
    $('destinoRetornoTrecho2').value=dr;

    let ped=Number($('pedagiosTrecho2')?.value)||0;

    const texto2=[oi,di].join(' ').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const rotaVcp2=/viracopos/.test(texto2) &amp;&amp;
      /limeira|horacio\s+cecchi|13482[\s-]?307/.test(texto2);

    if(rotaVcp2){
      const cat=calcularCatalogoLocal(ida.coords,volta.coords);
      if(cat &amp;&amp; cat.total&gt;0){
        ped=cat.total;
        $('pedagiosTrecho2').value=ped.toFixed(2);
      }
    }else{
      try{
        const [dyn1,dyn2]=await Promise.all([
          limitePromessaPedagio(calcularPedagiosDinamicos(ida.coords,[]),12000),
          limitePromessaPedagio(calcularPedagiosDinamicos(volta.coords,[]),12000)
        ]);
        if((dyn1.encontrados||0)+(dyn2.encontrados||0)&gt;0 &amp;&amp;
           dyn1.incompletos===0 &amp;&amp; dyn2.incompletos===0 &amp;&amp;
           (dyn1.total+dyn2.total)&gt;0){
          ped=(dyn1.total||0)+(dyn2.total||0);
          $('pedagiosTrecho2').value=ped.toFixed(2);
        }
      }catch(e){
        // KM can still be valid even if dynamic toll lookup times out.
      }
    }

    const km=ida.km+volta.km;
    const sec=ida.sec+volta.sec;

    window.__trecho2={
      km,sec,pedagios:ped,
      origem:oi,destino:di,
      origemRetorno:or,destinoRetorno:dr,
      data:$('dataTrecho2').value||'',
      hora:$('horaTrecho2').value||'',
      horaRetorno:$('horaRetornoTrecho2').value||''
    };

    $('kmTrecho2').value=km.toFixed(1);
    $('tempoTrecho2').value=formatDuration(sec);

    showStatusTrecho2(
      `✅ Viagem 2 calculada — ${ida.km.toFixed(1)} km ida + ${volta.km.toFixed(1)} km retorno = ${km.toFixed(1)} km` +
      (ped&gt;0 ? ` • Pedágios: ${brl(ped)}` : ''),
      'ok'
    );

    calcular(false);
  }catch(e){
    console.error(e);
    // Only show an error if no KM was produced.
    if(!(parseFloat($('kmTrecho2')?.value)||0)){
      showStatusTrecho2(
        '⚠️ Não foi possível calcular a Viagem 2. Confira somente a origem e o destino da ida.',
        'err'
      );
    }
  }
}

async function recalcularOrcamento(){
  try{
    // Se ainda não existe KM calculado, o botão deve calcular a rota também.
    // Isso evita que &quot;Recalcular&quot; apenas repita zeros em uma cotação nova.
    const kmExistente=n('kmTotalInput');
    const modo=$('modoCotacao')?.value||'';
    const origem=(modo==='urbano'?$('enderecoOrigem')?.value:$('origem')?.value||'').trim();
    const destino=(modo==='urbano'?$('enderecoDestino')?.value:$('destino')?.value||'').trim();
    if(kmExistente&lt;=0 &amp;&amp; origem &amp;&amp; destino){
      const st=$('rotaStatus');
      if(st){st.className='status warn';st.textContent='⏳ Calculando rota e orçamento...';}
      await buscarTudo();
      return;
    }

    // Atualiza imediatamente os números principais, mesmo que alguma parte
    // secundária da mensagem/WhatsApp tenha algum problema.
    const kmBase=n('kmTotalInput');
    const t=window.__trecho2||{};
    const km=kmBase+(Number(t.km)||0)+operacaoTotais().km;
    const consumo=n('consumo');
    const precoLitro=n('precoComb');
    const litros=consumo&gt;0?km/consumo:0;
    const comb=(litros&gt;0&amp;&amp;precoLitro&gt;0)?litros*precoLitro:0;
    const pedagios=n('pedagios')+(Number(t.pedagios)||0)+operacaoTotais().pedagios;
    const custo=comb+pedagios;
    const margem=n('margem');
    const valorKm=Math.min(4,Math.max(0,n('valorKm')));
    const base=valorKm&gt;0?(km*valorKm)+pedagios:custo;
    const preco=base*(1+Math.max(0,margem)/100);
    const passageiros=Math.max(1,n('passageiros'));
    const porPass=preco/passageiros;

    window._calc={km,litros,comb,pedagios,custo,preco,porPass,
      sinal:preco*Math.max(0,n('sinalPct'))/100,
      saldo:Math.max(0,preco-(preco*Math.max(0,n('sinalPct'))/100)),
      valorKm,lucro:preco-custo};

    if($('kmView')) $('kmView').textContent=km.toFixed(1)+' km';
    if($('litros')) $('litros').textContent=litros.toFixed(1)+' L';
    if($('cComb')) $('cComb').textContent=precoLitro&gt;0?brl(comb):'Informe R$/L';
    if($('cPed')) $('cPed').textContent=brl(pedagios);
    if($('custoTotal')) $('custoTotal').textContent=brl(custo);
    if($('precoFinal')) $('precoFinal').textContent=brl(preco);
    if($('porPass')) $('porPass').textContent=brl(porPass);

    // Agora tenta gerar a mensagem completa e salvar o rascunho.
    try{ calcular(false); }catch(e){ console.warn('Parte secundária do cálculo:',e); }
    try{ saveQuote(); }catch(e){ console.warn('Não foi possível salvar o rascunho:',e); }

    const st=$('rotaStatus');
    if(st){ st.className='status ok'; st.textContent='✅ Orçamento recalculado.'; }
  }catch(e){
    alert('O recálculo encontrou um erro. Os campos da cotação continuam preservados.');
    console.error(e);
  }
}

function calcular(autosave=true){
  const kmBase=n('kmTotalInput'), trecho2=(window.__trecho2||{}), km=kmBase+(Number(trecho2.km)||0)+operacaoTotais().km, consumo=n('consumo'), precoLitro=n('precoComb');
  const litros=consumo&gt;0?km/consumo:0;
  const comb=(litros&gt;0&amp;&amp;precoLitro&gt;0)?litros*precoLitro:0;
  const pedagios=n('pedagios')+(Number(trecho2.pedagios)||0)+operacaoTotais().pedagios;
  const extras=0;
  const custo=comb+pedagios+extras;
  const margem=n('margem');
  const valorKm=Math.min(4,Math.max(0,n('valorKm')));
  // Primeiro calcula o valor-base da viagem.
  // Se houver valor por km configurado, ele continua sendo usado como base.
  // Depois aplica a Margem / lucro (%) sobre esse valor-base.
  const basePreco=valorKm&gt;0 ? (km*valorKm)+pedagios+extras : custo;
  const preco=basePreco*(1+Math.max(0,margem)/100);
  const passageiros=Math.max(1,n('passageiros'));
  const porPass=preco/passageiros;
  const sinal=preco*Math.max(0,n('sinalPct'))/100;
  const saldo=Math.max(0,preco-sinal);
  window._calc={km,litros,comb,pedagios,custo,preco,porPass,sinal,saldo,valorKm,lucro:preco-custo};

  $('kmView').textContent=km.toFixed(1)+' km';
  $('litros').textContent=litros.toFixed(1)+' L';
  $('cComb').textContent=precoLitro&gt;0?brl(comb):'Informe R$/L';
  const op=operacaoTotais();
  const pedagioPendente=(kmBase&gt;0&amp;&amp;$('pedagios').value==='')||op.pendente;
  $('cPed').textContent=pedagioPendente?'Não confirmado':brl(pedagios);
  $('custoTotal').textContent=brl(custo);
  if($('valorKmView')) $('valorKmView').textContent=brl(valorKm)+'/km';
  $('precoFinal').textContent=brl(preco);
  $('porPass').textContent=brl(porPass);

  const aviso=$('calcAviso');
  if(aviso){
    const faltas=[];
    if(op.pendente)faltas.push('⚠️ Confira quilômetros e pedágios de todos os trechos da sequência. Digite 0 apenas quando não houver custo.');
    if(pedagioPendente)faltas.push('⚠️ Preço parcial: pedágios não confirmados. Informe o total de pedágios antes de enviar o orçamento.');
    if(km&gt;0 &amp;&amp; precoLitro&lt;=0) faltas.push('⚠️ Informe o preço do combustível por litro em ⚙️ Veículos e combustíveis.');
    const tollInputs=[...document.querySelectorAll('.tollval')];
    if(tollInputs.some(x=&gt;(parseFloat(x.value)||0)&lt;=0)) faltas.push('⚠️ Há pedágio localizado sem preço conhecido. Preencha o valor da praça uma vez; o app salvará para as próximas rotas.');

    aviso.innerHTML=faltas.join(' • ');
  }

  const urbano=$('modoCotacao')?.value==='urbano';
  const cliente=$('cliente').value.trim(), origem=(urbano?$('enderecoOrigem').value:$('origem').value).trim(), destino=(urbano?$('enderecoDestino').value:$('destino').value).trim(), data=dataBR($('data').value), tempo=$('tempo').value, emp=getEmpresa();
  const temRetorno=$('idaVolta').value==='sim', origemRetorno=($('origemRetorno')?.value||'').trim(), destinoRetorno=($('destinoRetorno')?.value||'').trim();
  // No modo urbano, a hora da ida pode vir do campo &quot;hora&quot;.
  // Em viagens entre cidades, continua usando &quot;horaSaida&quot;.
  const horaIda=(($('horaSaida')?.value||$('hora')?.value||'')).trim();
  const horaVolta=(($('horaRetorno')?.value||$('retornoHora')?.value||'')).trim();
  let pg='';
  const sinalArred=Math.round(sinal*100)/100;
  const saldoArred=Math.round((preco-sinalArred)*100)/100;
  if(emp.pix){pg=`\n\n*RESERVA / PAGAMENTO*\nSinal (${n('sinalPct').toFixed(0)}%): *${brl(sinalArred)}*\nSaldo: ${brl(saldoArred)}\nPIX: ${emp.pix}${emp.fav?`\nFavorecido: ${emp.fav}`:''}${emp.banco?`\nBanco: ${emp.banco}`:''}\nApós o pagamento, envie o comprovante para confirmação.`}
  // Mensagem do WhatsApp sem emojis: evita caracteres &quot;�&quot; em alguns navegadores/apps e mantém a leitura profissional.
  const blocoIda=seqMensagemCliente()??`*VIAGEM 1 — IDA*\n${data?`Data: ${data}\n`:''}${horaIda?`Horário de saída/busca: ${horaIda}\n`:''}Local de saída: ${origem||'-'}\nDestino: ${destino||'-'}`;
  const blocoRetorno=(temRetorno&amp;&amp;!seqAtiva())?`\n\n*VIAGEM 1 — RETORNO*\n${dataBR($('dataRetorno')?.value||$('data').value)?`Data: ${dataBR($('dataRetorno')?.value||$('data').value)}\n`:''}${horaVolta?`Horário de busca para retorno: ${horaVolta}\n`:''}Local de busca: ${origemRetorno||destino||'-'}\nDestino do retorno: ${destinoRetorno||origem||'-'}`:'';
  const blocoTrecho2=(($('estruturaCotacao')?.value==='multi')&amp;&amp;(trecho2.origem||trecho2.destino))?`\n\n*VIAGEM 2 — IDA*\n${trecho2.data?`Data: ${dataBR(trecho2.data)}\n`:''}${trecho2.hora?`Horário da ida: ${trecho2.hora}\n`:''}Origem: ${trecho2.origem||'-'}\nDestino: ${trecho2.destino||'-'}\n${trecho2.horaRetorno?`Horário do retorno: ${trecho2.horaRetorno}\n`:''}Retorno: ${trecho2.origemRetorno||trecho2.destino||'-'} → ${trecho2.destinoRetorno||trecho2.origem||'-'}`:'';

function resumoFinanceiroAtividades(){
  var first=document.getElementById('rfExecHoje');
  if(!first) return;
  var now=new Date(), hoje=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var fim=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
  var semana=new Date(hoje); semana.setDate(hoje.getDate()-((hoje.getDay()+6)%7));
  var mes=new Date(now.getFullYear(),now.getMonth(),1);
  var ano=new Date(now.getFullYear(),0,1);

  function appTotal(ini){
    var a=[];
    try{ a=JSON.parse(localStorage.getItem('michelonGanhosAppsV1')||'[]')||[]; }catch(e){}
    return a.reduce(function(s,x){
      var d=new Date((x.data||'')+'T12:00:00');
      return (d&gt;=ini &amp;&amp; d&lt;=fim) ? s+(Number(x.liq)||0) : s;
    },0);
  }
  function execTotal(ini){
    var a=[];
    try{ a=JSON.parse(localStorage.getItem('michelonHistoricoV5')||'[]')||[]; }catch(e){}
    return a.reduce(function(s,x){
      if(x.status==='orcamento'||x.status==='cancelada') return s;
      var d=new Date((x.data||'')+'T12:00:00');
      if(!(d&gt;=ini &amp;&amp; d&lt;=fim)) return s;
      return s+((Number(x.valor)||0)-(Number(x.custo)||0));
    },0);
  }
  function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
  [['Hoje',hoje],['Semana',semana],['Mes',mes],['Ano',ano]].forEach(function(p){
    var e=execTotal(p[1]), a=appTotal(p[1]), k=p[0];
    document.getElementById('rfExec'+k).textContent=moeda(e);
    document.getElementById('rfApp'+k).textContent=moeda(a);
    document.getElementById('rfTotal'+k).textContent=moeda(e+a);
  });
}

function limparLinhaCotacao(s){
 return String(s||'')
   .replace(/[*_`]/g,'')
   .replace(/^[^\p{L}\p{N}]+/gu,'')
   .replace(/\s+/g,' ')
   .trim();
}
function normalizarChaveCotacao(s){
 return limparLinhaCotacao(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function camposDaMensagem(txt){
 const linhas=String(txt||'').replace(/\r/g,'').split('\n').map(x=&gt;x.trim()).filter(Boolean);
 const out={};
 const chaves=[
  ['cliente',['cliente','nome do cliente']],
  ['fone',['whatsapp','whatsapp do cliente','telefone','celular']],
  ['origemRetorno',['origem do retorno','saida do retorno']],
  ['destinoRetorno',['destino do retorno']],
  ['dataRetorno',['data do retorno']],
  ['horaRetorno',['horario do retorno','hora do retorno']],
  ['origem',['endereco de saida','origem','saida']],
  ['destino',['endereco de destino','destino']],
  ['data',['data da viagem','data da ida','data']],
  ['hora',['horario de saida','horario da ida','horario','hora']],
  ['passageiros',['numero de passageiros','passageiros']],
  ['parada',['parada opcional','parada']],
  ['cidade',['cidade da corrida','cidade']],
  ['tipo',['tipo de trajeto','trajeto','tipo']],
  ['servico',['tipo de servico','servico','modo da cotacao']]
 ];
 for(let i=0;i&lt;linhas.length;i++){
   const raw=limparLinhaCotacao(linhas[i]);
   const p=raw.indexOf(':');
   const chaveLinha=normalizarChaveCotacao(p&gt;=0?raw.slice(0,p):raw);
   for(const [id,nomes] of chaves){
     if(out[id])continue;
     const achou=nomes.some(n=&gt;chaveLinha===n || chaveLinha.endsWith(n));
     if(!achou)continue;
     let valor=p&gt;=0?raw.slice(p+1).trim():'';
     if(!valor &amp;&amp; linhas[i+1]){
       const prox=limparLinhaCotacao(linhas[i+1]);
       const proxKey=normalizarChaveCotacao((prox.split(':')[0]||''));
       const pareceOutraChave=chaves.some(([,ns])=&gt;ns.some(n=&gt;proxKey===n||proxKey.endsWith(n)));
       if(!pareceOutraChave)valor=prox;
     }
     if(valor)out[id]=valor;
   }
 }
 return out;
}
function setSeExiste(id,v){
 const e=document.getElementById(id);
 if(e&amp;&amp;v){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));return true}
 return false;

function dataISO(v){
 const s=String(v||'').trim(),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):s;
}


function normalizarEnderecoMichelon(v){
 let s=String(v||'').trim();
 if(!s)return s;
 const cep=(s.match(/\|\s*CEP\s*:\s*([^|]+)/i)||[])[1];
 const num=(s.match(/\|\s*N[º°o]?\s*:\s*([^|]+)/i)||[])[1];
 s=s.replace(/\|\s*CEP\s*:\s*[^|]+/ig,'')
    .replace(/\|\s*N[º°o]?\s*:\s*[^|]+/ig,'')
    .replace(/\s*\|\s*/g,', ')
    .replace(/\s+/g,' ')
    .replace(/\s*,\s*,+/g,',')
    .trim();
 if(num &amp;&amp; !new RegExp('(?:^|\\D)'+String(num).trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;')+'(?:\\D|$)').test(s)){
   s += ', '+String(num).trim();
 }
 if(cep)s += ', CEP '+String(cep).trim();
 return s.replace(/^,\s*|,\s*$/g,'').trim();
}

function importarBlocoMichelon(txt){
 const ini='---MICHELON-DADOS---', fim='---FIM-MICHELON-DADOS---';
 if(!txt.includes(ini))return null;
 const bloco=(txt.split(ini)[1]||'').split(fim)[0]||'';
 const o={};
 bloco.split(/\r?\n/).forEach(l=&gt;{
   const p=l.indexOf('=');
   if(p&gt;0)o[l.slice(0,p).trim().toUpperCase()]=l.slice(p+1).trim();
 });
 return o;
}

 }:camposDaMensagem(txt);
 if(!c.origem&amp;&amp;!c.destino){avisar('Não encontrei origem ou destino. Confira se o arquivo contém uma solicitação de cotação.');return false;}
 const modo=/corrida dentro|urbano/i.test(c.servico||'')?'urbano':'viagem';
 const temRetorno=!!(c.origemRetorno||c.destinoRetorno||c.dataRetorno||c.horaRetorno||/ida e volta|retorno/i.test(c.tipo||''));
 const valores={

   dataRetorno:temRetorno?dataISO(c.dataRetorno||c.data):'',horaRetorno:temRetorno?(c.horaRetorno||''):'',

   destinoRetorno:temRetorno?normalizarEnderecoMichelon(c.destinoRetorno||c.origem):'',
   seqDados:'',opAtivo:'sim',opBase:'Limeira, SP',opKm1:'',opKm2:'',opKm3:'',opKm4:'',opPed1:'',opPed2:'',opPed3:'',opPed4:'',kmTotalInput:'',pedagios:'0',tempo:'-',obsViagem:''
 };
 if(c.cidade)valores.cidadeUrbana=c.cidade;
 // Apply all fields before triggering listeners, so autosave sees a complete request.
 sessionStorage.removeItem('michelonCotacaoLimpaV1');
 for(const [id,v] of Object.entries(valores)){const el=document.getElementById(id);if(el){el.value=v;delete el.dataset.manual;delete el.dataset.editado;}}
 for(const id of ['cepOrigem','numOrigem','cepDestino','numDestino','cepOrigemRetorno','numOrigemRetorno','cepDestinoRetorno','numDestinoRetorno','dataTrecho2','horaTrecho2','origemTrecho2','destinoTrecho2','origemRetornoTrecho2','destinoRetornoTrecho2','horaRetornoTrecho2','kmTrecho2','pedagiosTrecho2']){const el=document.getElementById(id);if(el)el.value='';}
 window.__trecho2={};window.__michelonCoords=[];window.__michelonRoads=[];
 if(typeof urbanoResolvido!=='undefined')urbanoResolvido={origem:null,destino:null,parada:null};
 if(typeof alternarModoCotacao==='function')alternarModoCotacao();
 if(typeof alternarEstruturaCotacao==='function')alternarEstruturaCotacao();
 if(typeof alternarCamposRetorno==='function')alternarCamposRetorno();
 // Keep explicitly requested return locations after default return inversion.
 for(const id of ['origemRetorno','destinoRetorno']){const el=document.getElementById(id);if(el){el.value=valores[id];el.dataset.manual='1';}}
 const tolls=document.getElementById('tollList');if(tolls)tolls.innerHTML='';
 if(typeof calcular==='function')calcular(false);
 for(const id of Object.keys(valores)){const el=document.getElementById(id);if(el){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}}
 for(const id of ['origemRetorno','destinoRetorno']){const el=document.getElementById(id);if(el)el.value=valores[id];}
 if(typeof calcular==='function')calcular(false);
 document.getElementById('cliente')?.dispatchEvent(new Event('input',{bubbles:true}));
 if(typeof saveQuote==='function')saveQuote();
 const faltam=['origem','destino','data','hora'].filter(id=&gt;!c[id]);
 const aviso=validarDatasSolicitacao();
 avisar('Solicitação importada. '+(faltam.length?'Complete: '+faltam.join(', ')+'. ':'')+(aviso||'Confira os dados e toque em “Calcular rota”.'));
 document.getElementById('cotacaoForm')?.scrollIntoView({behavior:'smooth',block:'start'});
 return true;
}

 const ida=valor('data'),volta=valor('dataRetorno');
 const invalida=valor('idaVolta')==='sim'&amp;&amp;ida&amp;&amp;volta&amp;&amp;
   (volta&lt;ida||(volta===ida&amp;&amp;valor('horaSaida')&amp;&amp;valor('horaRetorno')&amp;&amp;valor('horaRetorno')&lt;valor('horaSaida')));

 const el=document.getElementById('avisoDatasSolicitacao');if(el){el.textContent=msg;el.hidden=!msg;}

}

function limparCotacaoAgora(ev){

  try{sessionStorage.setItem('michelonCotacaoLimpaV1','1')}catch(e){}

  const draftKeys=[
    'michelon_cotacao_atual_v39',

  draftKeys.forEach(k=&gt;{try{localStorage.removeItem(k)}catch(e){}});

  const form=document.getElementById('cotacaoForm');
  if(form){
    form.querySelectorAll('input,textarea').forEach(el=&gt;{
      if(!el.id || el.id==='numeroOrcamento') return;
      if(el.id==='cliente' || el.id==='clienteFone' ||
         el.id==='origem' || el.id==='destino' ||
         el.id==='enderecoOrigem' || el.id==='enderecoDestino' ||
         el.id==='cepOrigem' || el.id==='cepDestino' ||
         el.id==='numeroOrigem' || el.id==='numeroDestino' ||
         el.id==='data' || el.id==='horaSaida' || el.id==='horaRetorno' ||
         el.id==='obsViagem' || el.id==='pedagios' || el.id==='kmTotalInput' ||
         el.id==='tempo' || el.id==='mensagem' || el.id==='mensagemOrcamento' ||
         el.id==='dataTrecho2' || el.id==='horaTrecho2' || el.id==='origemTrecho2' ||
         el.id==='destinoTrecho2' || el.id==='origemRetornoTrecho2' ||
         el.id==='destinoRetornoTrecho2' || el.id==='horaRetornoTrecho2' ||
         el.id==='kmTrecho2' || el.id==='pedagiosTrecho2' || el.id==='tempoTrecho2'){
        if(el.id==='passageiros') el.value='1'; else el.value='';
      }
    });
    form.querySelectorAll('select').forEach(el=&gt;{
      if(el.id==='tipoComb'||el.id==='veiculo') return; // permanentes
      if(el.id==='modoCotacao') el.value='viagem';
      else if(el.id==='estruturaCotacao') el.value='unico';
      else if(el.id==='tipoServico') el.value='Viagem';
      else if(el.id==='idaVolta') el.value='sim';
      else if(el.id==='formaPg') el.value='PIX';
      else if(el.id==='passageiros') el.value='1';
      else if(el.options.length) el.selectedIndex=0;
    });
  }

  resetarDeslocamentosMotorista();
  // Remove a segunda viagem da memória em execução.
  window.__trecho2={};

  // Próximo orçamento: mantém o histórico e apenas inicia uma nova cotação.
  const novo=proximoNumeroOrcamento();
  try{localStorage.setItem(ORCCURRENT,String(novo))}catch(e){}
  const n=document.getElementById('numeroOrcamento');
  if(n) n.value='ORÇAMENTO '+String(novo).padStart(2,'0');

  try{if(typeof alternarEstruturaCotacao==='function') alternarEstruturaCotacao()}catch(e){}
  try{if(typeof alternarCamposRetorno==='function') alternarCamposRetorno()}catch(e){}
  try{if(typeof alternarModoCotacao==='function') alternarModoCotacao()}catch(e){}

  // Zera somente os indicadores visuais da cotação.
  const zero={kmView:'0 km',litros:'0 L',cComb:'R$ 0,00',cPed:'R$ 0,00',custoTotal:'R$ 0,00',porPass:'R$ 0,00',precoFinal:'R$ 0,00'};
  Object.entries(zero).forEach(([id,v])=&gt;{const e=document.getElementById(id);if(e)e.textContent=v});
  const msg=document.getElementById('mensagem');if(msg)msg.value='';

  try{if(typeof renderPendentes==='function')renderPendentes()}catch(e){}
  alert('Cotação limpa com sucesso. Empresa, PIX, veículo e combustível foram mantidos.');
  return false;
}

&lt;script id=&quot;michelon-sequencia-v58&quot;&gt;
let seqPronta=false,seqSuspensa=false,seqConsulta=0,seqUltimoJSON='';
function seqEl(id){return document.getElementById(id)}

function seqAtiva(){return seqPronta&amp;&amp;!seqSuspensa&amp;&amp;seqValor('modoCotacao')!=='urbano'}
function seqLer(){try{const s=JSON.parse(seqValor('seqDados')||'null');return s&amp;&amp;s.v===1&amp;&amp;Array.isArray(s.pontos)?s:null}catch(e){return null}}
function seqCriarPonto(endereco='',tipo='cliente',km='',ped=''){return {endereco:String(endereco),tipo:tipo==='motorista'?'motorista':'cliente',km:km===''?'':Math.max(0,Number(km)||0),ped:ped===''?'':Math.max(0,Number(ped)||0)}}
function seqMigrar(incluirBase=false){
  const origem=seqValor('origem'),destino=seqValor('destino');
  const pontos=[seqCriarPonto(origem),seqCriarPonto(destino)];
  if(seqValor('idaVolta')==='sim'&amp;&amp;origem&amp;&amp;destino){
    const ro=seqValor('origemRetorno')||destino,rd=seqValor('destinoRetorno')||origem;
    if(ro!==destino)pontos.push(seqCriarPonto(ro,'motorista'));
    pontos.push(seqCriarPonto(rd));
  }
  const opBase=seqValor('opBase')||'Limeira, SP';
  if(incluirBase&amp;&amp;origem&amp;&amp;destino&amp;&amp;seqValor('opAtivo')==='sim'){
    pontos.unshift(seqCriarPonto(opBase));
    pontos[1].tipo='motorista';pontos[1].km=seqValor('opKm1');pontos[1].ped=seqValor('opPed1');
    pontos.push(seqCriarPonto(opBase,'motorista',seqValor('opKm2'),seqValor('opPed2')));
  }
  return {v:1,pontos};
}
function seqGuardar(s,desenhar=false){
  seqEl('seqDados').value=JSON.stringify(s);seqUltimoJSON=seqEl('seqDados').value;
  if(desenhar)seqRender();
}
function seqTotais(){
  const s=seqLer();let clienteKm=0,motoristaKm=0,clientePed=0,motoristaPed=0,pendente=false,temCliente=false;
  if(!s)return {clienteKm,motoristaKm,clientePed,motoristaPed,pendente:false,temCliente:false};
  for(let i=1;i&lt;s.pontos.length;i++){
    const p=s.pontos[i],a=s.pontos[i-1];
    if(p.tipo==='cliente')temCliente=true;
    if(!a.endereco.trim()||!p.endereco.trim()||p.km===''||p.ped==='')pendente=true;
    if(p.tipo==='motorista'){motoristaKm+=Number(p.km)||0;motoristaPed+=Number(p.ped)||0;}
    else {clienteKm+=Number(p.km)||0;clientePed+=Number(p.ped)||0;}
  }
  return {clienteKm,motoristaKm,clientePed,motoristaPed,pendente:pendente||!temCliente,temCliente};
}
function operacaoTotais(){
  if(!seqAtiva())return {km:0,pedagios:0,pendente:false};
  const t=seqTotais();return {km:t.motoristaKm,pedagios:t.motoristaPed,pendente:t.pendente};
}
function seqSincronizar(){
  if(!seqAtiva())return;
  let s=seqLer();if(!s){s=seqMigrar(true);seqGuardar(s,true);}
  if(seqUltimoJSON!==seqValor('seqDados')){seqUltimoJSON=seqValor('seqDados');seqRender();}
  const cliente=[];
  for(let i=1;i&lt;s.pontos.length;i++)if(s.pontos[i].tipo==='cliente')cliente.push({a:s.pontos[i-1].endereco,b:s.pontos[i].endereco});
  if(cliente.length){
    seqEl('origem').value=cliente[0].a;
    seqEl('destino').value=cliente[0].b;
    seqEl('origemRetorno').value=cliente.length&gt;1?cliente[cliente.length-1].a:'';
    seqEl('destinoRetorno').value=cliente.length&gt;1?cliente[cliente.length-1].b:'';
  }else {for(const id of ['origem','destino','origemRetorno','destinoRetorno'])seqEl(id).value='';}
  const t=seqTotais();seqEl('kmTotalInput').value=t.clienteKm.toFixed(1);
  const pedPendente=s.pontos.some((p,i)=&gt;i&gt;0&amp;&amp;p.tipo==='cliente'&amp;&amp;p.ped==='');
  seqEl('pedagios').value=pedPendente?'':t.clientePed.toFixed(2);
  seqEl('tempo').value=s.sec?formatDuration(s.sec):'-';
}
function seqMensagemCliente(){
  if(!seqAtiva())return null;
  const s=seqLer();if(!s)return null;
  const v=seqValor,linhas=[];
  if(v('data'))linhas.push('Data da ida: '+dataBR(v('data')));
  if(v('horaSaida'))linhas.push('Horário da ida: '+v('horaSaida'));
  if(v('idaVolta')==='sim'&amp;&amp;v('dataRetorno'))linhas.push('Data do retorno: '+dataBR(v('dataRetorno')));
  if(v('idaVolta')==='sim'&amp;&amp;v('horaRetorno'))linhas.push('Horário do retorno: '+v('horaRetorno'));
  let n=0;
  for(let i=1;i&lt;s.pontos.length;i++){
    const p=s.pontos[i];if(p.tipo==='motorista')continue;
    linhas.push('Trecho '+(++n)+': '+(s.pontos[i-1].endereco||'A definir')+' → '+(p.endereco||'A definir'));
  }
  if(!n)linhas.push('Informe o trajeto do cliente.');
  return '*TRAJETO DO CLIENTE*\n'+linhas.join('\n');
}
function seqPersistir(){
  if(seqSuspensa)return;
  try{sessionStorage.removeItem('michelonCotacaoLimpaV1')}catch(e){}
  try{saveQuote()}catch(e){}
  // The existing draft key is authoritative when reopening the app.
  try{
    const k='michelon_cotacao_atual_v39',d=JSON.parse(localStorage.getItem(k)||'{}');
    d.campos=d.campos||{};
    document.querySelectorAll('#cotacaoForm input,#cotacaoForm select,#cotacaoForm textarea').forEach(e=&gt;{if(e.id)d.campos[e.id]=e.value});
    d.salvoEm=new Date().toISOString();localStorage.setItem(k,JSON.stringify(d));
  }catch(e){}
}
function seqInvalidar(s){seqConsulta++;delete s.sec;for(let i=1;i&lt;s.pontos.length;i++){s.pontos[i].km='';s.pontos[i].ped='';delete s.pontos[i].pedNota;}}
function seqEditar(i,campo,valor){
  const s=seqLer();if(!s||!s.pontos[i])return;
  if(campo==='endereco'){s.pontos[i].endereco=valor;delete s.pontos[i].local;seqInvalidar(s);document.querySelectorAll('[data-seq-custo]').forEach(e=&gt;e.value='');}
  else if(campo==='tipo'){s.pontos[i].tipo=valor==='motorista'?'motorista':'cliente';seqConsulta++;}
  else if(campo==='km'||campo==='ped'){s.pontos[i][campo]=valor===''?'':Math.max(0,Number(valor)||0);if(campo==='ped')delete s.pontos[i].pedNota;seqConsulta++;}
  seqGuardar(s,campo==='tipo');calcular(false);seqPersistir();
}
function seqAdicionar(onde='fim'){
  const s=seqLer()||seqMigrar();
  if(onde==='inicio'){
    s.pontos.unshift(seqCriarPonto());if(s.pontos[1])s.pontos[1].tipo='motorista';
  }else s.pontos.push(seqCriarPonto('',onde==='base'?'motorista':'cliente'));
  seqInvalidar(s);seqGuardar(s,true);calcular(false);seqPersistir();
}
function seqRemover(i){
  const s=seqLer();if(!s||s.pontos.length&lt;=2)return;
  s.pontos.splice(i,1);seqInvalidar(s);seqGuardar(s,true);calcular(false);seqPersistir();
}
function seqMover(i,delta){
  const s=seqLer(),j=i+delta;if(!s||j&lt;0||j&gt;=s.pontos.length)return;
  [s.pontos[i],s.pontos[j]]=[s.pontos[j],s.pontos[i]];
  seqInvalidar(s);seqGuardar(s,true);calcular(false);seqPersistir();
}
function seqMoverPara(i,j){
 const s=seqLer();if(!s||i===j||j&lt;0||j&gt;=s.pontos.length)return;
 const ponto=s.pontos.splice(i,1)[0];s.pontos.splice(j,0,ponto);
 seqInvalidar(s);seqGuardar(s,true);calcular(false);seqPersistir();
}
function seqDimensionarEndereco(input){input.style.height=&quot;auto&quot;;input.style.height=Math.max(30,input.scrollHeight)+&quot;px&quot;;}
function seqSugestoes(i,input,suggestions){
 let timer;
 input.oninput=()=&gt;{
  seqDimensionarEndereco(input);seqEditar(i,'endereco',input.value);clearTimeout(timer);suggestions.style.display='none';const query=input.value;
  timer=setTimeout(async()=&gt;{
   if(query.trim().length&lt;4)return;
   const results=await sugestoesEndereco(query);
   if(input.value!==query||!input.isConnected)return;
   suggestions.replaceChildren();
   for(const found of results.slice(0,6)){
    const choice=document.createElement('button');choice.type='button';choice.className='cityitem seq-sugestao';choice.textContent=found.display_name||found.name||query;
    choice.onclick=()=&gt;{
     const s=seqLer();if(!s?.pontos[i])return;
     s.pontos[i].endereco=choice.textContent;s.pontos[i].local={lat:Number(found.lat),lon:Number(found.lon)};
     seqInvalidar(s);seqGuardar(s,true);calcular(false);seqPersistir();
    };
    suggestions.appendChild(choice);
   }
   suggestions.style.display=results.length?'block':'none';
  },450);
 };
}
function seqRender(){
 const box=seqEl('seqLista'),s=seqLer();if(!box||!s)return;box.replaceChildren();
 const panel=document.createElement('div');panel.className='seq-addresses';
 s.pontos.forEach((p,i)=&gt;{
  const row=document.createElement('div');row.className='seq-linha';row.dataset.indice=i;
  const badge=document.createElement('span');badge.className=i===0?'seq-marco seq-origem':'seq-marco';badge.textContent=i===0?'':String(i);row.appendChild(badge);
  const center=document.createElement('div');center.className='seq-endereco';
  const input=document.createElement('textarea');input.rows=1;input.value=p.endereco;input.placeholder=i===0?'Endereço de saída':i===s.pontos.length-1?'Destino final':'Endereço da parada';input.autocomplete='off';input.setAttribute('aria-label','Endereço '+(i+1));input.setAttribute('data-seq-endereco',String(i));center.appendChild(input);requestAnimationFrame(()=&gt;seqDimensionarEndereco(input));
  if(i&gt;0){
   const label=document.createElement('label');label.className='seq-interno';
   const check=document.createElement('input');check.type='checkbox';check.checked=p.tipo==='motorista';check.setAttribute('aria-label','Trecho até o endereço '+(i+1)+' só do motorista');check.onchange=()=&gt;seqEditar(i,'tipo',check.checked?'motorista':'cliente');
   const text=document.createElement('span');text.textContent='Só motorista';label.appendChild(check);label.appendChild(text);center.appendChild(label);
  }
  const suggestions=document.createElement('div');suggestions.className='citylist';center.appendChild(suggestions);seqSugestoes(i,input,suggestions);row.appendChild(center);
  const handle=document.createElement('button');handle.type='button';handle.className='seq-arrastar';handle.textContent='☰';handle.setAttribute('aria-label','Reordenar endereço '+(i+1));handle.title='Arraste para mudar a ordem';
  const menu=document.createElement('div');menu.className='seq-ordem-menu';menu.hidden=true;
  for(const [texto,delta,disabled] of [['Subir',-1,i===0],['Descer',1,i===s.pontos.length-1]]){
   const b=document.createElement('button');b.type='button';b.textContent=texto;b.disabled=disabled;b.onclick=()=&gt;seqMover(i,delta);menu.appendChild(b);
  }
  let arrastando=false,startY=0;
  handle.onclick=()=&gt;{if(arrastando){arrastando=false;return;}menu.hidden=!menu.hidden;};
  handle.onkeydown=e=&gt;{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();seqMover(i,e.key==='ArrowUp'?-1:1);}};
  handle.onpointerdown=e=&gt;{startY=e.clientY;arrastando=false;handle.setPointerCapture?.(e.pointerId);};
  handle.onpointermove=e=&gt;{if(handle.hasPointerCapture?.(e.pointerId)&amp;&amp;Math.abs(e.clientY-startY)&gt;8){arrastando=true;row.classList.add('seq-dragging');}};
  handle.onpointerup=e=&gt;{
   row.classList.remove('seq-dragging');
   if(!arrastando)return;
   const destino=document.elementFromPoint?.(e.clientX,e.clientY)?.closest('.seq-linha');
   if(destino)seqMoverPara(i,Number(destino.dataset.indice));
  };

  row.appendChild(handle);row.appendChild(menu);
  if(i&gt;0){const remove=document.createElement('button');remove.type='button';remove.className='seq-excluir';remove.textContent='×';remove.disabled=s.pontos.length&lt;=2;remove.setAttribute('aria-label','Remover endereço '+(i+1));remove.onclick=()=&gt;seqRemover(i);row.appendChild(remove);}
  panel.appendChild(row);
 });
 const add=document.createElement('button');add.type='button';add.className='seq-add-line';add.textContent='+ Adicionar uma parada';add.onclick=()=&gt;seqAdicionar('fim');panel.appendChild(add);box.appendChild(panel);
 const details=document.createElement('details');details.className='seq-custos-unicos';
 const summary=document.createElement('summary');summary.textContent='Conferir quilômetros e pedágios';details.appendChild(summary);
 s.pontos.slice(1).forEach((p,j)=&gt;{
  const row=document.createElement('div');row.className='seq-custo-linha';
  const title=document.createElement('strong');title.textContent='Trecho '+(j+1)+(p.tipo==='motorista'?' • Só motorista':'');row.appendChild(title);
  const grid=document.createElement('div');grid.className='grid';
  for(const [campo,texto] of [['km','Quilômetros'],['ped','Pedágios (R$)']]){
   const label=document.createElement('label');label.textContent=texto;
   const number=document.createElement('input');number.type='number';number.min='0';number.step=campo==='km'?'0.1':'0.01';number.inputMode='decimal';number.value=p[campo];number.placeholder=campo==='km'?'Não calculado':'Não confirmado';number.setAttribute('data-seq-custo',campo);number.setAttribute('aria-label',texto+' do trecho '+(j+1));number.oninput=()=&gt;seqEditar(j+1,campo,number.value);label.appendChild(number);grid.appendChild(label);
  }

 box.appendChild(details);seqAjustarTela();

function seqAjustarTela(){
  const ativa=seqAtiva();seqEl('seqRoteiro').hidden=!ativa;
  document.querySelectorAll('.seq-legado,.seq-rota-legada').forEach(e=&gt;e.hidden=ativa);

function resetarDeslocamentosMotorista(){
  seqConsulta++;

}
function seqMapa(){

      if(failed){verifyAll=true;tell(confirmed+' registro(s) confirmado(s); '+failed+' pendente(s). '+firstError);return}
      verifyAll=false;
      if(pending().length){again=true;tell('Há novos lançamentos para enviar…')}
      else tell(holdCount()?'✓ Outros registros enviados. ⚠️ '+holdCount()+' edição(ões) histórica(s) retida(s) neste aparelho, aguardando conciliação no Meu Financeiro.':'✓ Registros confirmados no Meu Financeiro.');
    }catch(error){tell(error.message||'Envio pendente. Os registros continuam salvos no MICHELON.');}
    finally{sending=false;if(forceAfter){verifyAll=true;forceAfter=false}if(again){again=false;schedule()}}
  }
  const schedule=()=&gt;{clearTimeout(timer);timer=setTimeout(send,700)};
  function accept(token){if(!/^[a-f0-9]{64}$/.test(token)){tell('Código inválido. Copie o código completo da página de conexão.');return}state={token,ack:{}};persist();schedule();}
  panel.querySelector('#mfConnect').onclick=()=&gt;{
    if(!ALLOWED.has(location.origin)){tell('Abra a versão publicada para conectar. Arquivos locais não têm uma origem segura para sincronizar.');return}
    refreshConnection();
    if(state.token){send(true);return}
    panel.querySelector('#mfPaste').click();
    tell('Cole o código da conexão existente. Nenhuma nova conexão será criada.');
  };
  window.addEventListener('message',event=&gt;{if(event.origin!==FINANCE||event.source!==popup||event.data?.type!=='michelon-finance-connected'||event.data.nonce!==nonce)return;accept(event.data.token)});
  panel.querySelector('#mfPaste').onclick=()=&gt;{
    let form=panel.querySelector('#mfCodeForm');
    if(!form){
      form=document.createElement('div');form.id='mfCodeForm';form.style.marginTop='12px';
      form.innerHTML='&lt;label for=&quot;mfCodeInput&quot;&gt;Cole seu código de conexão&lt;/label&gt;&lt;textarea id=&quot;mfCodeInput&quot; rows=&quot;3&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;none&quot; spellcheck=&quot;false&quot; placeholder=&quot;Toque aqui e cole o código já gerado&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;btns&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;mfCodeConfirm&quot;&gt;Confirmar código&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;secondary&quot; id=&quot;mfCodeCancel&quot;&gt;Cancelar&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;mfCodeError&quot; role=&quot;alert&quot; style=&quot;color:#b91c1c&quot; hidden&gt;&lt;/p&gt;';
      panel.querySelector('#mfPaste').parentElement.after(form);
      form.querySelector('#mfCodeConfirm').onclick=()=&gt;{
        const input=form.querySelector('#mfCodeInput'),code=input.value.trim(),error=form.querySelector('#mfCodeError');
        if(!/^[a-f0-9]{64}$/.test(code)){error.textContent='Cole o código completo gerado na página de conexão.';error.hidden=false;input.focus();return}
        if(code===state.token)schedule();else accept(code);
        error.hidden=true;input.value='';form.hidden=true;tell('Código confirmado. Enviando os lançamentos…');
      };
      form.querySelector('#mfCodeCancel').onclick=()=&gt;{form.hidden=true;panel.querySelector('#mfPaste').focus()};
    }
    form.hidden=false;form.querySelector('#mfCodeError').hidden=true;form.querySelector('#mfCodeInput').focus();
  };
  panel.querySelector('#mfRetry').onclick=()=&gt;send(true);
  // Wrappers preserve original arguments, results and rendering. No calculation changes.
  for(const name of ['setApps','setHist']){const original=window[name];if(typeof original==='function')window[name]=function(){const result=original.apply(this,arguments);schedule();return result}}
  window.addEventListener('online',schedule);window.addEventListener('storage',schedule);
  document.addEventListener('visibilitychange',()=&gt;{if(!document.hidden)schedule()});
  setInterval(()=&gt;{refreshConnection();if(state.token&amp;&amp;(verifyAll||pending().length))schedule()},15000);
  schedule();
})();

&lt;div class=&quot;manual-step&quot; id=&quot;m1&quot;&gt;&lt;h3&gt;1. Tela inicial&lt;/h3&gt;&lt;p&gt;A nova tela inicial reúne entradas, saídas, saldo, saldo projetado após pendências, reserva, saldos por banco, lançamentos recentes e contas a vencer. Use o menu lateral organizado por grupos e o botão “Ocultar valores” quando quiser mais privacidade.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMjY0IiB2aWV3Qm94PSIwIDAgOTAwIDI2NCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPlRlbGEgaW5pY2lhbCDigJQgdXNlIG9zIGJvdMO1ZXMgZG8gbWVudTwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPjE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIxMDUiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIxMzAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+Tm92YSBSZWNlaXRhIC8gTm92YSBEZXNwZXNhPC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+MjwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5TYWzDoXJpbyBkaWEgMDUgLyBTYWzDoXJpbyBkaWEgMjA8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij4zPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMjAxIiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMjI2IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZj &lt;div class=&quot;manual-step&quot; id=&quot;m2&quot;&gt;&lt;h3&gt;2. Como lançar uma despesa&lt;/h3&gt;&lt;p&gt;Clique em &lt;b&gt;Nova Despesa&lt;/b&gt;. Informe data, descrição, categoria, banco, valor e vencimento. No campo Banco, escolha um banco cadastrado. Para incluir, editar ou excluir bancos, use o botão &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. Deixe &lt;b&gt;Pendente&lt;/b&gt; se ainda não pagou. Depois clique em &lt;b&gt;Salvar lançamento&lt;/b&gt;.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTA0IiB2aWV3Qm94PSIwIDAgOTAwIDUwNCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIE5vdmEgRGVzcGVzYTwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkRhdGE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIxMDUiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIxMzAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+MDUvMTAvMjAyNjwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTc4IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkRlc2NyacOnw6NvPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTUzIiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTc4IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkVuZXJnaWE8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5DYXRlZ29yaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PS &lt;div class=&quot;manual-step&quot; id=&quot;m3&quot;&gt;&lt;h3&gt;3. Como lançar receita e salário&lt;/h3&gt;&lt;p&gt;Para uma receita comum, clique em &lt;b&gt;Nova Receita&lt;/b&gt;. Para seus pagamentos, use os botões &lt;b&gt;Salário dia 05&lt;/b&gt; e &lt;b&gt;Salário dia 20&lt;/b&gt;. Quando o dinheiro entrar, deixe o status como &lt;b&gt;Recebido&lt;/b&gt;.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNDA4IiB2aWV3Qm94PSIwIDAgOTAwIDQwOCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIE5vdmEgUmVjZWl0YSAvIFNhbMOhcmlvPC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxMzAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+RGF0YTwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjEwNSIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj4wNS8xMC8yMDI2PC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+RGVzY3Jpw6fDo288L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIxNTMiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+U2Fsw6FyaW8gLSBkaWEgMDU8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5DYXRlZ29yaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+ &lt;div class=&quot;manual-step&quot; id=&quot;m4&quot;&gt;&lt;h3&gt;4. Como cadastrar Contas Fixas&lt;/h3&gt;&lt;p&gt;Entre em &lt;b&gt;Contas Fixas&lt;/b&gt; e informe o nome, valor, dia de pagamento, categoria e banco. O campo Banco usa a lista cadastrada em &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. O sistema soma automaticamente quanto você tem para pagar no dia 05, no dia 20 e no total.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgOTAwIDM2MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIENvbnRhcyBGaXhhczwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkNvbnRhPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTA1IiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkVuZXJnaWE8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5WYWxvcjwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SJCAzMjAsMDA8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5QYWdhciBkaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+MDU8L3Rl &lt;div class=&quot;manual-step&quot; id=&quot;m5&quot;&gt;&lt;h3&gt;5. Reserva / Investimento&lt;/h3&gt;&lt;p&gt;Use este campo quando separar dinheiro para sua reserva. Informe o valor, de qual conta saiu e o nome da reserva. Esse movimento não é tratado como uma despesa comum.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgOTAwIDM2MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIFJlc2VydmEgLyBJbnZlc3RpbWVudG88L3RleHQ+PHRleHQgeD0iNDUiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5EYXRhPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTA1IiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPjA1LzEwLzIwMjY8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5WYWxvcjwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SJCAzMDAsMDA8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5PcmlnZW08L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+SXRhw7o8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjI3NCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwI &lt;div class=&quot;manual-step&quot;&gt;&lt;h3&gt;6. Dashboard e acompanhamento&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Tela inicial / Dashboard:&lt;/b&gt; reúne entradas, saídas, saldo, reserva, saldos por banco, lançamentos recentes, contas a vencer, gráficos de Entradas x Saídas, Gastos por Categoria e Meta de Reserva.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Contas Pendentes:&lt;/b&gt; mostra o que ainda precisa ser pago.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Gerenciar / Excluir:&lt;/b&gt; permite corrigir ou apagar lançamentos.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Limites de Gastos:&lt;/b&gt; define limites mensais por categoria.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Meta da Reserva:&lt;/b&gt; define quanto você pretende guardar.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;manual-step&quot; id=&quot;m7&quot;&gt;&lt;h3&gt;7. Como cadastrar Bancos / Contas&lt;/h3&gt;&lt;p&gt;Clique em &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. Digite o nome do banco ou da conta, por exemplo &lt;b&gt;Santander&lt;/b&gt;, &lt;b&gt;Nubank&lt;/b&gt; ou &lt;b&gt;Caixa&lt;/b&gt;, e clique em &lt;b&gt;+ Cadastrar&lt;/b&gt;. O banco ficará disponível automaticamente nos novos lançamentos, Contas Fixas, Transferências e Reserva/Investimento.&lt;/p&gt;&lt;div class=&quot;tip&quot;&gt;🏦 Para corrigir um nome, altere-o e clique em &lt;b&gt;Salvar&lt;/b&gt;. Para remover um banco que não será mais usado, clique em &lt;b&gt;Excluir&lt;/b&gt;. Se ele já estiver vinculado a lançamentos, o sistema avisa antes.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;manual-step&quot; id=&quot;m6&quot;&gt;&lt;h3&gt;7. Backup e segurança&lt;/h3&gt;&lt;p&gt;Faça backup periodicamente, principalmente antes de usar &lt;b&gt;Zerar todos os lançamentos&lt;/b&gt;. Se precisar, o botão Restaurar Backup recupera uma cópia salva.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMjY0IiB2aWV3Qm94PSIwIDAgOTAwIDI2NCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkJhY2t1cCDigJQgcHJvdGXDp8OjbyBkb3Mgc2V1cyBkYWRvczwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkZhemVyIEJhY2t1cDwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjEwNSIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5TYWx2YSB1bWEgY8OzcGlhIGRvcyBkYWRvcyBlbSBhcnF1aXZvPC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+UmVzdGF1cmFyIEJhY2t1cDwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SZWN1cGVyYSB1bWEgY8OzcGlhIHNhbHZhIGFudGVyaW9ybWVudGU8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5JbXBvcnRhbnRlPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMjAxIiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMjI2IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkZhw6dh &lt;div class=&quot;manual-step&quot;&gt;&lt;h3&gt;8. Zerar todos os lançamentos&lt;/h3&gt;&lt;p&gt;Use somente quando quiser começar novamente com o sistema limpo. A função pede confirmação antes de apagar. Faça um backup antes.&lt;/p&gt;&lt;div class=&quot;tip&quot;&gt;⚠️ Esta função apaga os lançamentos e as Contas Fixas conforme configurado na versão atual.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;manualDlg.close()&quot;&gt;Fechar manual&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/dialog&gt;
