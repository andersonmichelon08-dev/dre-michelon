async function buscarEnderecoUrbano(inp,listId,tipo){
 const box=$(listId), texto=String(inp.value||&#x27;&#x27;).trim();
 if(texto.length&lt;3){box.style.display=&#x27;none&#x27;;return}
 const cidade=String($(&#x27;cidadeUrbana&#x27;)?.value||&#x27;Limeira, SP&#x27;).trim();
 const norm2=s=&gt;String(s||&#x27;&#x27;).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;);

 // Sugestões locais úteis e instantâneas; busca online complementa.
 const locaisLimeira=[
   &#x27;Shopping Pátio Limeira, Limeira, SP&#x27;,
   &#x27;Horto Florestal de Limeira, Limeira, SP&#x27;,
   &#x27;Rodoviária de Limeira, Limeira, SP&#x27;,
   &#x27;Prefeitura Municipal de Limeira, Limeira, SP&#x27;
 ];
 let ach=[];
 if(norm2(cidade).includes(&#x27;limeira&#x27;)){
   ach=locaisLimeira.filter(x=&gt;norm2(x).includes(norm2(texto))).map(nome=&gt;({nome,lat:null,lon:null}));
 }

 try{
   const consultas=[
     texto+&#x27;, &#x27;+cidade+&#x27;, Brasil&#x27;,
     texto.replace(/\b(?:n|nº|n°|numero|número)\s*\.?\s*(\d+)/gi,&#x27;, $1&#x27;)+&#x27;, &#x27;+cidade+&#x27;, Brasil&#x27;
   ];
   for(const q of [...new Set(consultas)]){
     const u=&#x27;https://nominatim.openstreetmap.org/search?format=jsonv2&amp;addressdetails=1&amp;namedetails=1&amp;limit=12&amp;countrycodes=br&amp;q=&#x27;+encodeURIComponent(q);
     const r=await fetchTimeout(u,6000);
     if(!r.ok)continue;
     const j=await r.json();
     for(const x of (j||[])){
       const nome=x.display_name||x.name;
       if(nome &amp;&amp; norm2(nome).includes(norm2(cidade.split(&#x27;,&#x27;)[0])) &amp;&amp; !ach.some(a=&gt;norm2(a.nome)===norm2(nome))){
         ach.push({nome,lat:+x.lat,lon:+x.lon});
       }
     }
     if(j&amp;&amp;j.length)break;
   }
 }catch(e){}

 box.innerHTML=&#x27;&#x27;;
 ach.slice(0,12).forEach(item=&gt;{
   const d=document.createElement(&#x27;div&#x27;);

   d.onclick=async()=&gt;{
     inp.value=item.nome;
     box.style.display=&#x27;none&#x27;;
     let p=item;
     if(p.lat==null||p.lon==null){
       try{p=await localizarUmEndereco(item.nome)}catch(e){}
     }
     if(p&amp;&amp;p.lat!=null){
       urbanoResolvido[tipo]={lat:+p.lat,lon:+p.lon,nome:p.nome||item.nome};
       const st=$(&#x27;statusEnderecos&#x27;);
       if(st)st.textContent=&#x27;✅ Local selecionado. Selecione os demais endereços e calcule a rota.&#x27;;
     }
   };
   box.appendChild(d);
 });
 box.style.display=ach.length?&#x27;block&#x27;:&#x27;none&#x27;;
}

async function localizarRuaPorCepGratis(semNumero, numero, cidadePadrao){
 const cidade=(cidadePadrao.split(&#x27;,&#x27;)[0]||&#x27;&#x27;).trim();
 const uf=((cidadePadrao.split(&#x27;,&#x27;)[1]||&#x27;SP&#x27;).trim()||&#x27;SP&#x27;).toUpperCase();
 let rua=String(semNumero||&#x27;&#x27;).trim();
 if(!rua||!cidade)return null;

 // ViaCEP pesquisa por endereço e devolve CEP/bairro/logradouro.
 try{
   const u=&#x27;https://viacep.com.br/ws/&#x27;+encodeURIComponent(uf)+&#x27;/&#x27;+encodeURIComponent(cidade)+&#x27;/&#x27;+encodeURIComponent(rua)+&#x27;/json/&#x27;;
   const r=await fetchTimeout(u,7000);
   if(r.ok){
     const lista=await r.json();
     if(Array.isArray(lista)&amp;&amp;lista.length){
       const norm=s=&gt;String(s||&#x27;&#x27;).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;).replace(/[^a-z0-9 ]/g,&#x27; &#x27;);
       const alvo=norm(rua).replace(/^(rua|avenida|av|r)\s+/,&#x27;&#x27;).trim();
       const score=x=&gt;{
         const log=norm(x.logradouro).replace(/^(rua|avenida|av|r)\s+/,&#x27;&#x27;).trim();
         let s=0;
         for(const p of alvo.split(/\s+/).filter(v=&gt;v.length&gt;2)) if(log.includes(p))s+=4;
         if(log===alvo)s+=20;
         return s;
       };
       const d=[...lista].sort((a,b)=&gt;score(b)-score(a))[0];
       const cep=String(d.cep||&#x27;&#x27;).replace(/\D/g,&#x27;&#x27;);
       if(cep){
         // BrasilAPI v2 pode devolver coordenadas do CEP sem chave/API paga.
         try{
           const br=await fetchTimeout(&#x27;https://brasilapi.com.br/api/cep/v2/&#x27;+cep,7000);
           if(br.ok){
             const bj=await br.json();
             const c=bj?.location?.coordinates||{};
             const lat=parseFloat(c.latitude), lon=parseFloat(c.longitude);
             if(Number.isFinite(lat)&amp;&amp;Number.isFinite(lon)&amp;&amp;lat!==0&amp;&amp;lon!==0){
               const nome=[d.logradouro,numero,d.bairro,d.localidade,d.uf,d.cep,&#x27;Brasil&#x27;].filter(Boolean).join(&#x27;, &#x27;);
               return {lat,lon,nome,numeroConfirmado:false,precisao:&#x27;CEP&#x27;};
             }
           }
         }catch(e){}

         // Última tentativa: endereço enriquecido com bairro e CEP no Nominatim.
         const completo=[d.logradouro,d.bairro,d.localidade,d.uf,d.cep,&#x27;Brasil&#x27;].filter(Boolean).join(&#x27;, &#x27;);
         try{
           const nu=&#x27;https://nominatim.openstreetmap.org/search?format=jsonv2&amp;limit=5&amp;countrycodes=br&amp;addressdetails=1&amp;q=&#x27;+encodeURIComponent(completo);
           const nr=await fetchTimeout(nu,7000);
           if(nr.ok){
             const nj=await nr.json();
             if(nj&amp;&amp;nj[0]){
               return {lat:+nj[0].lat,lon:+nj[0].lon,nome:nj[0].display_name||completo,numeroConfirmado:false,precisao:&#x27;rua/CEP&#x27;};
             }
           }
         }catch(e){}
       }
     }
   }
 }catch(e){}
 return null;
}

async function localizarUmEndereco(texto){
 let original=String(texto||&#x27;&#x27;).trim();
 if(!original)throw new Error(&#x27;Informe o endereço ou local.&#x27;);

 const cidadePadrao=String($(&#x27;cidadeUrbana&#x27;)?.value||&#x27;Limeira, SP&#x27;).trim();

 // Aceita: &quot;n 366&quot;, &quot;nº 366&quot;, &quot;numero 366&quot; ou apenas &quot;366&quot;.
 original=original
   .replace(/\b(?:n|nº|n°|numero|número)\s*\.?\s*(\d+)/gi, &#x27;, $1&#x27;)
   .replace(/\s*,\s*/g, &#x27;, &#x27;)
   .replace(/\s+/g,&#x27; &#x27;)

function normalizarLocalBusca(txt){

  [/^(aeroporto\s+)?guarulhos$|^gru$|aeroporto.*guarulhos|cumbica/, &#x27;Aeroporto Internacional de São Paulo Guarulhos, Guarulhos, SP, Brasil&#x27;],

  [/^(aeroporto\s+)?congonhas$|^cgh$|aeroporto.*congonhas/, &#x27;Aeroporto de Congonhas, São Paulo, SP, Brasil&#x27;]
 ];
 for(const [re,val] of aliases) if(re.test(k)) return val;

}

  const url=&#x27;https://nominatim.openstreetmap.org/search?format=jsonv2&amp;limit=8&amp;countrycodes=br&amp;addressdetails=1&amp;namedetails=1&amp;q=&#x27;+encodeURIComponent(q);
  try{

   if(!r.ok)continue;
   const j=await r.json();
   if(j&amp;&amp;j.length){
     // Para texto curto, prioriza cidade/município/POI com nome correspondente.
     const no=normalizarLocalBusca(original).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;);
     const score=x=&gt;{
       const dn=String(x.display_name||&#x27;&#x27;).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;);
       let s=dn.includes(no)?5:0;
       if([&#x27;city&#x27;,&#x27;town&#x27;,&#x27;municipality&#x27;,&#x27;village&#x27;].includes(x.type)||[&#x27;city&#x27;,&#x27;town&#x27;,&#x27;municipality&#x27;].includes(x.addresstype))s+=3;
       if([&#x27;aerodrome&#x27;,&#x27;airport&#x27;].includes(x.type))s+=3;

   }
  }catch(e){}
 }

}
async function rotaOSRM(a,b){
  const url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&amp;geometries=geojson&amp;steps=true`;

  if(j.code!==&#x27;Ok&#x27;||!j.routes?.length) throw new Error(&#x27;Nenhuma rota encontrada.&#x27;);

  const steps=(rt.legs||[]).flatMap(l=&gt;l.steps||[]);
  const roads=[...new Set(steps.flatMap(s=&gt;[s.ref,s.name]).filter(Boolean))];

}
function distPointToSegmentKm(p,a,b){
  const lat0=p[1]*Math.PI/180;
  const sx=111.320*Math.cos(lat0), sy=110.574;
  const px=p[0]*sx, py=p[1]*sy, ax=a[0]*sx, ay=a[1]*sy, bx=b[0]*sx, by=b[1]*sy;
  const vx=bx-ax, vy=by-ay, wx=px-ax, wy=py-ay;
  const c2=vx*vx+vy*vy; let t=c2?((wx*vx+wy*vy)/c2):0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));
}
function pertoDaRota(pt,coords,limiteKm=1.2){
  if(coords.length&lt;2)return false;
  const passo=Math.max(1,Math.floor(coords.length/1200));
  for(let i=0;i&lt;coords.length-1;i+=passo){
    const j=Math.min(coords.length-1,i+passo);
    if(distPointToSegmentKm(pt,coords[i],coords[j])&lt;=limiteKm)return true;
  }
  return false;
}

}
async function consultarPedagiosBBox(coordsTrecho){
  let minLon=Infinity,minLat=Infinity,maxLon=-Infinity,maxLat=-Infinity;
  for(const [lon,lat] of coordsTrecho){
    minLon=Math.min(minLon,lon); maxLon=Math.max(maxLon,lon);
    minLat=Math.min(minLat,lat); maxLat=Math.max(maxLat,lat);
  }
  const pad=.018;
  minLon-=pad; maxLon+=pad; minLat-=pad; maxLat+=pad;
  const q=`[out:json][timeout:6];(node[&quot;barrier&quot;=&quot;toll_booth&quot;](${minLat},${minLon},${maxLat},${maxLon});node[&quot;highway&quot;=&quot;toll_gantry&quot;](${minLat},${minLon},${maxLat},${maxLon}););out body;`;
  const eps=[
    &#x27;https://overpass-api.de/api/interpreter?data=&#x27;,
    &#x27;https://overpass.kumi.systems/api/interpreter?data=&#x27;,
    &#x27;https://overpass.nchc.org.tw/api/interpreter?data=&#x27;
  ];
  for(const ep of eps){
    try{
      const r=await fetchTimeout(ep+encodeURIComponent(q),7500);
      if(r.ok){
        const j=await r.json();
        return j.elements||[];
      }
    }catch(e){}
  }
  throw new Error(&#x27;Trecho sem resposta.&#x27;);
}

function dividirRotaEmTrechos(coords,quantidade=5){
  if(!coords.length)return [];
  const partes=[];
  const tam=Math.ceil(coords.length/quantidade);
  for(let i=0;i&lt;coords.length;i+=tam){
    const inicio=Math.max(0,i-1);
    partes.push(coords.slice(inicio,Math.min(coords.length,i+tam+1)));
  }
  return partes.filter(p=&gt;p.length&gt;=2);
}

function limitePromessaPedagio(p,ms=12000){
 return Promise.race([p,new Promise((_,rej)=&gt;setTimeout(()=&gt;rej(new Error(&#x27;tempo limite&#x27;)),ms))]);
}
async function localizarPedagios(coords){
  if(!coords.length)return [];

  // Divide a rota em áreas menores para evitar consultas muito grandes no Overpass.
  const trechos=dividirRotaEmTrechos(coords,5);
  let elementos=[], sucessos=0;

  for(const trecho of trechos){
    try{
      const els=await consultarPedagiosBBox(trecho);
      elementos=elementos.concat(els);
      sucessos++;
    }catch(e){
      // Um trecho pode falhar sem cancelar toda a viagem.
    }
  }

  if(!sucessos) throw new Error(&#x27;Pedágios indisponíveis no momento.&#x27;);

  const encontrados=[];
  for(const e of elementos){
    if(e.lat==null||e.lon==null)continue;
    if(pertoDaRota([+e.lon,+e.lat],coords,1.4)) encontrados.push(e);
  }

  const unicos=[];
  for(const e of encontrados){
    const duplicado=unicos.some(u=&gt;
      Math.hypot(
        (u.lat-e.lat)*110.574,
        (u.lon-e.lon)*111.320*Math.cos(e.lat*Math.PI/180)
      )&lt;0.25
    );
    if(!duplicado)unicos.push(e);
  }
  return unicos;
}

async function refsRodoviasPorCoordenadas(coords){

  const refs=new Set();
  const max=8;
  for(let i=0;i&lt;max;i++){
    const p=coords[Math.round(i*(coords.length-1)/(max-1))];
    if(!p)continue;
    const [lon,lat]=p;
    const q=`[out:json][timeout:5];way(around:120,${lat},${lon})[&quot;highway&quot;][&quot;ref&quot;];out tags 8;`;
    const eps=[&#x27;https://overpass-api.de/api/interpreter?data=&#x27;,&#x27;https://overpass.kumi.systems/api/interpreter?data=&#x27;];
    for(const ep of eps){

        const r=await fetchTimeout(ep+encodeURIComponent(q),6000);
        if(!r.ok)continue;
        const j=await r.json();
        for(const e of (j.elements||[])){

        }

    }
  }
  return [...refs];
}

async function enriquecerPedagioGratis(p){
  const t=p.tags||(p.tags={});
  if(t[&#x27;addr:city&#x27;] &amp;&amp; (t.ref||t.name||t.operator))return p;
  try{
    const u=&#x27;https://nominatim.openstreetmap.org/reverse?format=jsonv2&amp;zoom=14&amp;addressdetails=1&amp;lat=&#x27;+encodeURIComponent(p.lat)+&#x27;&amp;lon=&#x27;+encodeURIComponent(p.lon);
    const r=await fetchTimeout(u,6500);
    if(r.ok){
      const j=await r.json(),a=j.address||{};
      if(!t[&#x27;addr:city&#x27;])t[&#x27;addr:city&#x27;]=a.city||a.town||a.municipality||a.village||&#x27;&#x27;;
      if(!t[&#x27;addr:state&#x27;])t[&#x27;addr:state&#x27;]=a.state||&#x27;&#x27;;
      if(!t[&#x27;addr:street&#x27;])t[&#x27;addr:street&#x27;]=a.road||&#x27;&#x27;;
      if(!t.ref){
        const m=String(a.road||&#x27;&#x27;).match(/\b(?:SP|BR)[-\s]?\d{2,3}\b/i);
        if(m)t.ref=m[0].toUpperCase().replace(/\s/,&#x27;-&#x27;);
      }
    }
  }catch(e){}
  return p;
}

async function consultarTarifaPedagioAberto(ped){
  const t=ped.tags||{};
  const termos=[
    t.name,
    t.operator,
    t.ref,
    t[&#x27;addr:city&#x27;],
    t[&#x27;addr:street&#x27;],
    [t.ref,t[&#x27;addr:city&#x27;]].filter(Boolean).join(&#x27; &#x27;),
    [t.operator,t[&#x27;addr:city&#x27;]].filter(Boolean).join(&#x27; &#x27;)
  ].filter(Boolean);
  if(!termos.length)return null;
  for(const termo of termos){
    try{
      const u=&#x27;https://pedagio.info/api/tarifas?uf=SP&amp;categoria_num=1&amp;com_valor=1&amp;limit=50&amp;busca=&#x27;+encodeURIComponent(termo);
      const r=await fetchTimeout(u,6500);
      if(!r.ok)continue;
      const j=await r.json();
      const arr=Array.isArray(j)?j:(j.data||j.dados||j.results||j.resultados||j.items||j.tarifas||[]);
      if(!Array.isArray(arr)||!arr.length)continue;
      const norm=s=&gt;String(s||&#x27;&#x27;).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;);
      const limparNome=v=&gt;norm(v).replace(/\b(praca|de|do|da|pedagio|pedagios|toll|booth|norte|sul)\b/g,&#x27; &#x27;).replace(/\s+/g,&#x27; &#x27;).trim();
      const nome=limparNome(t.name||&#x27;&#x27;);
      let best=null,bestScore=-1,ambiguo=false;
      for(const x of arr){
        const pr=norm(x.praca||x.praça||x.nome_praca||x.nome||&#x27;&#x27;);
        const con=norm(x.concessionaria||x.operadora||&#x27;&#x27;);
        const rod=norm(x.rodovia||x.via||&#x27;&#x27;);
        let score=0;
        const nomePraca=limparNome(pr);
        const nomeConfere=nome.length&gt;=4&amp;&amp;nomePraca.length&gt;=4&amp;&amp;(nomePraca.includes(nome)||nome.includes(nomePraca));
        if(nomeConfere)score+=6;
        if(t.operator&amp;&amp;con.includes(norm(t.operator)))score+=4;
        if(t.ref&amp;&amp;rod.includes(norm(t.ref)))score+=4;
        const cid=norm(t[&#x27;addr:city&#x27;]||&#x27;&#x27;);
        const rawTxt=norm([x.praca,x.praça,x.nome_praca,x.nome,x.concessionaria,x.rodovia,x.via,x.municipio,x.cidade].filter(Boolean).join(&#x27; &#x27;));
        const cidadeConfere=cid.length&gt;=4&amp;&amp;rawTxt.includes(cid);
        if(cidadeConfere)score+=4;
        // Concessionária ou código da rodovia isolados não identificam a praça.
        if(!nomeConfere&amp;&amp;!cidadeConfere)continue;
        const raw=x.valor??x.tarifa??x.valor_tarifa??x.preco;
        const val=parseFloat(String(raw??&#x27;&#x27;).replace(&#x27;,&#x27;,&#x27;.&#x27;));
        if(Number.isFinite(val)&amp;&amp;val&gt;0){
          if(score&gt;bestScore){bestScore=score;best={valor:val,dado:x,score};ambiguo=false;}
          else if(score===bestScore&amp;&amp;best&amp;&amp;Math.abs(val-best.valor)&gt;0.005)ambiguo=true;
        }
      }
      if(best&amp;&amp;!ambiguo&amp;&amp;bestScore&gt;=4)return best;
    }catch(e){}
  }
  return null;
}
async function detectarPedagiosTrecho(coords){
  if(!coords||coords.length&lt;2)return [];

  // Uma única consulta por trecho (ida/retorno), cobrindo todo o corredor da rota.
  // Isso evita o travamento causado por dezenas de chamadas sequenciais.
  const lats=coords.map(c=&gt;+c[1]), lons=coords.map(c=&gt;+c[0]);
  const margem=0.025; // ~2,5 km
  const sul=Math.min(...lats)-margem, norte=Math.max(...lats)+margem;
  const oeste=Math.min(...lons)-margem, leste=Math.max(...lons)+margem;
  const q=`[out:json][timeout:18];
  (
    node[&quot;barrier&quot;=&quot;toll_booth&quot;](${sul},${oeste},${norte},${leste});
    node[&quot;highway&quot;=&quot;toll_gantry&quot;](${sul},${oeste},${norte},${leste});
    node[&quot;toll&quot;=&quot;yes&quot;](${sul},${oeste},${norte},${leste});
    way[&quot;highway&quot;=&quot;toll_gantry&quot;](${sul},${oeste},${norte},${leste});

  );
  out center tags;`;

  const servidores=[
    &#x27;https://overpass-api.de/api/interpreter&#x27;,
    &#x27;https://overpass.kumi.systems/api/interpreter&#x27;
  ];

  let els=[],consultou=false;
  for(const base of servidores){
    try{
      const r=await fetchTimeout(base+&#x27;?data=&#x27;+encodeURIComponent(q),9000);
      if(!r.ok)continue;
      const j=await r.json();
      els=j.elements||[];consultou=true;
      break;
    }catch(e){}
  }

  if(!consultou)throw new Error(&#x27;Consulta de praças indisponível.&#x27;);
  const unicos=[];
  for(const e of els){
    const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
    if(lat==null||lon==null)continue;
    const p={...e,lat:+lat,lon:+lon};
    if(!pertoDaRota([p.lon,p.lat],coords,1.6))continue;
    const dup=unicos.some(u=&gt;Math.hypot((u.lat-p.lat)*110.574,(u.lon-p.lon)*111.320*Math.cos(p.lat*Math.PI/180))&lt;0.25);
    if(!dup)unicos.push(p);
  }
  return unicos;
}
async function calcularPedagiosDinamicos(coordsIda,coordsVolta){

 const db=loadTollDB();
 const resultados=await Promise.all(grupos.map(async([rotulo,coords])=&gt;{
   const ps=await detectarPedagiosTrecho(coords);
   return Promise.all(ps.map(async p=&gt;{
     const nome=p.tags?.name||p.tags?.operator||p.tags?.ref||&#x27;Praça de pedágio&#x27;;
     let valor=Number(db[tollKey(p)])||parseCharge(p.tags?.[&#x27;charge:motorcar&#x27;]||p.tags?.[&#x27;charge:car&#x27;]||p.tags?.charge);
     if(!valor){const enriquecido=await enriquecerPedagioGratis(p);const tarifa=await consultarTarifaPedagioAberto(enriquecido);valor=tarifa?.valor||0;}
     return {valor,detalhe:`${rotulo}: ${nome} ${valor?brl(valor):&#x27;(tarifa não confirmada)&#x27;}`};
   }));
 }));
 const itens=resultados.flat();
 return {total:itens.reduce((s,p)=&gt;s+p.valor,0),detalhes:itens.map(p=&gt;p.detalhe),incompletos:itens.filter(p=&gt;!p.valor).length,encontrados:itens.length};
}

function tollKey(e){
  const t=e.tags||{};
  const nome=(t.name||t.operator||t.ref||&#x27;&#x27;).trim().toLowerCase();
  if(nome) return &#x27;nome:&#x27;+nome;
  return &#x27;coord:&#x27;+(+e.lat).toFixed(4)+&#x27;,&#x27;+(+e.lon).toFixed(4);
}
function parseCharge(raw){
  if(!raw)return 0;
  const m=String(raw).replace(&#x27;,&#x27;,&#x27;.&#x27;).match(/(?:R\$\s*)?(\d+(?:\.\d+)?)/i);
  return m?parseFloat(m[1]):0;
}

function preencherRetornoPadrao(forcar=false){
  if($(&#x27;idaVolta&#x27;)?.value!==&#x27;sim&#x27;) return;
  const urbano=$(&#x27;modoCotacao&#x27;)?.value===&#x27;urbano&#x27;;

  const idaO=(urbano?$(&#x27;enderecoOrigem&#x27;)?.value:$(&#x27;origem&#x27;)?.value||&#x27;&#x27;).trim();
  const idaD=(urbano?$(&#x27;enderecoDestino&#x27;)?.value:$(&#x27;destino&#x27;)?.value||&#x27;&#x27;).trim();

  const ro=$(&#x27;origemRetorno&#x27;), rd=$(&#x27;destinoRetorno&#x27;);
  if(ro &amp;&amp; (forcar || !ro.dataset.manual)) ro.value=idaD;
  if(rd &amp;&amp; (forcar || !rd.dataset.manual)) rd.value=idaO;

  // No modo viagem, também inverte CEP + número.
  if(!urbano){
    const pares=[
      [&#x27;cepOrigemRetorno&#x27;,&#x27;cepDestino&#x27;],
      [&#x27;numOrigemRetorno&#x27;,&#x27;numDestino&#x27;],
      [&#x27;cepDestinoRetorno&#x27;,&#x27;cepOrigem&#x27;],
      [&#x27;numDestinoRetorno&#x27;,&#x27;numOrigem&#x27;]
    ];
    for(const [retId,idaId] of pares){
      const ret=$(retId), ida=$(idaId);
      if(ret &amp;&amp; (forcar || !ret.dataset.manual)) ret.value=ida?.value||&#x27;&#x27;;
    }
  }
}

  if(idaVolta){

    `🔎 Localizando: • IDA: ${origem} → ${destino}`+
    (idaVolta?` • RETORNO: ${origemRetorno} → ${destinoRetorno}`:&#x27;&#x27;),
    &#x27;warn&#x27;
  );

  try{
    const [a,b]=await Promise.all([resolverPonto(origem,&#x27;cepOrigem&#x27;,&#x27;numOrigem&#x27;),resolverPonto(destino,&#x27;cepDestino&#x27;,&#x27;numDestino&#x27;)]);
    const avisosPrecisao=[];
    if(a.precisao &amp;&amp; a.precisao!==&#x27;número&#x27;) avisosPrecisao.push(`Origem localizada por ${a.precisao}`);
    if(b.precisao &amp;&amp; b.precisao!==&#x27;número&#x27;) avisosPrecisao.push(`Destino localizado por ${b.precisao}`);
    const ida=await rotaOSRM(a,b);

    let roadsVolta=[];
    let km=ida.km, sec=ida.sec, coords=[...ida.coords]; let coordsIda=[...ida.coords], coordsVolta=[]; window.__michelonCoords=coords; window.__michelonRoads=[...(ida.roads||[])];
    let detalhe=`Ida: ${ida.km.toFixed(1)} km`;

    if(idaVolta){
      const [c,d]=await Promise.all([resolverPonto(origemRetorno,&#x27;cepOrigemRetorno&#x27;,&#x27;numOrigemRetorno&#x27;),resolverPonto(destinoRetorno,&#x27;cepDestinoRetorno&#x27;,&#x27;numDestinoRetorno&#x27;)]);
      if(c.precisao &amp;&amp; c.precisao!==&#x27;número&#x27;) avisosPrecisao.push(`Origem do retorno localizada por ${c.precisao}`);
      if(d.precisao &amp;&amp; d.precisao!==&#x27;número&#x27;) avisosPrecisao.push(`Destino do retorno localizado por ${d.precisao}`);
      const volta=await rotaOSRM(c,d);
      coordsVolta=[...volta.coords];roadsVolta=volta.roads||[];
      km+=volta.km;
      sec+=volta.sec;
      coords=coords.concat(volta.coords); window.__michelonCoords=coords; window.__michelonRoads=[...new Set([...(window.__michelonRoads||[]),...(volta.roads||[])])];
      detalhe+=` • Retorno: ${volta.km.toFixed(1)} km`;
    }

    $(&#x27;kmTotalInput&#x27;).value=km.toFixed(1);
    $(&#x27;tempo&#x27;).value=formatDuration(sec);
    calcular();

    const aviso=avisosPrecisao.length?` • ⚠️ ${avisosPrecisao.join(&#x27; • &#x27;)}. Confira o ponto no mapa.`:&#x27;&#x27;;
    showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • ${formatDuration(sec)}.${aviso} • Procurando pedágios...`,&#x27;warn&#x27;);

    try{
      // Sempre limpa o valor anterior antes de calcular uma nova rota.
      $(&#x27;pedagios&#x27;).value=&#x27;&#x27;;
      calcular();

      const pedagioIda=pedagioSaoPauloAtibaia(origem,destino,ida.roads);
      const pedagioVolta=idaVolta?pedagioSaoPauloAtibaia(origemRetorno,destinoRetorno,roadsVolta):0;
      if(pedagioIda!==null&amp;&amp;pedagioVolta!==null){
        const total=pedagioIda+pedagioVolta;
        renderPedagios([]);
        $(&#x27;pedagios&#x27;).value=total.toFixed(2);calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Mairiporã / Fernão Dias: ida ${brl(pedagioIda)}${idaVolta?` • retorno ${brl(pedagioVolta)}`:&#x27;&#x27;} • Pedágios ${brl(total)}. Estimativa para carro de passeio, tarifa ANTT 127/2026; confira reajustes antes da viagem.`,&#x27;ok&#x27;);
        return;
      }
      // Base local responde imediatamente e não depende dos servidores públicos.
      const local=calcularCatalogoLocal(coordsIda,coordsVolta);

      // Corredor Limeira ↔ Campinas (tarifas AutoBAn vigentes desde 01/07/2026).
      // Para o trecho usual, considera a praça de Nova Odessa/Sumaré: R$ 12,80 por travessia.
      if(rotaLimeiraCampinasValidada()){
        const idaPed=12.80;
        const voltaPed=(coordsVolta&amp;&amp;coordsVolta.length)?12.80:0;
        const totalPed=idaPed+voltaPed;
        $(&#x27;pedagios&#x27;).value=totalPed.toFixed(2);
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Pedágio Limeira ↔ Campinas: ida ${brl(idaPed)}${voltaPed?` • retorno ${brl(voltaPed)}`:&#x27;&#x27;} • Total ${brl(totalPed)}.`,&#x27;ok&#x27;);
        return;
      }

      // Corredor Limeira ↔ Aeroporto de Guarulhos:
      // cálculo local validado por sentido para evitar dependência da API pública.
      if(rotaGuarulhosValidada()){
        const idaSaiLimeira=/limeira|horacio|13482/i.test(String($(&#x27;origem&#x27;)?.value||&#x27;&#x27;));
        const ida=idaSaiLimeira?45.25:44.40;
        const volta=(coordsVolta&amp;&amp;coordsVolta.length)?(idaSaiLimeira?44.40:45.25):0;
        const total=ida+volta;
        $(&#x27;pedagios&#x27;).value=total.toFixed(2);
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Pedágios do corredor Limeira ↔ Guarulhos: ida ${brl(ida)}${volta?` • retorno ${brl(volta)}`:&#x27;&#x27;} • Total ${brl(total)}.`,&#x27;ok&#x27;);
        return;
      }
      if(rotaViracoposValidada() &amp;&amp; local.total&gt;0){
        $(&#x27;pedagios&#x27;).value=local.total.toFixed(2);
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Pedágios locais validados: ${[...local.ida,...local.volta].map(p=&gt;p.nome+&#x27; &#x27;+brl(p.valor)).join(&#x27; • &#x27;)} • Total ${brl(local.total)}.`,&#x27;ok&#x27;);
        return;
      }

      // Para outras rotas, complementa a base local com a consulta pública gratuita.
      const dyn=await limitePromessaPedagio(calcularPedagiosDinamicos(coordsIda,coordsVolta),18000);
      if(dyn.encontrados&gt;0 &amp;&amp; dyn.incompletos===0){
        $(&#x27;pedagios&#x27;).value=dyn.total.toFixed(2);
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Pedágios: ${dyn.detalhes.join(&#x27; • &#x27;)} • Total ${brl(dyn.total)}.`,&#x27;ok&#x27;);
        return;
      }

      // Fallback já validado para Limeira ↔ Viracopos.
      const idaCat=pedagiosCatalogoNaRota(coordsIda);
      const voltaCat=pedagiosCatalogoNaRota(coordsVolta);
      if(rotaViracoposValidada() &amp;&amp; (idaCat.length||voltaCat.length)){
        // The two physical directional records at Nova Odessa represent one charge per traversal.
        const agrupar=(arr)=&gt;{
          const m=new Map();
          for(const p of arr){
            const k=p.nome+&#x27;|&#x27;+p.rodovia;
            if(!m.has(k))m.set(k,p);
          }
          return [...m.values()];
        };
        const pi=agrupar(idaCat), pv=agrupar(voltaCat);
        const total=[...pi,...pv].reduce((s,p)=&gt;s+p.valor,0);
        $(&#x27;pedagios&#x27;).value=total.toFixed(2);
        calcular();
        const txtIda=pi.map(p=&gt;`${p.nome} ${p.rodovia} ${brl(p.valor)}`).join(&#x27;, &#x27;)||&#x27;nenhum&#x27;;
        const txtVolta=pv.map(p=&gt;`${p.nome} ${p.rodovia} ${brl(p.valor)}`).join(&#x27;, &#x27;)||&#x27;nenhum&#x27;;
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • Pedágios validados: ida ${txtIda}; retorno ${txtVolta}. Total ${brl(total)}.`,&#x27;ok&#x27;);
        return;
      }
      // Se a base dinâmica ficou incompleta, não inventa total.
      if(dyn.encontrados&gt;0 &amp;&amp; dyn.incompletos&gt;0){
        $(&#x27;pedagios&#x27;).value=&#x27;&#x27;;
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • ⚠️ Foram encontradas ${dyn.encontrados} praça(s), mas ${dyn.incompletos} tarifa(s) não puderam ser confirmadas. Pedágio não somado para evitar orçamento incorreto.`,&#x27;warn&#x27;);
        return;
      }
      const ped=await limitePromessaPedagio(localizarPedagios(coords),12000);
      if(ped.length){
        const soma=renderPedagios(ped);
        const txt=soma&gt;0
          ?` Valores conhecidos somados: ${brl(soma)}.`
          :&#x27; Preencha o valor de cada praça abaixo; o app salva para as próximas viagens.&#x27;;
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • ${ped.length} ponto(s) de pedágio localizado(s).${txt}`,&#x27;warn&#x27;);
      }else{
        renderPedagios([]);
        $(&#x27;pedagios&#x27;).value=&#x27;&#x27;;
        calcular();
        showStatus(`${detalhe} • Total: ${km.toFixed(1)} km • ${formatDuration(sec)}. ⚠️ A consulta gratuita não confirmou os pedágios desta rota. Informe manualmente se necessário.`,&#x27;warn&#x27;);
      }
    }catch(e){
      renderPedagios([]);
      $(&#x27;pedagios&#x27;).value=&#x27;&#x27;;calcular(false);
      const manual=parseFloat($(&#x27;pedagios&#x27;)?.value)||0;
      showStatus(`${detalhe} • Total: ${km.toFixed(1)} km. ⚠️ Pedágios automáticos indisponíveis no momento.${manual&gt;0?` Valor manual mantido: ${brl(manual)}.`:&#x27; Informe o total de pedágios manualmente.&#x27;}`,&#x27;warn&#x27;);
    }
  }catch(e){
    showStatus(&#x27;Não foi possível buscar automaticamente: &#x27;+e.message+&#x27; Você ainda pode preencher KM e pedágios manualmente.&#x27;,&#x27;err&#x27;);
  }
}
async function buscarRotaUrbana(){
 const status=$(&#x27;rotaStatus&#x27;);
 const eo=($(&#x27;enderecoOrigem&#x27;)?.value||&#x27;&#x27;).trim(), ed=($(&#x27;enderecoDestino&#x27;)?.value||&#x27;&#x27;).trim(), ep=($(&#x27;enderecoParada&#x27;)?.value||&#x27;&#x27;).trim();
 if(!eo||!ed){status.textContent=&#x27;Informe o endereço de saída e o endereço de destino.&#x27;;return}
 if(!urbanoResolvido.origem||!urbanoResolvido.destino){
   const ok=await localizarEnderecosUrbanos();
   if(!ok){status.textContent=&#x27;⚠️ Primeiro confirme os endereços.&#x27;;return}
 }
 status.textContent=&#x27;📍 Calculando rota urbana...&#x27;;
 try{
   const a=urbanoResolvido.origem,b=urbanoResolvido.destino,p=urbanoResolvido.parada;
   let km=0,sec=0,idaKm=0,voltaKm=0;

   // IDA
   if(p){
     const r1=await rotaOSRM(a,p),r2=await rotaOSRM(p,b);
     idaKm=r1.km+r2.km; km=idaKm; sec=r1.sec+r2.sec;
   }else{
     const r=await rotaOSRM(a,b);
     idaKm=r.km; km=r.km; sec=r.sec;
   }

   // Já mostra a ida assim que ela for calculada.
   $(&#x27;kmTotalInput&#x27;).value=km.toFixed(1);
   $(&#x27;tempo&#x27;).value=formatDuration(sec);
   if($(&#x27;pedagios&#x27;))$(&#x27;pedagios&#x27;).value=&#x27;0&#x27;;
   calcular(false);

   // RETORNO URBANO: quando é a volta normal, reutiliza exatamente
   // os pontos já confirmados da ida. Isso evita geocodificar tudo de novo.
   if($(&#x27;idaVolta&#x27;)?.value===&#x27;sim&#x27;){
     let ro=String($(&#x27;origemRetorno&#x27;)?.value||&#x27;&#x27;).trim();
     let rd=String($(&#x27;destinoRetorno&#x27;)?.value||&#x27;&#x27;).trim();
     if(!ro)ro=ed;
     if(!rd)rd=eo;
     if($(&#x27;origemRetorno&#x27;))$(&#x27;origemRetorno&#x27;).value=ro;
     if($(&#x27;destinoRetorno&#x27;))$(&#x27;destinoRetorno&#x27;).value=rd;

     const norm=s=&gt;String(s||&#x27;&#x27;).toLowerCase().normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;).replace(/[^a-z0-9]/g,&#x27;&#x27;);
     let c,d;
     const retornoInvertido=(norm(ro)===norm(ed) &amp;&amp; norm(rd)===norm(eo));

     if(retornoInvertido){
       c=b; d=a;
     }else{
       // Se o cliente escolheu outro retorno, usa o mesmo localizador urbano
       // que já conseguiu achar Rua Florindo Estina e Horto Florestal.
       c=await localizarUmEndereco(ro);
       d=await localizarUmEndereco(rd);
     }
     const volta=await rotaOSRM(c,d);
     voltaKm=volta.km; km+=volta.km; sec+=volta.sec;
   }

   $(&#x27;kmTotalInput&#x27;).value=km.toFixed(1);
   $(&#x27;tempo&#x27;).value=formatDuration(sec);
   if($(&#x27;pedagios&#x27;))$(&#x27;pedagios&#x27;).value=&#x27;0&#x27;;
   calcular(false);

   status.textContent=$(&#x27;idaVolta&#x27;)?.value===&#x27;sim&#x27;
     ?`✅ Ida: ${idaKm.toFixed(1)} km • Retorno: ${voltaKm.toFixed(1)} km • Total: ${km.toFixed(1)} km • ${formatDuration(sec)} • Corrida urbana sem pedágio automático.`
     :`✅ Rota urbana encontrada: ${km.toFixed(1)} km • ${formatDuration(sec)} • Corrida urbana sem pedágio automático.`;
 }catch(e){
   status.textContent=&#x27;⚠️ Não foi possível calcular a rota urbana: &#x27;+(e.message||&#x27;erro de rota.&#x27;);
 }
}

async function buscarTudo(){
  const multi = $(&#x27;estruturaCotacao&#x27;)?.value === &#x27;multi&#x27;;
  const btns = [...document.querySelectorAll(&#x27;button&#x27;)];
  const principal = btns.find(b =&gt; (b.textContent||&#x27;&#x27;).includes(&#x27;Buscar rota, calcular KM&#x27;));
  if(principal){
    principal.disabled = true;
    principal.dataset.oldText = principal.textContent;
    principal.textContent=&#x27;⏳ Calculando rota, pedágios e orçamento...&#x27;;
  }

  const runWithTimeout = (promise, ms, label) =&gt; Promise.race([
    promise,
    new Promise((_,reject)=&gt;setTimeout(()=&gt;reject(new Error(label)), ms))
  ]);

  try{
    // Viagem 1: calcula rota e tenta pedágios.
    await runWithTimeout(buscarRota(), 35000, &#x27;tempo excedido na Viagem 1&#x27;);

    // Viagem 2: calcula automaticamente, sem exigir outro clique.
    if(multi){
      try{
        await runWithTimeout(buscarTrecho2(), 35000, &#x27;tempo excedido na Viagem 2&#x27;);
      }catch(e){
        // Não trava o orçamento inteiro por causa de uma consulta de pedágio.
        const st=$(&#x27;statusTrecho2&#x27;);
        if(st){
          st.className=&#x27;status warn&#x27;;
          st.textContent=&#x27;⚠️ Rota da Viagem 2 não concluiu a consulta automática de pedágios. Confira os locais e tente novamente.&#x27;;
        }
      }
    }

    calcular(false);
    if(typeof saveQuote === &#x27;function&#x27;) saveQuote();

    // Keep the detailed route/toll result, including incomplete tariff warnings.
  }catch(e){
    showStatus(&#x27;A consulta não terminou. Confira os KM e informe os pedágios antes de enviar o orçamento.&#x27;,&#x27;warn&#x27;);
    if(!$(&#x27;pedagios&#x27;).value) $(&#x27;pedagios&#x27;).value=&#x27;&#x27;;
    calcular(false);
  }finally{
    if(principal){
      principal.disabled = false;
      principal.textContent = principal.dataset.oldText || &#x27;📍 Buscar rota, calcular KM, pedágios e orçamento&#x27;;
    }
  }
}

function ativarCalculoUber(){
  const ids=[&#x27;appHoras&#x27;,&#x27;appMinutos&#x27;,&#x27;appCorridas&#x27;,&#x27;appKmIni&#x27;,&#x27;appKmFim&#x27;,&#x27;appBruto&#x27;,&#x27;appGorjeta&#x27;,&#x27;appBonus&#x27;,&#x27;appComb&#x27;,&#x27;appPed&#x27;,&#x27;appEst&#x27;,&#x27;appOutras&#x27;];

function calcAppForm(){
  const kmIni=n(&#x27;appKmIni&#x27;), kmFim=n(&#x27;appKmFim&#x27;);
  const km=Math.max(0,kmFim-kmIni);
  const receita=n(&#x27;appBruto&#x27;)+n(&#x27;appGorjeta&#x27;)+n(&#x27;appBonus&#x27;);
  const despesas=n(&#x27;appComb&#x27;)+n(&#x27;appPed&#x27;)+n(&#x27;appEst&#x27;)+n(&#x27;appOutras&#x27;);
  const liquido=receita-despesas;
  const horas=horasAppDecimal();
  $(&#x27;appKmPrev&#x27;).textContent=km.toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27; km&#x27;;
  $(&#x27;appLiqPrev&#x27;).textContent=brl(liquido);
  $(&#x27;appHoraPrev&#x27;).textContent=brl(horas&gt;0?liquido/horas:0);
  $(&#x27;appKmValPrev&#x27;).textContent=brl(km&gt;0?liquido/km:0);
  return {km,receita,despesas,liquido};
}

async function buscarTrecho2(){
  const oi=String($(&#x27;origemTrecho2&#x27;)?.value||&#x27;&#x27;).trim();
  const di=String($(&#x27;destinoTrecho2&#x27;)?.value||&#x27;&#x27;).trim();

  // Clear only the Trip 2 route result so an old successful value
  // cannot hide a real failure.
  $(&#x27;kmTrecho2&#x27;).value=&#x27;&#x27;;
  $(&#x27;tempoTrecho2&#x27;).value=&#x27;-&#x27;;
  window.__trecho2={km:0,sec:0,pedagios:0};

  if(!oi||!di){
    showStatusTrecho2(&#x27;Preencha origem e destino da ida da viagem 2.&#x27;,&#x27;warn&#x27;);
    return;
  }

  showStatusTrecho2(&#x27;🔎 Calculando Viagem 2...&#x27;,&#x27;warn&#x27;);

  try{
    // The return is always the inverse of the outbound route.
    const [a,b]=await Promise.all([
      resolverPonto(oi,null,null),
      resolverPonto(di,null,null)
    ]);

    const [ida,volta]=await Promise.all([
      rotaOSRM(a,b),
      rotaOSRM(b,a)
    ]);

    const or=di, dr=oi;
    $(&#x27;origemRetornoTrecho2&#x27;).value=or;
    $(&#x27;destinoRetornoTrecho2&#x27;).value=dr;

    let ped=Number($(&#x27;pedagiosTrecho2&#x27;)?.value)||0;

    const texto2=[oi,di].join(&#x27; &#x27;).toLowerCase()
      .normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;);
    const rotaVcp2=/viracopos/.test(texto2) &amp;&amp;
      /limeira|horacio\s+cecchi|13482[\s-]?307/.test(texto2);

    if(rotaVcp2){
      const cat=calcularCatalogoLocal(ida.coords,volta.coords);
      if(cat &amp;&amp; cat.total&gt;0){
        ped=cat.total;
        $(&#x27;pedagiosTrecho2&#x27;).value=ped.toFixed(2);
      }
    }else{
      try{
        const [dyn1,dyn2]=await Promise.all([
          limitePromessaPedagio(calcularPedagiosDinamicos(ida.coords,[]),12000),
          limitePromessaPedagio(calcularPedagiosDinamicos(volta.coords,[]),12000)
        ]);
        if((dyn1.encontrados||0)+(dyn2.encontrados||0)&gt;0 &amp;&amp;
           dyn1.incompletos===0 &amp;&amp; dyn2.incompletos===0 &amp;&amp;
           (dyn1.total+dyn2.total)&gt;0){
          ped=(dyn1.total||0)+(dyn2.total||0);
          $(&#x27;pedagiosTrecho2&#x27;).value=ped.toFixed(2);
        }
      }catch(e){
        // KM can still be valid even if dynamic toll lookup times out.
      }
    }

    const km=ida.km+volta.km;
    const sec=ida.sec+volta.sec;

    window.__trecho2={
      km,sec,pedagios:ped,
      origem:oi,destino:di,
      origemRetorno:or,destinoRetorno:dr,
      data:$(&#x27;dataTrecho2&#x27;).value||&#x27;&#x27;,
      hora:$(&#x27;horaTrecho2&#x27;).value||&#x27;&#x27;,
      horaRetorno:$(&#x27;horaRetornoTrecho2&#x27;).value||&#x27;&#x27;
    };

    $(&#x27;kmTrecho2&#x27;).value=km.toFixed(1);
    $(&#x27;tempoTrecho2&#x27;).value=formatDuration(sec);

    showStatusTrecho2(
      `✅ Viagem 2 calculada — ${ida.km.toFixed(1)} km ida + ${volta.km.toFixed(1)} km retorno = ${km.toFixed(1)} km` +
      (ped&gt;0 ? ` • Pedágios: ${brl(ped)}` : &#x27;&#x27;),
      &#x27;ok&#x27;
    );

    calcular(false);
  }catch(e){
    console.error(e);
    // Only show an error if no KM was produced.
    if(!(parseFloat($(&#x27;kmTrecho2&#x27;)?.value)||0)){
      showStatusTrecho2(
        &#x27;⚠️ Não foi possível calcular a Viagem 2. Confira somente a origem e o destino da ida.&#x27;,
        &#x27;err&#x27;
      );
    }
  }
}

async function recalcularOrcamento(){
  try{
    // Se ainda não existe KM calculado, o botão deve calcular a rota também.
    // Isso evita que &quot;Recalcular&quot; apenas repita zeros em uma cotação nova.
    const kmExistente=n(&#x27;kmTotalInput&#x27;);
    const modo=$(&#x27;modoCotacao&#x27;)?.value||&#x27;&#x27;;
    const origem=(modo===&#x27;urbano&#x27;?$(&#x27;enderecoOrigem&#x27;)?.value:$(&#x27;origem&#x27;)?.value||&#x27;&#x27;).trim();
    const destino=(modo===&#x27;urbano&#x27;?$(&#x27;enderecoDestino&#x27;)?.value:$(&#x27;destino&#x27;)?.value||&#x27;&#x27;).trim();
    if(kmExistente&lt;=0 &amp;&amp; origem &amp;&amp; destino){
      const st=$(&#x27;rotaStatus&#x27;);
      if(st){st.className=&#x27;status warn&#x27;;st.textContent=&#x27;⏳ Calculando rota e orçamento...&#x27;;}
      await buscarTudo();
      return;
    }

    // Atualiza imediatamente os números principais, mesmo que alguma parte
    // secundária da mensagem/WhatsApp tenha algum problema.
    const kmBase=n(&#x27;kmTotalInput&#x27;);
    const t=window.__trecho2||{};
    const km=kmBase+(Number(t.km)||0)+operacaoTotais().km;
    const consumo=n(&#x27;consumo&#x27;);
    const precoLitro=n(&#x27;precoComb&#x27;);
    const litros=consumo&gt;0?km/consumo:0;
    const comb=(litros&gt;0&amp;&amp;precoLitro&gt;0)?litros*precoLitro:0;
    const pedagios=n(&#x27;pedagios&#x27;)+(Number(t.pedagios)||0)+operacaoTotais().pedagios;
    const custo=comb+pedagios;
    const margem=n(&#x27;margem&#x27;);
    const valorKm=Math.min(4,Math.max(0,n(&#x27;valorKm&#x27;)));
    const base=valorKm&gt;0?(km*valorKm)+pedagios:custo;
    const preco=base*(1+Math.max(0,margem)/100);
    const passageiros=Math.max(1,n(&#x27;passageiros&#x27;));
    const porPass=preco/passageiros;

    window._calc={km,litros,comb,pedagios,custo,preco,porPass,
      sinal:preco*Math.max(0,n(&#x27;sinalPct&#x27;))/100,
      saldo:Math.max(0,preco-(preco*Math.max(0,n(&#x27;sinalPct&#x27;))/100)),
      valorKm,lucro:preco-custo};

    if($(&#x27;kmView&#x27;)) $(&#x27;kmView&#x27;).textContent=km.toFixed(1)+&#x27; km&#x27;;
    if($(&#x27;litros&#x27;)) $(&#x27;litros&#x27;).textContent=litros.toFixed(1)+&#x27; L&#x27;;
    if($(&#x27;cComb&#x27;)) $(&#x27;cComb&#x27;).textContent=precoLitro&gt;0?brl(comb):&#x27;Informe R$/L&#x27;;
    if($(&#x27;cPed&#x27;)) $(&#x27;cPed&#x27;).textContent=brl(pedagios);
    if($(&#x27;custoTotal&#x27;)) $(&#x27;custoTotal&#x27;).textContent=brl(custo);
    if($(&#x27;precoFinal&#x27;)) $(&#x27;precoFinal&#x27;).textContent=brl(preco);
    if($(&#x27;porPass&#x27;)) $(&#x27;porPass&#x27;).textContent=brl(porPass);

    // Agora tenta gerar a mensagem completa e salvar o rascunho.
    try{ calcular(false); }catch(e){ console.warn(&#x27;Parte secundária do cálculo:&#x27;,e); }
    try{ saveQuote(); }catch(e){ console.warn(&#x27;Não foi possível salvar o rascunho:&#x27;,e); }

    const st=$(&#x27;rotaStatus&#x27;);
    if(st){ st.className=&#x27;status ok&#x27;; st.textContent=&#x27;✅ Orçamento recalculado.&#x27;; }
  }catch(e){
    alert(&#x27;O recálculo encontrou um erro. Os campos da cotação continuam preservados.&#x27;);
    console.error(e);
  }
}

function calcular(autosave=true){
  const kmBase=n(&#x27;kmTotalInput&#x27;), trecho2=(window.__trecho2||{}), km=kmBase+(Number(trecho2.km)||0)+operacaoTotais().km, consumo=n(&#x27;consumo&#x27;), precoLitro=n(&#x27;precoComb&#x27;);
  const litros=consumo&gt;0?km/consumo:0;
  const comb=(litros&gt;0&amp;&amp;precoLitro&gt;0)?litros*precoLitro:0;
  const pedagios=n(&#x27;pedagios&#x27;)+(Number(trecho2.pedagios)||0)+operacaoTotais().pedagios;
  const extras=0;
  const custo=comb+pedagios+extras;
  const margem=n(&#x27;margem&#x27;);
  const valorKm=Math.min(4,Math.max(0,n(&#x27;valorKm&#x27;)));
  // Primeiro calcula o valor-base da viagem.
  // Se houver valor por km configurado, ele continua sendo usado como base.
  // Depois aplica a Margem / lucro (%) sobre esse valor-base.
  const basePreco=valorKm&gt;0 ? (km*valorKm)+pedagios+extras : custo;
  const preco=basePreco*(1+Math.max(0,margem)/100);
  const passageiros=Math.max(1,n(&#x27;passageiros&#x27;));
  const porPass=preco/passageiros;
  const sinal=preco*Math.max(0,n(&#x27;sinalPct&#x27;))/100;
  const saldo=Math.max(0,preco-sinal);
  window._calc={km,litros,comb,pedagios,custo,preco,porPass,sinal,saldo,valorKm,lucro:preco-custo};

  $(&#x27;kmView&#x27;).textContent=km.toFixed(1)+&#x27; km&#x27;;
  $(&#x27;litros&#x27;).textContent=litros.toFixed(1)+&#x27; L&#x27;;
  $(&#x27;cComb&#x27;).textContent=precoLitro&gt;0?brl(comb):&#x27;Informe R$/L&#x27;;
  const op=operacaoTotais();
  const pedagioPendente=(kmBase&gt;0&amp;&amp;$(&#x27;pedagios&#x27;).value===&#x27;&#x27;)||op.pendente;
  $(&#x27;cPed&#x27;).textContent=pedagioPendente?&#x27;Não confirmado&#x27;:brl(pedagios);
  $(&#x27;custoTotal&#x27;).textContent=brl(custo);
  if($(&#x27;valorKmView&#x27;)) $(&#x27;valorKmView&#x27;).textContent=brl(valorKm)+&#x27;/km&#x27;;
  $(&#x27;precoFinal&#x27;).textContent=brl(preco);
  $(&#x27;porPass&#x27;).textContent=brl(porPass);

  const aviso=$(&#x27;calcAviso&#x27;);
  if(aviso){
    const faltas=[];
    if(op.pendente)faltas.push(&#x27;⚠️ Confira quilômetros e pedágios de todos os trechos da sequência. Digite 0 apenas quando não houver custo.&#x27;);
    if(pedagioPendente)faltas.push(&#x27;⚠️ Preço parcial: pedágios não confirmados. Informe o total de pedágios antes de enviar o orçamento.&#x27;);
    if(km&gt;0 &amp;&amp; precoLitro&lt;=0) faltas.push(&#x27;⚠️ Informe o preço do combustível por litro em ⚙️ Veículos e combustíveis.&#x27;);
    const tollInputs=[...document.querySelectorAll(&#x27;.tollval&#x27;)];
    if(tollInputs.some(x=&gt;(parseFloat(x.value)||0)&lt;=0)) faltas.push(&#x27;⚠️ Há pedágio localizado sem preço conhecido. Preencha o valor da praça uma vez; o app salvará para as próximas rotas.&#x27;);
    aviso.style.display=faltas.length?&#x27;block&#x27;:&#x27;none&#x27;;
    aviso.innerHTML=faltas.join(&#x27; • &#x27;);

      return (d&gt;=ini &amp;&amp; d&lt;=fim) ? s+(Number(x.liq)||0) : s;
    },0);
  }
  function execTotal(ini){
    var a=[];
    try{ a=JSON.parse(localStorage.getItem(&#x27;michelonHistoricoV5&#x27;)||&#x27;[]&#x27;)||[]; }catch(e){}

    },0);
  }
  function moeda(v){return Number(v||0).toLocaleString(&#x27;pt-BR&#x27;,{style:&#x27;currency&#x27;,currency:&#x27;BRL&#x27;});}
  [[&#x27;Hoje&#x27;,hoje],[&#x27;Semana&#x27;,semana],[&#x27;Mes&#x27;,mes],[&#x27;Ano&#x27;,ano]].forEach(function(p){

}

(() =&gt; {
  const FINANCE=&#x27;https://andersonmichelon08-dev.github.io/meu-financeiro&#x27;;
  const IMPORT_URL=&#x27;https://tabdtuujeuwplckpzjvm.supabase.co/rest/v1/rpc/mf_michelon_import&#x27;;
  const PUBLIC_KEY=&#x27;sb_publishable_1MhIIpF8npEuPrVFagdi-g_cWvBeTnR&#x27;;
  const KEY=&#x27;michelon_meu_financeiro_integracao_v1&#x27;;
  const ALLOWED=new Set([&#x27;https://michelon-controle-viagem.galvanicagama-financ.chatgpt.site&#x27;,&#x27;https://andersonmichelon08-dev.github.io&#x27;]);
  let saved;try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{saved={}}
  let state={token:saved.token||&#x27;&#x27;,ack:saved.ack||{}},sending=false,again=false,verifyAll=true,forceAfter=false,nonce=&#x27;&#x27;,popup=null,timer;
  const panel=document.createElement(&#x27;section&#x27;);panel.className=&#x27;card&#x27;;panel.id=&#x27;michelon-finance-integration&#x27;;
  panel.innerHTML=&#x27;&lt;h2&gt;Meu Financeiro&lt;/h2&gt;&lt;p id=&quot;mfStatus&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;div class=&quot;btns&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;mfConnect&quot;&gt;Conectar Meu Financeiro&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;secondary&quot; id=&quot;mfPaste&quot;&gt;Colar código de conexão&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;secondary&quot; id=&quot;mfRetry&quot;&gt;Enviar agora&lt;/button&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;color:#64748b&quot;&gt;Ganhos Uber → Uber Conta (confirmado na função do servidor). Correções de dias antigos ficam somente no Minhas Viagens até conciliação; não são reenviadas automaticamente.&lt;/p&gt;&#x27;;
  const anchor=document.getElementById(&#x27;mcHomeDash&#x27;);if(anchor)anchor.after(panel);else(document.querySelector(&#x27;.wrap&#x27;)||document.body).prepend(panel);
  const message=panel.querySelector(&#x27;#mfStatus&#x27;);
  const tell=text=&gt;{message.textContent=text};
  const persist=()=&gt;localStorage.setItem(KEY,JSON.stringify(state));
  const records=()=&gt;[...(typeof getApps===&#x27;function&#x27;?getApps():[]).map(record=&gt;({kind:&#x27;apps&#x27;,record})),...(typeof getHist===&#x27;function&#x27;?getHist():[]).map(record=&gt;({kind:&#x27;trip&#x27;,record}))];
  // Only fields relevant to the financial entry affect synchronization.
  function normalize(item){const r=item.record;return {kind:item.kind,record:item.kind===&#x27;apps&#x27;?{id:r.id,data:r.data,app:r.app,receita:r.receita,bruto:r.bruto,gorjeta:r.gorjeta,bonus:r.bonus,comb:r.comb,ped:r.ped,est:r.est,outras:r.outras,obs:r.obs}:{id:r.id,data:r.data,numero:r.numero,cliente:r.cliente,recebido:r.recebido,valor:r.valor,status:r.status,forma:r.forma,obs:r.obs}}}
  function held(item){try{const h=JSON.parse(localStorage.getItem(&#x27;michelon_apps_edicoes_pendentes_v1&#x27;))||{};return Boolean(h[item.kind+&#x27;:&#x27;+item.record.id])}catch{return false}}
  function pending(all=false){return records().map(normalize).filter(item=&gt;!held(item)&amp;&amp;(all||state.ack[item.kind+&#x27;:&#x27;+item.record.id]!==JSON.stringify(item)));}
  function holdCount(){try{return Object.keys(JSON.parse(localStorage.getItem(&#x27;michelon_apps_edicoes_pendentes_v1&#x27;))||{}).length}catch{return 0}}
  function refreshConnection(){
    try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&amp;&amp;typeof stored.token===&#x27;string&#x27;){
      if(stored.token!==state.token)verifyAll=true;
      state={token:stored.token,ack:stored.ack||{}};
    }}catch{}
  }
  async function send(force=false){
    refreshConnection();
    if(!state.token){tell(&#x27;A conexão não está salva neste aparelho. Use Colar código de conexão com o código já gerado.&#x27;);return}
    if(force)verifyAll=true;
    if(sending){again=true;if(force)forceAfter=true;tell(&#x27;O envio está em andamento. Vou conferir novamente ao terminar.&#x27;);return}sending=true;
    try{
      if(!navigator.onLine){tell(&#x27;Sem internet. Os lançamentos continuam salvos e serão enviados quando a conexão voltar.&#x27;);return}
      const all=pending(true);
      if(!all.length){tell(holdCount()?&#x27;⚠️ Há &#x27;+holdCount()+&#x27; edição(ões) aguardando conciliação. Não foram reenviadas ao Meu Financeiro.&#x27;:&#x27;Não há registros disponíveis para envio neste aparelho.&#x27;);return}
      // Local acknowledgements are a cache, not proof that the server has the

      // The existing server updates stable IDs and makes these retries safe.

      for(const item of queue){
        // Uma edição pode ocorrer enquanto a fila está em andamento.
        // Verificar novamente antes de cada envio impede reenvio da edição retida.
        if(held(item))continue;

        try{
          const response=await fetch(IMPORT_URL,{method:&#x27;POST&#x27;,credentials:&#x27;omit&#x27;,signal:controller.signal,headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;,&#x27;apikey&#x27;:PUBLIC_KEY},body:JSON.stringify({p_token:token,p_input:item})});

      if(failed){verifyAll=true;tell(confirmed+&#x27; registro(s) confirmado(s); &#x27;+failed+&#x27; pendente(s). &#x27;+firstError);return}
      verifyAll=false;
      if(pending().length){again=true;tell(&#x27;Há novos lançamentos para enviar…&#x27;)}
      else tell(holdCount()?&#x27;✓ Outros registros enviados. ⚠️ &#x27;+holdCount()+&#x27; edição(ões) histórica(s) retida(s) neste aparelho, aguardando conciliação no Meu Financeiro.&#x27;:&#x27;✓ Registros confirmados no Meu Financeiro.&#x27;);
    }catch(error){tell(error.message||&#x27;Envio pendente. Os registros continuam salvos no MICHELON.&#x27;);}
    finally{sending=false;if(forceAfter){verifyAll=true;forceAfter=false}if(again){again=false;schedule()}}
  }
  const schedule=()=&gt;{clearTimeout(timer);timer=setTimeout(send,700)};
  function accept(token){if(!/^[a-f0-9]{64}$/.test(token)){tell(&#x27;Código inválido. Copie o código completo da página de conexão.&#x27;);return}state={token,ack:{}};persist();schedule();}
  panel.querySelector(&#x27;#mfConnect&#x27;).onclick=()=&gt;{
    if(!ALLOWED.has(location.origin)){tell(&#x27;Abra a versão publicada para conectar. Arquivos locais não têm uma origem segura para sincronizar.&#x27;);return}
    refreshConnection();
    if(state.token){send(true);return}
    panel.querySelector(&#x27;#mfPaste&#x27;).click();
    tell(&#x27;Cole o código da conexão existente. Nenhuma nova conexão será criada.&#x27;);
  };
  window.addEventListener(&#x27;message&#x27;,event=&gt;{if(event.origin!==FINANCE||event.source!==popup||event.data?.type!==&#x27;michelon-finance-connected&#x27;||event.data.nonce!==nonce)return;accept(event.data.token)});
  panel.querySelector(&#x27;#mfPaste&#x27;).onclick=()=&gt;{
    let form=panel.querySelector(&#x27;#mfCodeForm&#x27;);
    if(!form){
      form=document.createElement(&#x27;div&#x27;);form.id=&#x27;mfCodeForm&#x27;;form.style.marginTop=&#x27;12px&#x27;;
      form.innerHTML=&#x27;&lt;label for=&quot;mfCodeInput&quot;&gt;Cole seu código de conexão&lt;/label&gt;&lt;textarea id=&quot;mfCodeInput&quot; rows=&quot;3&quot; autocomplete=&quot;off&quot; autocapitalize=&quot;none&quot; spellcheck=&quot;false&quot; placeholder=&quot;Toque aqui e cole o código já gerado&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;btns&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;mfCodeConfirm&quot;&gt;Confirmar código&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;secondary&quot; id=&quot;mfCodeCancel&quot;&gt;Cancelar&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;mfCodeError&quot; role=&quot;alert&quot; style=&quot;color:#b91c1c&quot; hidden&gt;&lt;/p&gt;&#x27;;
      panel.querySelector(&#x27;#mfPaste&#x27;).parentElement.after(form);
      form.querySelector(&#x27;#mfCodeConfirm&#x27;).onclick=()=&gt;{
        const input=form.querySelector(&#x27;#mfCodeInput&#x27;),code=input.value.trim(),error=form.querySelector(&#x27;#mfCodeError&#x27;);
        if(!/^[a-f0-9]{64}$/.test(code)){error.textContent=&#x27;Cole o código completo gerado na página de conexão.&#x27;;error.hidden=false;input.focus();return}
        if(code===state.token)schedule();else accept(code);
        error.hidden=true;input.value=&#x27;&#x27;;form.hidden=true;tell(&#x27;Código confirmado. Enviando os lançamentos…&#x27;);
      };
      form.querySelector(&#x27;#mfCodeCancel&#x27;).onclick=()=&gt;{form.hidden=true;panel.querySelector(&#x27;#mfPaste&#x27;).focus()};
    }
    form.hidden=false;form.querySelector(&#x27;#mfCodeError&#x27;).hidden=true;form.querySelector(&#x27;#mfCodeInput&#x27;).focus();
  };
  panel.querySelector(&#x27;#mfRetry&#x27;).onclick=()=&gt;send(true);
  // Wrappers preserve original arguments, results and rendering. No calculation changes.
  for(const name of [&#x27;setApps&#x27;,&#x27;setHist&#x27;]){const original=window[name];if(typeof original===&#x27;function&#x27;)window[name]=function(){const result=original.apply(this,arguments);schedule();return result}}
  window.addEventListener(&#x27;online&#x27;,schedule);window.addEventListener(&#x27;storage&#x27;,schedule);
  document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(!document.hidden)schedule()});
  setInterval(()=&gt;{refreshConnection();if(state.token&amp;&amp;(verifyAll||pending().length))schedule()},15000);
  schedule();
})();

&lt;style&gt;
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#6b7280;--line:#e5e7eb;--nav:#0f172a;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 30px #0f172a22}
.top h1{margin:0;font-size:clamp(25px,4vw,38px)}.top p{margin:6px 0 0;color:#dbeafe}
.app-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}
.actions{display:flex;flex-direction:column;gap:9px;margin:18px 0;position:sticky;top:12px}
.actions button{width:100%;text-align:left;justify-content:flex-start;padding:13px 16px}
.main-content{min-width:0}
@media(max-width:900px){.app-layout{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:repeat(2,1fr);position:static}.actions button{text-align:center}}
@media(max-width:560px){.actions{grid-template-columns:1fr}}
button,.btn{border:0;border-radius:16px;padding:15px;font-weight:800;cursor:pointer;font-size:15px}.income{background:#dcfce7;color:#166534}.expense{background:#fee2e2;color:#991b1b}.neutral{background:#e0e7ff;color:#3730a3}.pending{background:#fef3c7;color:#92400e}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 6px 20px #0f172a0b}
.card small{color:var(--muted);font-weight:700}.card strong{display:block;font-size:23px;margin-top:7px}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section h2{font-size:19px}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}
.tablebox{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc;color:#475569}.tag{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.tag.Pendente{background:#fef3c7;color:#92400e}.tag.Pago,.tag.Recebido{background:#dcfce7;color:#166534}.tag.Aplicado{background:#ede9fe;color:#5b21b6}
.empty{text-align:center;padding:35px;color:var(--muted)}dialog{border:0;border-radius:22px;padding:0;width:min(620px,94vw);box-shadow:0 30px 80px #0005}dialog::backdrop{background:#0f172a99}
.modal{padding:22px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#475569}input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:12px;padding:12px;background:#fff}textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.save{background:var(--blue);color:#fff}.cancel{background:#e5e7eb;color:#334155}
.iconbtn{padding:7px 10px;border-radius:9px;background:#f1f5f9;color:#334155;font-weight:700}.danger{color:#b91c1c}.note{font-size:12px;color:var(--muted);margin-top:12px}
.hero-card{background:linear-gradient(135deg,#ecfdf5,#dbeafe);border:1px solid #bfdbfe}
.hero-card strong{font-size:28px}
.overdue{color:#b91c1c;font-weight:800}.soon{color:#b45309;font-weight:800}
.quickpay{background:#dcfce7;color:#166534}.transfer{background:#cffafe;color:#155e75}
.backup{background:#ede9fe;color:#5b21b6}
.manager-list{display:grid;gap:9px;max-height:55vh;overflow:auto;margin-top:12px}.manager-row{display:grid;grid-template-columns:95px 1fr 120px 120px auto;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.manager-row small{color:var(--muted)}@media(max-width:700px){.manager-row{grid-template-columns:1fr 1fr}.manager-row .manager-desc{grid-column:1/-1}}
.fixed-list{display:grid;gap:9px;margin-top:14px}.fixed-head{display:grid;grid-template-columns:1.5fr .75fr .65fr .9fr .85fr auto;gap:8px;padding:0 10px;font-size:12px;font-weight:800;color:var(--muted)}.fixed-row{display:grid;grid-template-columns:1.5fr .75fr .65fr .9fr .85fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.fixed-row input,.fixed-row select{width:100%;padding:9px}.fixed-row button{padding:9px 11px;border-radius:10px}@media(max-width:800px){.fixed-head{display:none}.fixed-row{grid-template-columns:1fr 1fr}.fixed-row .wide{grid-column:1/-1}}
.monthbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.monthbar select{border:1px solid var(--line);border-radius:12px;padding:10px;background:white;font-weight:700}
.summaryline{font-size:13px;color:var(--muted);margin-top:5px}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:9px}.progress&gt;span{display:block;height:100%;background:#2563eb;border-radius:999px}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.dash-box{border:1px solid var(--line);border-radius:16px;padding:14px;background:#f8fafc}.dash-box h3{margin:0 0 8px}.dash-box strong{font-size:24px}.dash-list{margin-top:10px;display:grid;gap:7px}.dash-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}.dash-wide{grid-column:1/-1}.dash-bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.dash-bar span{display:block;height:100%;background:#2563eb}@media(max-width:800px){.dash-grid{grid-template-columns:1fr}}
.budget-list{display:grid;gap:10px;margin-top:14px}.budget-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc}.budget-top{display:grid;grid-template-columns:1fr 140px auto;gap:9px;align-items:center}.budget-ok{color:#166534}.budget-warn{color:#b45309}.budget-over{color:#b91c1c}@media(max-width:650px){.budget-top{grid-template-columns:1fr 110px}.budget-top button{grid-column:1/-1}}
@media(max-width:850px){.actions{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.cards .card:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:10px}.top{border-radius:18px}}

#manualDlg .modal{max-width:1050px}#manualDlg .manual-step{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:18px;margin:14px 0}#manualDlg .manual-step h3{margin:0 0 8px;color:#102b55}#manualDlg .manual-step p{color:#52647c;line-height:1.5}#manualDlg .manual-img{width:100%;height:auto;border-radius:14px;border:1px solid #dbe4ef;margin-top:10px}#manualDlg .tip{background:#fff4c7;border-radius:12px;padding:12px 14px;margin-top:10px;color:#694f00;font-weight:700}#manualDlg .manual-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#manualDlg .manual-nav button{padding:9px 12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}#manualDlg .manual-step ul{line-height:1.7;color:#334155}

&lt;div class=&quot;manual-step&quot; id=&quot;m2&quot;&gt;&lt;h3&gt;2. Como lançar uma despesa&lt;/h3&gt;&lt;p&gt;Clique em &lt;b&gt;Nova Despesa&lt;/b&gt;. Informe data, descrição, categoria, banco, valor e vencimento. No campo Banco, escolha um banco cadastrado. Para incluir, editar ou excluir bancos, use o botão &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. Deixe &lt;b&gt;Pendente&lt;/b&gt; se ainda não pagou. Depois clique em &lt;b&gt;Salvar lançamento&lt;/b&gt;.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTA0IiB2aWV3Qm94PSIwIDAgOTAwIDUwNCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIE5vdmEgRGVzcGVzYTwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkRhdGE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIxMDUiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIxMzAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+MDUvMTAvMjAyNjwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTc4IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkRlc2NyacOnw6NvPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTUzIiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTc4IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkVuZXJnaWE8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5DYXRlZ29yaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PS &lt;div class=&quot;manual-step&quot; id=&quot;m3&quot;&gt;&lt;h3&gt;3. Como lançar receita e salário&lt;/h3&gt;&lt;p&gt;Para uma receita comum, clique em &lt;b&gt;Nova Receita&lt;/b&gt;. Para seus pagamentos, use os botões &lt;b&gt;Salário dia 05&lt;/b&gt; e &lt;b&gt;Salário dia 20&lt;/b&gt;. Quando o dinheiro entrar, deixe o status como &lt;b&gt;Recebido&lt;/b&gt;.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNDA4IiB2aWV3Qm94PSIwIDAgOTAwIDQwOCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIE5vdmEgUmVjZWl0YSAvIFNhbMOhcmlvPC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxMzAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+RGF0YTwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjEwNSIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj4wNS8xMC8yMDI2PC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+RGVzY3Jpw6fDo288L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIxNTMiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+U2Fsw6FyaW8gLSBkaWEgMDU8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5DYXRlZ29yaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+ &lt;div class=&quot;manual-step&quot; id=&quot;m4&quot;&gt;&lt;h3&gt;4. Como cadastrar Contas Fixas&lt;/h3&gt;&lt;p&gt;Entre em &lt;b&gt;Contas Fixas&lt;/b&gt; e informe o nome, valor, dia de pagamento, categoria e banco. O campo Banco usa a lista cadastrada em &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. O sistema soma automaticamente quanto você tem para pagar no dia 05, no dia 20 e no total.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgOTAwIDM2MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIENvbnRhcyBGaXhhczwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkNvbnRhPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTA1IiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkVuZXJnaWE8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5WYWxvcjwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SJCAzMjAsMDA8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5QYWdhciBkaWE8L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+MDU8L3Rl &lt;div class=&quot;manual-step&quot; id=&quot;m5&quot;&gt;&lt;h3&gt;5. Reserva / Investimento&lt;/h3&gt;&lt;p&gt;Use este campo quando separar dinheiro para sua reserva. Informe o valor, de qual conta saiu e o nome da reserva. Esse movimento não é tratado como uma despesa comum.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgOTAwIDM2MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkV4ZW1wbG8g4oCUIFJlc2VydmEgLyBJbnZlc3RpbWVudG88L3RleHQ+PHRleHQgeD0iNDUiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5EYXRhPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMTA1IiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPjA1LzEwLzIwMjY8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5WYWxvcjwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SJCAzMDAsMDA8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5PcmlnZW08L3RleHQ+PHJlY3QgeD0iMjUwIiB5PSIyMDEiIHdpZHRoPSI2MDAiIGhlaWdodD0iMzgiIHJ4PSI5IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjY2JkNWUxIi8+PHRleHQgeD0iMjY4IiB5PSIyMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzBmMTcyYSI+SXRhw7o8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjI3NCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwI &lt;div class=&quot;manual-step&quot;&gt;&lt;h3&gt;6. Dashboard e acompanhamento&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Tela inicial / Dashboard:&lt;/b&gt; reúne entradas, saídas, saldo, reserva, saldos por banco, lançamentos recentes, contas a vencer, gráficos de Entradas x Saídas, Gastos por Categoria e Meta de Reserva.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Contas Pendentes:&lt;/b&gt; mostra o que ainda precisa ser pago.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Gerenciar / Excluir:&lt;/b&gt; permite corrigir ou apagar lançamentos.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Limites de Gastos:&lt;/b&gt; define limites mensais por categoria.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Meta da Reserva:&lt;/b&gt; define quanto você pretende guardar.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;manual-step&quot; id=&quot;m7&quot;&gt;&lt;h3&gt;7. Como cadastrar Bancos / Contas&lt;/h3&gt;&lt;p&gt;Clique em &lt;b&gt;🏦 Bancos&lt;/b&gt; no menu lateral. Digite o nome do banco ou da conta, por exemplo &lt;b&gt;Santander&lt;/b&gt;, &lt;b&gt;Nubank&lt;/b&gt; ou &lt;b&gt;Caixa&lt;/b&gt;, e clique em &lt;b&gt;+ Cadastrar&lt;/b&gt;. O banco ficará disponível automaticamente nos novos lançamentos, Contas Fixas, Transferências e Reserva/Investimento.&lt;/p&gt;&lt;div class=&quot;tip&quot;&gt;🏦 Para corrigir um nome, altere-o e clique em &lt;b&gt;Salvar&lt;/b&gt;. Para remover um banco que não será mais usado, clique em &lt;b&gt;Excluir&lt;/b&gt;. Se ele já estiver vinculado a lançamentos, o sistema avisa antes.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;manual-step&quot; id=&quot;m6&quot;&gt;&lt;h3&gt;7. Backup e segurança&lt;/h3&gt;&lt;p&gt;Faça backup periodicamente, principalmente antes de usar &lt;b&gt;Zerar todos os lançamentos&lt;/b&gt;. Se precisar, o botão Restaurar Backup recupera uma cópia salva.&lt;/p&gt;&lt;img class=&quot;manual-img&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iMjY0IiB2aWV3Qm94PSIwIDAgOTAwIDI2NCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjIwIiBmaWxsPSIjZjVmOGZjIi8+PHJlY3QgeD0iMjUiIHk9IjIyIiB3aWR0aD0iODUwIiBoZWlnaHQ9IjYwIiByeD0iMTQiIGZpbGw9IiMxMDJiNTUiLz48dGV4dCB4PSI1MCIgeT0iNjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0id2hpdGUiPkJhY2t1cCDigJQgcHJvdGXDp8OjbyBkb3Mgc2V1cyBkYWRvczwvdGV4dD48dGV4dCB4PSI0NSIgeT0iMTMwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzMzQxNTUiPkZhemVyIEJhY2t1cDwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjEwNSIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjEzMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5TYWx2YSB1bWEgY8OzcGlhIGRvcyBkYWRvcyBlbSBhcnF1aXZvPC90ZXh0Pjx0ZXh0IHg9IjQ1IiB5PSIxNzgiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzMzNDE1NSI+UmVzdGF1cmFyIEJhY2t1cDwvdGV4dD48cmVjdCB4PSIyNTAiIHk9IjE1MyIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOCIgcng9IjkiIGZpbGw9IndoaXRlIiBzdHJva2U9IiNjYmQ1ZTEiLz48dGV4dCB4PSIyNjgiIHk9IjE3OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMGYxNzJhIj5SZWN1cGVyYSB1bWEgY8OzcGlhIHNhbHZhIGFudGVyaW9ybWVudGU8L3RleHQ+PHRleHQgeD0iNDUiIHk9IjIyNiIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzM0MTU1Ij5JbXBvcnRhbnRlPC90ZXh0PjxyZWN0IHg9IjI1MCIgeT0iMjAxIiB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4IiByeD0iOSIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2NiZDVlMSIvPjx0ZXh0IHg9IjI2OCIgeT0iMjI2IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMwZjE3MmEiPkZhw6dh &lt;div class=&quot;manual-step&quot;&gt;&lt;h3&gt;8. Zerar todos os lançamentos&lt;/h3&gt;&lt;p&gt;Use somente quando quiser começar novamente com o sistema limpo. A função pede confirmação antes de apagar. Faça um backup antes.&lt;/p&gt;&lt;div class=&quot;tip&quot;&gt;⚠️ Esta função apaga os lançamentos e as Contas Fixas conforme configurado na versão atual.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;manualDlg.close()&quot;&gt;Fechar manual&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/dialog&gt;
&lt;dialog id=&quot;bankDlg&quot;&gt;
&lt;div class=&quot;modal&quot;&gt;
  &lt;h2&gt;🏦 Bancos&lt;/h2&gt;
  &lt;p class=&quot;muted&quot;&gt;Cadastre aqui os bancos e contas que deseja usar no financeiro.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;align-items:end;margin:14px 0 18px&quot;&gt;
    &lt;div class=&quot;field&quot; style=&quot;flex:1&quot;&gt;&lt;label&gt;Novo banco / conta&lt;/label&gt;&lt;input id=&quot;newBankName&quot; placeholder=&quot;Ex.: Santander, Nubank, Caixa&quot;&gt;&lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;save&quot; onclick=&quot;addBank()&quot;&gt;＋ Cadastrar&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;bankManagerList&quot; class=&quot;manager-list&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;bankDlg.close()&quot;&gt;Fechar&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;dlg&quot;&gt;
&lt;form class=&quot;modal&quot; onsubmit=&quot;save(event)&quot;&gt;
  &lt;h2 id=&quot;formTitle&quot;&gt;Novo lançamento&lt;/h2&gt;
  &lt;input type=&quot;hidden&quot; id=&quot;editId&quot;&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Tipo&lt;/label&gt;&lt;select id=&quot;tipo&quot; required&gt;&lt;option&gt;Despesa&lt;/option&gt;&lt;option&gt;Receita&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Data&lt;/label&gt;&lt;input id=&quot;data&quot; type=&quot;date&quot; required&gt;&lt;/div&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2&quot;&gt;&lt;/script&gt;
&lt;script&gt;
&#x27;use strict&#x27;;
// Personal migration transport. Financial UI and calculations live in the original script.
let mfClient=null, mfOpening=false;
const mfOwner=&#x27;dae57ac1-d23d-476f-9037-4c04e0e46e7a&#x27;;
function mfAuthMessage(message){document.getElementById(&#x27;mfAuthMessage&#x27;).textContent=message;}
function mfRequireLogin(message=&#x27;Entre com seu acesso pessoal.&#x27;){document.getElementById(&#x27;mfAuthGate&#x27;).hidden=false;mfAuthMessage(message);}
function mfResponse(status,data){return new Response(JSON.stringify(data),{status,headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;}});}
async function mfCloudFetch(_url,options={}){
 if(!mfClient)return mfResponse(503,{error:&#x27;Conexão indisponível&#x27;});
 const {data:auth,error:sessionError}=await mfClient.auth.getSession();
 if(sessionError||auth.session?.user.id!==mfOwner){mfRequireLogin();return mfResponse(401,{error:&#x27;Entre novamente&#x27;});}
 const write=options.method===&#x27;POST&#x27;;
 let args;
 if(write){const input=JSON.parse(options.body);args={p_data:input.data,p_revision:input.revision};}
 const {data,error}=await mfClient.rpc(write?&#x27;mf_write&#x27;:&#x27;mf_read&#x27;,args);
 if(error){
  const denied=[&#x27;42501&#x27;,&#x27;PGRST301&#x27;,&#x27;PGRST302&#x27;,&#x27;PGRST303&#x27;].includes(error.code)||[401,403].includes(error.status);
  if(denied)mfRequireLogin(&#x27;Sua sessão terminou. Entre novamente para sincronizar.&#x27;);
  return mfResponse(denied?401:503,{error:&#x27;Não foi possível sincronizar&#x27;});
 }
 if(write&amp;&amp;data?.conflict)return mfResponse(409,data);
 if(!data||!Number.isSafeInteger(data.revision)||(write&amp;&amp;data.ok!==true))return mfResponse(503,{error:&#x27;Resposta inesperada do banco&#x27;});
 return mfResponse(200,data);
}
async function mfOpenApp(){
 if(mfOpening)return;mfOpening=true;
 try{
  const {data,error}=await mfClient.auth.getSession();
  if(error||data.session?.user.id!==mfOwner){mfRequireLogin();return;}
  mfAuthMessage(&#x27;Conferindo seus dados…&#x27;);
  // Confirm authorization on the server before exposing financial data.
  const verify=await mfCloudFetch(&#x27;/api/sync&#x27;);
  if(!verify.ok){mfRequireLogin(&#x27;Não foi possível acessar o banco. Confira a conexão e tente novamente.&#x27;);return;}
  if(syncDirty){syncReady=true;await flushSync();}
  else await initSync();
  if(!syncReady){mfRequireLogin(&#x27;Não foi possível carregar os dados. Tente novamente.&#x27;);return;}
  document.getElementById(&#x27;mfAuthGate&#x27;).hidden=true;
 }catch{mfRequireLogin(&#x27;Não foi possível conectar. Seus dados locais foram mantidos.&#x27;);}
 finally{mfOpening=false;}
