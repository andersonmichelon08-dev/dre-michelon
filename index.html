&lt;div class=&quot;modal&quot;&gt;
  &lt;h2&gt;🏦 Bancos&lt;/h2&gt;
  &lt;p class=&quot;muted&quot;&gt;Cadastre aqui os bancos e contas que deseja usar no financeiro.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;align-items:end;margin:14px 0 18px&quot;&gt;
    &lt;div class=&quot;field&quot; style=&quot;flex:1&quot;&gt;&lt;label&gt;Novo banco / conta&lt;/label&gt;&lt;input id=&quot;newBankName&quot; placeholder=&quot;Ex.: Santander, Nubank, Caixa&quot;&gt;&lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;save&quot; onclick=&quot;addBank()&quot;&gt;＋ Cadastrar&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;bankManagerList&quot; class=&quot;manager-list&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;bankDlg.close()&quot;&gt;Fechar&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;dlg&quot;&gt;
&lt;form class=&quot;modal&quot; onsubmit=&quot;save(event)&quot;&gt;
  &lt;h2 id=&quot;formTitle&quot;&gt;Novo lançamento&lt;/h2&gt;
  &lt;input type=&quot;hidden&quot; id=&quot;editId&quot;&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Tipo&lt;/label&gt;&lt;select id=&quot;tipo&quot; required&gt;&lt;option&gt;Despesa&lt;/option&gt;&lt;option&gt;Receita&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Data&lt;/label&gt;&lt;input id=&quot;data&quot; type=&quot;date&quot; required&gt;&lt;/div&gt;
    &lt;div class=&quot;field full&quot;&gt;&lt;label&gt;Descrição&lt;/label&gt;&lt;input id=&quot;descricao&quot; required placeholder=&quot;Ex.: Mercado, salário, combustível&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Categoria&lt;/label&gt;&lt;select id=&quot;categoria&quot;&gt;&lt;option&gt;Moradia&lt;/option&gt;&lt;option&gt;Alimentação&lt;/option&gt;&lt;option&gt;Transporte&lt;/option&gt;&lt;option&gt;Combustível&lt;/option&gt;&lt;option&gt;Saúde&lt;/option&gt;&lt;option&gt;Lazer&lt;/option&gt;&lt;option&gt;Assinaturas&lt;/option&gt;&lt;option&gt;Impostos&lt;/option&gt;&lt;option&gt;Salário&lt;/option&gt;&lt;option&gt;Uber / Corridas&lt;/option&gt;&lt;option&gt;Outras Receitas&lt;/option&gt;&lt;option&gt;Outras Despesas&lt;/option&gt;&lt;option&gt;Transferência&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Banco&lt;/label&gt;&lt;div style=&quot;display:flex;gap:8px;align-items:center&quot;&gt;&lt;select id=&quot;banco&quot; required style=&quot;flex:1&quot;&gt;&lt;/select&gt;&lt;button type=&quot;button&quot; class=&quot;neutral&quot; onclick=&quot;openBanks()&quot; style=&quot;white-space:nowrap;padding:12px 14px&quot;&gt;➕ Novo banco&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label id=&quot;valorLabel&quot;&gt;Valor&lt;/label&gt;&lt;input id=&quot;valor&quot; type=&quot;number&quot; step=&quot;0.01&quot; min=&quot;0.01&quot; required placeholder=&quot;0,00&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Status&lt;/label&gt;&lt;select id=&quot;status&quot;&gt;&lt;option&gt;Pendente&lt;/option&gt;&lt;option&gt;Pago&lt;/option&gt;&lt;option&gt;Recebido&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Vencimento&lt;/label&gt;&lt;input id=&quot;vencimento&quot; type=&quot;date&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Forma de pagamento&lt;/label&gt;&lt;select id=&quot;forma&quot;&gt;&lt;option&gt;Pix&lt;/option&gt;&lt;option&gt;Débito&lt;/option&gt;&lt;option&gt;Crédito&lt;/option&gt;&lt;option&gt;Dinheiro&lt;/option&gt;&lt;option&gt;Boleto&lt;/option&gt;&lt;option&gt;Transferência&lt;/option&gt;&lt;option&gt;Outro&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Parcela&lt;/label&gt;&lt;input id=&quot;parcela&quot; placeholder=&quot;Ex.: 3 ou 1/3&quot; oninput=&quot;mfUpdateInstallmentLabel()&quot; title=&quot;Novo lançamento: informe o valor total da compra e a quantidade de parcelas (3 ou 1/3). Ao editar, o valor é o da parcela já salva.&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Recorrente todo mês? (gera 12 meses)&lt;/label&gt;&lt;select id=&quot;recorrente&quot;&gt;&lt;option&gt;Não&lt;/option&gt;&lt;option&gt;Sim&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;field full&quot;&gt;&lt;label&gt;Observação&lt;/label&gt;&lt;textarea id=&quot;obs&quot; placeholder=&quot;Opcional&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot; style=&quot;justify-content:space-between&quot;&gt;
    &lt;button type=&quot;button&quot; id=&quot;deleteCurrentBtn&quot; class=&quot;expense&quot; onclick=&quot;deleteCurrent()&quot; style=&quot;display:none&quot;&gt;🗑 Excluir lançamento&lt;/button&gt;
    &lt;div style=&quot;display:flex;gap:8px&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;dlg.close()&quot;&gt;Cancelar&lt;/button&gt;
      &lt;button class=&quot;save&quot;&gt;Salvar lançamento&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/form&gt;
&lt;/dialog&gt;

  &lt;p style=&quot;color:#6b7280;margin-top:-6px&quot;&gt;Use para corrigir lançamentos feitos no mês errado. O dia do lançamento e do vencimento é mantido.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Do mês&lt;/label&gt;&lt;input id=&quot;moveFrom&quot; type=&quot;month&quot;&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div id=&quot;movePreview&quot; class=&quot;note&quot; style=&quot;margin:12px 0&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;monthMoveDlg.close()&quot;&gt;Cancelar&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;save&quot; onclick=&quot;moveMonthEntries()&quot;&gt;Mover lançamentos&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/dialog&gt;

  &lt;p style=&quot;color:#6b7280;margin-top:-6px&quot; id=&quot;dashMonthLabel&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;dash-grid&quot;&gt;

    &lt;div class=&quot;dash-box&quot;&gt;&lt;h3&gt;📅 Contas do dia 20&lt;/h3&gt;&lt;strong id=&quot;dDia20&quot;&gt;R$ 0,00&lt;/strong&gt;&lt;div class=&quot;summaryline&quot; id=&quot;dSaldo20&quot;&gt;&lt;/div&gt;&lt;div id=&quot;dList20&quot; class=&quot;dash-list&quot;&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;dash-box dash-wide&quot;&gt;

      &lt;div id=&quot;dBancos&quot; class=&quot;dash-list&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;dash-box dash-wide&quot;&gt;
      &lt;h3&gt;📊 Gastos por categoria&lt;/h3&gt;
      &lt;div id=&quot;dCategorias&quot; class=&quot;dash-list&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;dashboardDlg.close()&quot;&gt;Fechar&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;budgetDlg&quot;&gt;
&lt;div class=&quot;modal&quot;&gt;
  &lt;h2&gt;📊 Limites mensais de gastos&lt;/h2&gt;
  &lt;p style=&quot;color:#6b7280;margin-top:-6px&quot;&gt;Defina quanto pretende gastar por mês em cada categoria. Os limites são editáveis e você pode acrescentar ou excluir categorias.&lt;/p&gt;
  &lt;div id=&quot;budgetList&quot; class=&quot;budget-list&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot; style=&quot;justify-content:space-between&quot;&gt;

  &lt;/div&gt;
&lt;/div&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;reserveGoalDlg&quot;&gt;
&lt;form class=&quot;modal&quot; onsubmit=&quot;saveReserveGoal(event)&quot;&gt;
  &lt;h2&gt;🎯 Meta da Reserva&lt;/h2&gt;
  &lt;p style=&quot;color:#6b7280;margin-top:-6px&quot;&gt;Defina quanto você quer manter guardado. O sistema calcula quanto falta e sugere um valor para separar sem ultrapassar o dinheiro disponível até o próximo salário.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Meta total da reserva&lt;/label&gt;&lt;input id=&quot;goalTotal&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;Ex.: 10000&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Quanto tentar reservar por salário?&lt;/label&gt;
      &lt;select id=&quot;goalMode&quot;&gt;&lt;option value=&quot;percent&quot;&gt;Percentual do disponível&lt;/option&gt;&lt;option value=&quot;fixed&quot;&gt;Valor fixo&lt;/option&gt;&lt;/select&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Percentual sugerido (%)&lt;/label&gt;&lt;input id=&quot;goalPercent&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ou valor fixo sugerido&lt;/label&gt;&lt;input id=&quot;goalFixed&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;Ex.: 300&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;field full&quot;&gt;&lt;label&gt;Nome da meta&lt;/label&gt;&lt;input id=&quot;goalName&quot; value=&quot;Reserva de emergência&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cancel&quot; onclick=&quot;reserveGoalDlg.close()&quot;&gt;Cancelar&lt;/button&gt;&lt;button class=&quot;save&quot;&gt;Salvar meta&lt;/button&gt;&lt;/div&gt;
&lt;/form&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;reserveDlg&quot;&gt;
&lt;form class=&quot;modal&quot; onsubmit=&quot;saveReserve(event)&quot;&gt;
  &lt;h2&gt;🏦 Reserva / Investimento&lt;/h2&gt;
  &lt;p style=&quot;color:#6b7280;margin-top:-6px&quot;&gt;Registre dinheiro separado para reserva ou investimento. Ele não será contado como despesa.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Data&lt;/label&gt;&lt;input id=&quot;rData&quot; type=&quot;date&quot; required&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Valor&lt;/label&gt;&lt;input id=&quot;rValor&quot; type=&quot;number&quot; min=&quot;0.01&quot; step=&quot;0.01&quot; required&gt;&lt;/div&gt;

function syncSnapshot(){return {lancamentos:items,contasFixas:fixed,metaReserva:reserveGoal,limites:budgets,bancos:banks,limiteChequeItau:Number(localStorage.getItem('mf_itau_cheque_limite_v1')||1250)}}

}
function applyCloud(data){
 items=Array.isArray(data.lancamentos)?data.lancamentos:[];

function scheduleSync(){if(!syncReady||syncConflict)return;clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,650)}
async function flushSync(){
 if(!syncReady||syncSaving||!syncDirty||syncConflict)return;
 syncSaving=true;syncDirty=false;
 const payload=syncSnapshot();
 syncNotice('Salvando nos seus aparelhos…');
 try{
  const r=await mfCloudFetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Michelon-Bridge':'1'},credentials:'same-origin',body:JSON.stringify({data:payload,revision:syncRevision})});
  const result=await r.json();
  if(r.status===409){syncConflict=true;syncDirty=true;syncNotice('Houve alteração no outro aparelho. Faça um backup antes de atualizar esta página.');return}
  if(r.status===401){syncReady=false;syncDirty=true;syncNotice('Sua sessão terminou. Entre novamente para sincronizar.', '&lt;a href=&quot;#&quot; onclick=&quot;mfRequireLogin();return false&quot;&gt;Entrar&lt;/a&gt;');return}
  if(!r.ok)throw new Error(result.error||'Falha ao salvar');
  if(result.michelon){
   const ids=new Set(result.michelon.ids);
   items=[...items.filter(x=&gt;!ids.has(x.id)),...result.michelon.entries];
   localStorage.setItem(KEY,JSON.stringify(items));render();
  }
  syncRevision=result.revision;
  syncNotice('✓ Sincronizado com o celular e o PC');
 }catch(e){syncDirty=true;syncNotice('Sem conexão com a nuvem. Seus dados estão neste aparelho; tentarei salvar novamente.');}
 finally{syncSaving=false;if(syncDirty&amp;&amp;syncReady&amp;&amp;!syncConflict){clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,5000)}}
}
async function loadCloud(){
 if(syncSaving||syncDirty||syncConflict)return;
 try{
  const r=await mfCloudFetch('/api/sync',{credentials:'same-origin',cache:'no-store'});
  if(!r.ok)return;
  const result=await r.json();
  if(result.revision&gt;syncRevision&amp;&amp;result.data){syncRevision=result.revision;applyCloud(result.data);syncNotice('✓ Dados atualizados neste aparelho')}
 }catch{}
}
async function initSync(){
 syncNotice('Conectando seus aparelhos…');
 try{
  const r=await mfCloudFetch('/api/sync',{credentials:'same-origin',cache:'no-store'});
  if(r.status===401){syncNotice('Entre com seu acesso pessoal para sincronizar o celular e o PC.', '&lt;a href=&quot;#&quot; onclick=&quot;mfRequireLogin();return false&quot;&gt;Entrar para sincronizar&lt;/a&gt;');return}
  if(!r.ok)throw new Error('Indisponível');
  const result=await r.json();syncRevision=result.revision;
  if(result.data){
   const local=syncSnapshot(),remote=result.data;
   const known=new Set((remote.lancamentos||[]).map(x=&gt;x.id));
   const additions=local.lancamentos.filter(x=&gt;!known.has(x.id));
   if(additions.length){
     const fixedIds=new Set((remote.contasFixas||[]).map(x=&gt;x.id));
     const merged={...remote,lancamentos:[...(remote.lancamentos||[]),...additions],contasFixas:[...(remote.contasFixas||[]),...local.contasFixas.filter(x=&gt;!fixedIds.has(x.id))],bancos:[...new Set([...(remote.bancos||[]),...local.bancos])]};
     applyCloud(merged);syncReady=true;syncDirty=true;await flushSync();
   }else{applyCloud(remote);syncReady=true;syncNotice('✓ Sincronizado com o celular e o PC')}
  }else{syncReady=true;syncNotice('Banco pessoal conectado. Restaure o backup antes de começar a usar este endereço.')}
 }catch(e){syncNotice('Sincronização indisponível. Seus dados continuam neste aparelho.');}
}

function addMonths(dateStr, n){
 const [y,m,d]=dateStr.split('-').map(Number);
 const target=new Date(y,m-1+n,1,12);
 const last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
 const day=Math.min(d,last);
 return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
// Generates remaining installments only on the first save of an installment plan.
// Stable IDs protect retries and saves of the same existing entry on two devices.
function mfInstallmentSpec(value,allowCount=false){
 const text=String(value||'').trim();
 const count=allowCount?text.match(/^(\d+)\s*x?$/i):null;
 const match=count?[count[0],'1',count[1]]:text.match(/^(\d+)\s*\/\s*(\d+)$/);
 if(!match)return null;
 const current=Number(match[1]),total=Number(match[2]);
 if(!Number.isSafeInteger(current)||!Number.isSafeInteger(total)||current&lt;1||total&lt;current||total&gt;120){
   throw new Error('Informe uma parcela válida, por exemplo 1/3, com até 120 parcelas.');
 }
 return {current,total};
}
function mfUpdateInstallmentLabel(){
 let spec;
 try{spec=mfInstallmentSpec($('parcela').value,!$('editId').value);}catch(_){spec=null;}
 $('valorLabel').textContent=spec&amp;&amp;spec.total&gt;1?($('editId').value?'Valor desta parcela':'Valor total da compra'):'Valor';
}
function mfPlanInstallments(obj,previous,records){
 const spec=mfInstallmentSpec(obj.parcela,!previous);
 if(previous?.installmentGroup){
   const oldSpec=mfInstallmentSpec(previous.parcela);
   if(!spec||!oldSpec||spec.current!==oldSpec.current||spec.total!==oldSpec.total){
     throw new Error('As parcelas desta compra já foram geradas. Mantenha a identificação da parcela ao editar este lançamento.');
   }
   return {entry:obj,updates:[],added:0};
 }
 if(!spec||spec.total===1)return {entry:obj,updates:[],added:0};
 if(obj.recorrente==='Sim')throw new Error('Para gerar parcelas, deixe &quot;Recorrente todo mês?&quot; como Não.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.data)||!Number.isFinite(obj.valor)||obj.valor&lt;=0){
   throw new Error('Informe a data e o valor de cada parcela antes de salvar.');
 }
 const group='parcelas:'+obj.id;
 // Existing entries already store a per-installment amount; never divide them again.
 const cents=Math.round(obj.valor*100);
 if(!previous&amp;&amp;cents&lt;spec.total)throw new Error('O valor total deve permitir pelo menos R$ 0,01 por parcela.');
 const amount=number=&gt;previous?obj.valor:(Math.floor(cents/spec.total)+(number&lt;=cents%spec.total?1:0))/100;
 const entry={...obj,valor:amount(spec.current),parcela:spec.current+'/'+spec.total,vencimento:obj.vencimento||obj.data,installmentGroup:group};
 const updates=[];
 let added=0;
 for(let number=spec.current+1;number&lt;=spec.total;number++){
   const offset=number-spec.current;
   const data=addMonths(entry.data,offset),vencimento=addMonths(entry.vencimento,offset);
   const parcela=number+'/'+spec.total,id=obj.id+':parcela:'+number,valor=amount(number);
   const candidates=records.filter(x=&gt;{
     let other;
     try{other=mfInstallmentSpec(x.parcela);}catch(_){return false;}
     return x.id!==obj.id&amp;&amp;!x.installmentGroup&amp;&amp;other&amp;&amp;other.current===number&amp;&amp;other.total===spec.total&amp;&amp;
       x.tipo===entry.tipo&amp;&amp;x.descricao===entry.descricao&amp;&amp;x.categoria===entry.categoria&amp;&amp;x.banco===entry.banco&amp;&amp;
       Math.round(Number(x.valor)*100)===Math.round(valor*100)&amp;&amp;x.data===data&amp;&amp;
       (x.vencimento||x.data)===vencimento&amp;&amp;x.forma===entry.forma;
   });
   if(candidates.length&gt;1)throw new Error('Há mais de um lançamento que pode ser a parcela '+parcela+'. Confira os registros antes de gerar as parcelas.');
   const occupied=records.find(x=&gt;x.id===id);
   if(occupied&amp;&amp;occupied.installmentGroup!==group)throw new Error('Já existe um lançamento com o identificador desta parcela. Confira os registros antes de salvar.');
   if(occupied){continue;}
   if(candidates.length){
     updates.push({...candidates[0],installmentGroup:group});
   }else{
     updates.push({...entry,id,data,vencimento,parcela,valor,status:'Pendente',dataBaixa:'',recorrente:'Não'});
     added++;
   }
 }
 return {entry,updates,added};
}
function save(e){
 e.preventDefault();
 const editing=!!$('editId').value;
 const id=$('editId').value||newId();
 const i=items.findIndex(x=&gt;x.id===id);
 let obj={...(i&gt;=0?items[i]:{}),id,tipo:$('tipo').value,data:$('data').value,descricao:$('descricao').value,categoria:$('categoria').value,banco:$('banco').value,valor:+$('valor').value,status:$('status').value,vencimento:$('vencimento').value,forma:$('forma').value,parcela:$('parcela').value,recorrente:$('recorrente').value,obs:$('obs').value};
 if(obj.status==='Pendente'&amp;&amp;!obj.vencimento){alert('Informe a data de vencimento para lançamentos pendentes.');$('vencimento').focus();return;}
 let plan;
 try{plan=mfPlanInstallments(obj,i&gt;=0?items[i]:null,items);}catch(error){alert(error.message);return;}
 obj=plan.entry;
 if(i&gt;=0) items[i]=obj; else items.push(obj);
 for(const next of plan.updates){
   const existing=items.findIndex(x=&gt;x.id===next.id);
   if(existing&gt;=0)items[existing]=next;else items.push(next);
 }

 if(!editing &amp;&amp; obj.recorrente==='Sim'){
   const group=newId();
   obj.recurringGroup=group;
   // Create 11 future copies, for 12 months total including the current entry.
   for(let n=1;n&lt;12;n++){
     const data=addMonths(obj.data,n);
     const venc=obj.vencimento?addMonths(obj.vencimento,n):'';
     items.push({...obj,id:newId(),data,vencimento:venc,recurringGroup:group,status:'Pendente',dataBaixa:''});
   }
   alert('Lançamento recorrente criado para 12 meses. Os próximos meses ficaram como Pendentes.');
 }
 persist();dlg.close();
 if(plan.added)alert(`${plan.added} parcela(s) futura(s) criada(s) como Pendentes. ${editing?'O valor das parcelas já salvas foi mantido.':'O valor total foi dividido entre as parcelas, preservando o total da compra.'}`);
}

&lt;script id=&quot;michelon-import-bridge-v1&quot;&gt;
(function(){
  'use strict';
  const cutoff='2026-11-01';
  function importRecords(records,commit){
    if(!Array.isArray(records))throw Error('Formato inválido');
    const cutoff='2026-11-01';
    const existing=new Map();
    for(const x of items){
      const ids=[String(x.id||''),...(String(x.obs||'').match(/michelon:(?:finance|uber):[\w.:-]+/g)||[])];
      for(const id of ids)if(id.startsWith('michelon:'))existing.set(id,x);
    }
    const additions=[],updates=[],seen=new Set();
    for(const r of records){
      if(!r||typeof r.origem_id!=='string'||!/^michelon:(finance|uber):[\w.:-]+$/.test(r.origem_id)||seen.has(r.origem_id))continue;
      seen.add(r.origem_id);
      if(!/^2026-\d\d-\d\d$/.test(r.data||'')||r.data&lt;cutoff)continue;
      const d=new Date(r.data+'T12:00:00Z');
      if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==r.data)continue;
      const value=Number(r.valor);
      if(!Number.isFinite(value)||value&lt;=0||!['entrada','saida'].includes(r.tipo))continue;
      const old=existing.get(r.origem_id);
      if(old){
        // Atualizar somente lançamentos gerados pela ponte, nunca lançamentos manuais.
        // Recebimentos parciais usam a mesma origem e crescem até o valor pago.
        if(String(old.id)===r.origem_id &amp;&amp; old.tipo===(r.tipo==='entrada'?'Receita':'Despesa') &amp;&amp;
           old.status===(r.tipo==='entrada'?'Recebido':'Pago') &amp;&amp; Number(old.valor)!==value){
          updates.push({item:old,valor:value});
        }
        continue;
      }
      additions.push({id:r.origem_id,tipo:r.tipo==='entrada'?'Receita':'Despesa',data:r.data,vencimento:r.data,dataBaixa:r.data,descricao:String(r.descricao||'Lançamento Michelon').slice(0,160),categoria:r.fonte==='uber_viagens'?'Uber / Corridas':'Viagens Executivas',banco:(typeof defaultBank==='function'?defaultBank():'Itaú'),valor:value,status:r.tipo==='entrada'?'Recebido':'Pago',forma:'Outros',parcela:'',recorrente:'Não',obs:'Importado do DRE Michelon · '+r.origem_id});
    }
    if(commit&amp;&amp;(additions.length||updates.length)){
      const before=items.slice(),previous=updates.map(u=&gt;({item:u.item,valor:u.item.valor}));
      try{
        for(const u of updates)u.item.valor=u.valor;
        items.push(...additions);persist();
      }catch(err){
        for(const u of previous)u.item.valor=u.valor;
        items.splice(0,items.length,...before);
        throw Error('Não foi possível gravar no Financeiro: '+(err&amp;&amp;err.message||err));
      }
    }
    return {novos:additions.length,atualizados:updates.length,duplicados:records.length-additions.length-updates.length,registros:additions};
  }
  window.__michelonImportFinance=importRecords;
})();

&lt;section class=&quot;page&quot; id=&quot;uber&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;h2&gt;Uber&lt;/h2&gt;&lt;span class=&quot;muted&quot;&gt;Controle diário simples&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div class=&quot;card stack&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Data trabalhada&lt;/label&gt;&lt;input id=&quot;uberData&quot; type=&quot;date&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Faturamento do dia (R$)&lt;/label&gt;&lt;input id=&quot;uberBruto&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Combustível e outros custos (R$)&lt;/label&gt;&lt;input id=&quot;uberCusto&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; id=&quot;uberSalvar&quot;&gt;Registrar dia&lt;/button&gt;&lt;div class=&quot;notice&quot;&gt;Este resumo não substitui o financeiro completo nem desconta automaticamente suas contas fixas.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card scroll&quot;&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dia&lt;/th&gt;&lt;th&gt;Bruto&lt;/th&gt;&lt;th&gt;Custos&lt;/th&gt;&lt;th&gt;Saldo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;uberLista&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;page&quot; id=&quot;rotas&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;h2&gt;Tabela de rotas&lt;/h2&gt;&lt;span class=&quot;muted&quot;&gt;Configuração interna&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div class=&quot;card stack scroll&quot;&gt;&lt;h3 style=&quot;margin:0&quot;&gt;Cadastrar ou atualizar&lt;/h3&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Origem&lt;/label&gt;&lt;input id=&quot;rOrigem&quot; value=&quot;Limeira, SP&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Destino&lt;/label&gt;&lt;input id=&quot;rDestino&quot; placeholder=&quot;Ex.: Aeroporto de Guarulhos&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Apelidos separados por vírgula&lt;/label&gt;&lt;input id=&quot;rAliases&quot; placeholder=&quot;GRU, Cumbica, Guarulhos&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Rodovia principal&lt;/label&gt;&lt;input id=&quot;rRodovia&quot; placeholder=&quot;SP-348 Bandeirantes&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Km ida&lt;/label&gt;&lt;input id=&quot;rIda&quot; min=&quot;.1&quot; step=&quot;.1&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Km volta&lt;/label&gt;&lt;input id=&quot;rVolta&quot; min=&quot;.1&quot; step=&quot;.1&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Pedágios&lt;/label&gt;&lt;select id=&quot;rPedStatus&quot;&gt;&lt;option value=&quot;pendente&quot;&gt;Não verificados&lt;/option&gt;&lt;option value=&quot;nenhum&quot;&gt;Sem pedágios&lt;/option&gt;&lt;option value=&quot;valor&quot;&gt;Com pedágios&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Pedágio ida R$&lt;/label&gt;&lt;input id=&quot;rPedIda&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Pedágio volta R$&lt;/label&gt;&lt;input id=&quot;rPedVolta&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; id=&quot;rSalvar&quot;&gt;Salvar rota&lt;/button&gt;&lt;span class=&quot;muted&quot; id=&quot;rMsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;card scroll&quot;&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Origem → destino&lt;/th&gt;&lt;th&gt;Km&lt;/th&gt;&lt;th&gt;Ação&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rLista&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;page&quot; id=&quot;recuperacao&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;h2&gt;📦 Recuperação dos lançamentos&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;card scroll stack&quot;&gt;&lt;p&gt;&lt;strong&gt;Backup financeiro de 16/10/2026 preservado.&lt;/strong&gt; Estes dados estão anexados a esta versão para consulta e exportação, mas não foram lançados novamente no saldo bancário.&lt;/p&gt;&lt;p id=&quot;recResumo&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;recBaixar&quot; type=&quot;button&quot;&gt;Baixar backup completo recuperado&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;notice&quot;&gt;Os registros originais do financeiro são mantidos sem alteração. Não importe este arquivo como se fosse um backup da nova base. Antes de conciliar, compare com o Meu Financeiro atual para evitar duplicações.&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Data&lt;/th&gt;&lt;th&gt;Descrição&lt;/th&gt;&lt;th&gt;Valor&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;recLista&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;page&quot; id=&quot;config&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;h2&gt;Ajustes e backup&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div class=&quot;card stack&quot;&gt;&lt;h3 style=&quot;margin:0&quot;&gt;Valores de cálculo&lt;/h3&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Passageiro ida (R$/km)&lt;/label&gt;&lt;input id=&quot;cfgIda&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Retorno vazio (R$/km)&lt;/label&gt;&lt;input id=&quot;cfgVazio&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ida e volta com passageiro (R$/km)&lt;/label&gt;&lt;input id=&quot;cfgVolta&quot; min=&quot;0&quot; step=&quot;.01&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Margem (%)&lt;/label&gt;&lt;input id=&quot;cfgMargem&quot; min=&quot;0&quot; step=&quot;1&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; id=&quot;cfgSalvar&quot;&gt;Salvar ajustes&lt;/button&gt;&lt;div class=&quot;notice&quot; style=&quot;background:#e9f5f2;color:#19383c&quot;&gt;&lt;strong&gt;Base offline de pedágios georreferenciados&lt;/strong&gt;&lt;p&gt;Importe um JSON de praças com latitude, longitude, tarifa, sentido e fonte verificada. Os dados ficam neste navegador, sem API paga.&lt;/p&gt;&lt;input accept=&quot;.json,application/json&quot; id=&quot;pedImport&quot; type=&quot;file&quot;/&gt;&lt;div class=&quot;muted&quot; id=&quot;pedImportStatus&quot;&gt;Nenhuma base georreferenciada importada. Também é possível importar JSON oficial da ANTT para localização (sem tarifa).&lt;/div&gt;&lt;button class=&quot;secondary&quot; id=&quot;pedExportModelo&quot; type=&quot;button&quot;&gt;Baixar modelo JSON&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card stack&quot;&gt;&lt;h3 style=&quot;margin:0&quot;&gt;Segurança dos dados&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Faça backup antes de limpar o navegador ou mudar de computador.&lt;/p&gt;&lt;button class=&quot;secondary&quot; id=&quot;exportar&quot;&gt;Exportar backup JSON&lt;/button&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Restaurar backup desta nova base&lt;/label&gt;&lt;input accept=&quot;.json,application/json&quot; id=&quot;importar&quot; type=&quot;file&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;Esta nova base é independente. Ela consegue ler rotas da tabela antiga se você importar o JSON exportado na versão anterior, mas não migra automaticamente todo o aplicativo antigo.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;&lt;/div&gt;
&lt;div aria-labelledby=&quot;waTitulo&quot; aria-modal=&quot;true&quot; class=&quot;wa-modal&quot; id=&quot;waModal&quot; role=&quot;dialog&quot;&gt;&lt;div class=&quot;wa-panel&quot;&gt;&lt;h3 id=&quot;waTitulo&quot;&gt;📲 Importar solicitação do WhatsApp&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Copie a mensagem do cliente e cole abaixo. Confira os campos antes de calcular.&lt;/p&gt;&lt;textarea id=&quot;waTexto&quot; placeholder=&quot;Ex.: Olá, preciso de uma viagem. Origem: Limeira, SP. Destino: Aeroporto de Viracopos. Data: 25/10/2026. Horário: 08:00. Passageiros: 2.&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;wa-preview&quot; id=&quot;waPrevia&quot;&gt;Nenhuma mensagem analisada.&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;waFechar&quot; type=&quot;button&quot;&gt;Cancelar&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;waAnalisar&quot; type=&quot;button&quot;&gt;Identificar dados&lt;/button&gt;&lt;button class=&quot;primary&quot; disabled=&quot;&quot; id=&quot;waAplicar&quot; type=&quot;button&quot;&gt;Usar na cotação&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
(()=&gt;{'use strict';const KEY='michelon_base_nova_v1',LEGACY='michelon_tabela_rotas_v1';const $=id=&gt;document.getElementById(id),money=n=&gt;Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),norm=s=&gt;String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim(),num=id=&gt;Number($(id).value);
const defaults={routes:[],trips:[],finance:[],uber:[],cfg:{ida:2.1,vazio:1.5,volta:3,margem:10}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};for(const k of Object.keys(defaults))if(!(k in db))db[k]=structuredClone(defaults[k]);
if(!db.routes.length){try{const legacy=JSON.parse(localStorage.getItem(LEGACY)||'[]');if(Array.isArray(legacy)){db.routes=legacy.filter(r=&gt;Number(r.ida)&gt;0&amp;&amp;Number(r.volta)&gt;0).map(r=&gt;({id:crypto.randomUUID(),origem:'Limeira, SP',destino:r.nome,aliases:'',rodovia:r.rodovia||'',ida:Number(r.ida),volta:Number(r.volta),pedStatus:r.tipoIda==='nenhum'&amp;&amp;r.tipoVolta==='nenhum'?'nenhum':r.tipoIda==='valor'&amp;&amp;r.tipoVolta==='valor'?'valor':'pendente',pedIda:Number(r.pedIda)||0,pedVolta:Number(r.pedVolta)||0}))}}catch{}}
const save=()=&gt;localStorage.setItem(KEY,JSON.stringify(db));save();let quote=null;
function go(page){document.querySelectorAll('.page').forEach(p=&gt;p.classList.toggle('active',p.id===page));document.querySelectorAll('.nav button').forEach(b=&gt;b.classList.toggle('active',b.dataset.page===page));if(page==='inicio')stats();if(page==='rotas')renderRoutes();if(page==='financeiro')renderFin();if(page==='viagens'||page==='agenda')renderTrips();if(page==='uber')renderUber();document.activeElement.blur()}
document.querySelectorAll('[data-page]').forEach(b=&gt;b.onclick=()=&gt;go(b.dataset.page));document.querySelectorAll('[data-go]').forEach(b=&gt;b.onclick=()=&gt;go(b.dataset.go));
function matches(query,name,aliases=''){const q=norm(query);return q&amp;&amp;[name,...String(aliases).split(',')].some(x=&gt;{const v=norm(x);return v&amp;&amp;(q===v||q.length&gt;=3&amp;&amp;v.includes(q)||v.length&gt;=3&amp;&amp;q.includes(v))})}
function suggest(){const dl=$('sugestoes');dl.replaceChildren();for(const r of db.routes){for(const v of [r.origem,r.destino,...String(r.aliases||'').split(',')])if(v.trim()){const opt=document.createElement('option');opt.value=v.trim();dl.append(opt)}}}suggest();
function calculate(){const origin=$('origem').value.trim(),dest=$('destino').value.trim(),out=$('resultado');quote=null;$('salvarViagem').disabled=true;if(!origin||!dest){out.textContent='Preencha origem e destino.';return}const direct=db.routes.find(r=&gt;matches(origin,r.origem)&amp;&amp;matches(dest,r.destino,r.aliases));const reverse=db.routes.find(r=&gt;matches(dest,r.origem)&amp;&amp;matches(origin,r.destino,r.aliases));const r=direct||reverse;if(!r){out.textContent='Rota não cadastrada para este percurso. Abra Rotas e registre as distâncias conferidas; não vou inventar quilômetros ou pedágios.';return}const ida=direct?r.ida:r.volta,volta=direct?r.volta:r.ida,tipo=$('tipo').value,c=db.cfg,base=tipo==='ida'?ida*c.ida+volta*c.vazio:tipo==='buscar'?ida*c.vazio+volta*c.ida:(ida+volta)*c.volta;let toll=null;if(r.pedStatus==='nenhum')toll=0;if(r.pedStatus==='valor')toll=2*(Number(direct?r.pedIda:r.pedVolta)||0);const total=(base+(toll||0))*(1+c.margem/100);quote={origin,dest,tipo,km:ida+volta,total,toll,road:r.rodovia};out.replaceChildren();const title=document.createElement('h3');title.textContent='Resumo da viagem';out.append(title);const rows=[['Percurso',`${ida.toFixed(1)} km ida + ${volta.toFixed(1)} km retorno`],['Rodovia',r.rodovia||'Não informada']];if(toll&gt;0)rows.push(['Pedágios',money(toll)]);if(toll===null)rows.push(['Pedágios','Não verificados — preço parcial']);rows.push([toll===null?'Valor parcial':'Valor estimado',money(total)]);for(const [a,b] of rows){const div=document.createElement('div');div.className='mini';const left=document.createElement('span'),right=document.createElement('strong');left.textContent=a;right.textContent=b;div.append(left,right);out.append(div)}$('salvarViagem').disabled=false}
$('calcular').onclick=calculate;
$('salvarViagem').onclick=()=&gt;{if(!quote)return;db.trips.unshift({...quote,id:crypto.randomUUID(),date:new Date().toLocaleDateString('pt-BR'),status:'Cotação'});save();alert('Cotação salva em Minhas viagens e Agenda.');go('viagens')};
function row(tbody,values,button){const tr=document.createElement('tr');values.forEach(v=&gt;{const td=document.createElement('td');td.textContent=String(v);tr.append(td)});if(button){const td=document.createElement('td');td.append(button);tr.append(td)}tbody.append(tr)}
function btn(label,fn){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=fn;return b}
function renderTrips(){for(const id of ['listaViagens','listaAgenda'])$(id).replaceChildren();db.trips.forEach(t=&gt;{row($('listaViagens'),[t.date,t.origin+' → '+t.dest,money(t.total)],btn('Excluir',()=&gt;{if(confirm('Excluir cotação?')){db.trips=db.trips.filter(x=&gt;x.id!==t.id);save();renderTrips()}}));row($('listaAgenda'),[t.date,t.origin,t.dest,t.status||'Cotação'])})}
function renderRoutes(){$('rLista').replaceChildren();db.routes.forEach(r=&gt;row($('rLista'),[r.origem+' → '+r.destino,`${r.ida} / ${r.volta}`],btn('Editar',()=&gt;{for(const [id,key] of [['rOrigem','origem'],['rDestino','destino'],['rAliases','aliases'],['rRodovia','rodovia'],['rIda','ida'],['rVolta','volta'],['rPedStatus','pedStatus'],['rPedIda','pedIda'],['rPedVolta','pedVolta']])$(id).value=r[key]??'';$('rSalvar').dataset.edit=r.id})));$('statRoutes').textContent=db.routes.length;suggest()}
$('rSalvar').onclick=()=&gt;{const origem=$('rOrigem').value.trim(),destino=$('rDestino').value.trim(),ida=num('rIda'),volta=num('rVolta'),pedStatus=$('rPedStatus').value,pedIda=num('rPedIda'),pedVolta=num('rPedVolta');if(!origem||!destino||!(ida&gt;0&amp;&amp;volta&gt;0)){alert('Informe origem, destino e as duas distâncias conferidas.');return}if(pedStatus==='valor'&amp;&amp;(!(pedIda&gt;=0&amp;&amp;pedVolta&gt;=0)||!$('rPedIda').value||!$('rPedVolta').value)){alert('Informe os valores de pedágio de ambos os sentidos.');return}const id=$('rSalvar').dataset.edit||crypto.randomUUID(),r={id,origem,destino,aliases:$('rAliases').value,rodovia:$('rRodovia').value,ida,volta,pedStatus,pedIda:pedStatus==='valor'?pedIda:0,pedVolta:pedStatus==='valor'?pedVolta:0};db.routes=db.routes.filter(x=&gt;x.id!==id);db.routes.push(r);delete $('rSalvar').dataset.edit;save();renderRoutes();$('rMsg').textContent='Rota salva. Ela já aparece na busca da cotação.'};
function renderFin(){$('finLista').replaceChildren();let saldo=0;db.finance.forEach(f=&gt;{saldo+=f.tipo==='entrada'?f.valor:-f.valor;row($('finLista'),[(f.date?f.date+' · ':'')+f.desc,(f.tipo==='entrada'?'+ ':'− ')+money(f.valor)],btn('Excluir',()=&gt;{db.finance=db.finance.filter(x=&gt;x.id!==f.id);save();renderFin()}))});$('finSaldo').textContent=money(saldo);$('statBalance').textContent=money(saldo)}
$('finSalvar').onclick=()=&gt;{const desc=$('finDesc').value.trim(),valor=num('finValor');if(!desc||!(valor&gt;0)){alert('Preencha descrição e valor positivo.');return}db.finance.unshift({id:crypto.randomUUID(),desc,valor,date:($('finData').value||new Date().toISOString().slice(0,10)).split('-').reverse().join('/'),tipo:$('finTipo').value});save();$('finDesc').value='';$('finValor').value='';renderFin()};
$('uberSalvar').onclick=()=&gt;{const bruto=num('uberBruto'),custo=num('uberCusto');if(!(bruto&gt;=0&amp;&amp;custo&gt;=0)||!$('uberBruto').value||!$('uberCusto').value){alert('Preencha os valores.');return}db.uber.unshift({date:($('uberData').value||new Date().toISOString().slice(0,10)).split('-').reverse().join('/'),bruto,custo});save();renderUber()};

 const rows=Array.isArray(data)?data:Array.isArray(data.resultado)?data.resultado:Array.isArray(data.results)?data.results:Array.isArray(data.data)?data.data:Array.isArray(data.features)?data.features:null;
 if(!rows)throw Error('Formato de dados inesperado');
 return rows.map(r=&gt;{
  const o=r.properties||r,latitude=dec(pick(o,'latitude','lat')),longitude=dec(pick(o,'longitude','lon','lng'));
  const praca=pick(o,'pracadepedagio','praca','nome');
  if(!praca||!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)&gt;90||Math.abs(longitude)&gt;180)return null;
  return {praca:String(praca),rodovia:String(pick(o,'rodovia','br')||''),sentido:String(pick(o,'sentido','direcao')||''),situacao:String(pick(o,'situacao','status')||''),latitude,longitude,fonte:URL,tarifa:null};
 }).filter(Boolean);
}

  if(!response.ok)throw Error('HTTP '+response.status);
  const rows=extract(await response.json());if(!rows.length)throw Error('Nenhuma localização válida');
  localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(KEY+'_data',new Date().toISOString());
  state.textContent=rows.length+' praças carregadas da ANTT. Tarifas continuam pendentes.';
  return true;
 }catch(e){state.textContent='Consulta online indisponível ('+(e.name==='AbortError'?'tempo esgotado':e.message)+'). Dados anteriores preservados.';return false}

}

},true);

})();
